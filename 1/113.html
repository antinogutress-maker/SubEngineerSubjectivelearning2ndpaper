<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Memorization Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap');

        :root {
            --bg-dark: #020617;
            --bg-panel: #0f172a;
            --text-main: #f8fafc;
            --accent-gold: #fbbf24;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #0ea5e9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            min-width: 900px; /* Forces wide layout for Desktop Site */
        }

        /* --- DESKTOP SITE WARNING --- */
        #desktop-hint {
            background: linear-gradient(90deg, #ef4444, #f97316);
            color: white;
            text-align: center;
            padding: 8px 20px;
            font-size: 1.1rem;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #desktop-hint button {
            background: rgba(0,0,0,0.4);
            border: 1px solid white;
            color: white;
            padding: 4px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #desktop-hint button:hover { background: white; color: black; }

        /* --- HEADER --- */
        .header {
            height: 75px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 2px solid #1e293b;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 10;
        }
        .header h1 {
            font-size: 2rem; font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #34d399);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 1.5px;
        }
        .stats-box {
            position: absolute; right: 30px;
            display: flex; gap: 15px;
        }
        .stat-badge {
            background: rgba(2, 6, 23, 0.9);
            border: 2px solid;
            padding: 6px 18px; border-radius: 25px;
            font-family: 'JetBrains Mono', monospace; font-size: 1.3rem;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        #score-badge { border-color: var(--accent-gold); color: var(--accent-gold); }
        #notes-badge { border-color: var(--accent-blue); color: var(--accent-blue); }

        /* --- GAME AREA (65% Height) --- */
        .game-area {
            flex: 0 0 65vh;
            display: flex;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            position: relative;
            overflow: hidden;
        }

        /* Fixed Bow Area (Left - Perfectly Centered Vertically) */
        .bow-container {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%); 
            width: 320px; 
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        /* Scrolling Targets Area (Right) 
           CRITICAL FIX: This now spans the entire remaining width of the screen. 
           It leaves no boundary on the left to clip the embedded arrows! */
        .targets-container {
            position: absolute;
            left: 320px; /* Start right after the bow */
            right: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* Targets stay on the far right */
            padding: 60px 40px 60px 0;
            gap: 150px; 
            background: transparent; 
            z-index: 10;
        }
        .targets-container::-webkit-scrollbar { width: 10px; }
        .targets-container::-webkit-scrollbar-track { background: transparent; }
        .targets-container::-webkit-scrollbar-thumb { background: #475569; border-radius: 5px; }

        /* --- TARGETS --- */
        .target-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            cursor: crosshair;
            transition: transform 0.2s;
        }
        .target-wrapper:hover .target-svg { transform: scale(1.1); }
        
        .target-wrapper.impact-anim { animation: impact 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
        @keyframes impact {
            0% { transform: translateX(0); }
            20% { transform: translateX(15px) rotate(5deg); filter: brightness(1.5); }
            40% { transform: translateX(-10px) rotate(-3deg); }
            60% { transform: translateX(5px) rotate(2deg); }
            80% { transform: translateX(-2px) rotate(-1deg); }
            100% { transform: translateX(0); filter: brightness(1); }
        }

        .target-svg { width: 110px; height: 110px; filter: drop-shadow(0 0 15px currentColor); transition: transform 0.3s; z-index: 5;}
        
        .target-label {
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
            text-align: center;
            background: #020617;
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid currentColor;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            z-index: 5;
        }

        /* Embedded Arrows Container (Attached to left side of target) */
        .embedded-arrows-area {
            position: absolute;
            left: -280px; /* Stick out far to the left to hold long arrows */
            top: 0;
            width: 280px;
            height: 100px;
            pointer-events: none;
            z-index: 1;
        }

        /* --- ARROW TRAY (35% Height) --- */
        .tray-container {
            flex: 1;
            background: #020617;
            border-top: 5px solid #1e293b;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: center;
            align-content: flex-start;
            padding: 25px;
            gap: 20px;
            overflow-y: auto;
            box-shadow: inset 0 15px 30px rgba(0,0,0,0.9);
        }

        .note-card {
            width: calc(33% - 20px);
            min-width: 260px;
            min-height: 100px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            position: relative;
        }
        .note-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: #475569; border-radius: 10px 0 0 10px; transition: 0.2s;
        }
        .note-card:hover { transform: translateY(-4px); border-color: var(--accent-blue); color: #fff; }
        .note-card:hover::before { background: var(--accent-blue); }
        
        .note-card.selected {
            border-color: var(--accent-gold);
            background: rgba(251, 191, 36, 0.15);
            color: var(--accent-gold);
            transform: scale(0.95);
            pointer-events: none;
            box-shadow: inset 0 0 20px rgba(251, 191, 36, 0.2);
        }
        .note-card.selected::before { background: var(--accent-gold); }
        .note-card.hidden { display: none; }

        /* --- SVG BOW & ARROWS --- */
        .bow-svg { width: 100%; height: 100%; overflow: visible; }
        
        .high-contrast-tooltip {
            background: #fbbf24; /* Bright Yellow/Amber */
            color: #000;         /* Solid Black Text */
            padding: 8px 16px; 
            border-radius: 6px;
            font-size: 14px; 
            font-weight: 800;
            border: 2px solid #000;
            text-align: center;
            width: max-content;
            max-width: 240px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            margin: 0 auto;
        }

        /* Container to perfectly center text over the arrow shaft */
        .arrow-composition {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px; /* Longer arrow */
            height: 20px;
        }
        .arrow-text-layer {
            position: absolute;
            top: -38px; /* Hovers perfectly above the shaft */
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .flying-arrow {
            position: fixed;
            z-index: 200;
            pointer-events: none;
            transform-origin: center right; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .embedded-arrow {
            position: absolute;
            right: 0px; 
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: right center;
            animation: thwack 0.3s ease-out forwards;
        }
        
        @keyframes thwack {
            0% { transform: translateX(-50px) scale(1.2); opacity: 0; }
            50% { transform: translateX(10px) scale(0.9); opacity: 1; }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }

        .particle { position: fixed; border-radius: 50%; pointer-events: none; z-index: 150; }

        .float-text {
            position: fixed;
            font-weight: 900; font-size: 2.2rem;
            pointer-events: none; z-index: 300;
            text-shadow: 0 3px 8px rgba(0,0,0,1);
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.5); }
        }

        /* --- END SCREEN (BOOK CHAPTER SUMMARY) --- */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #020617;
            display: flex; flex-direction: column; align-items: center;
            padding: 60px 40px; z-index: 500;
            opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease;
            overflow-y: auto;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }
        
        .book-summary {
            width: 100%; max-width: 800px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            margin-bottom: 40px;
        }
        .book-summary h2 {
            font-size: 2.8rem; color: #fbbf24; text-align: center; margin-bottom: 10px;
            text-transform: uppercase; border-bottom: 2px solid #334155; padding-bottom: 20px;
        }
        .book-summary p.score-report {
            text-align: center; font-size: 1.4rem; color: #94a3b8; margin-bottom: 40px; font-family: 'JetBrains Mono';
        }

        .chapter-section { margin-bottom: 30px; }
        .chapter-section h3 {
            font-size: 1.7rem; color: #38bdf8; margin-bottom: 15px;
            display: flex; align-items: center; gap: 10px;
        }
        .chapter-section ul {
            list-style-type: none; padding-left: 20px;
        }
        .chapter-section li {
            font-size: 1.3rem; color: #e2e8f0; margin-bottom: 12px; position: relative;
            line-height: 1.5;
        }
        .chapter-section li::before {
            content: "➔"; position: absolute; left: -30px; color: #10b981; font-weight: bold;
        }

        button.play-btn {
            background: linear-gradient(135deg, #0ea5e9, #10b981);
            color: #000; border: none; padding: 20px 70px;
            font-size: 1.6rem; font-weight: 900; border-radius: 40px;
            cursor: pointer; transition: transform 0.2s;
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.4);
            flex-shrink: 0;
        }
        button.play-btn:hover { transform: scale(1.05); }

    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- 1. MASTER GAME DATA -->
    <!-- ========================================== -->
    <script>
        const MASTER_GAME_DATA = {
            gameTitle: "Click 👇  bullet Points to load",
            targets: [
                { id: 1, name: "Chain Surveying", color: "#38bdf8" },
                { id: 2, name: "Compass Surveying", color: "#fb7185" },
                { id: 3, name: "Plane Table Surveying", color: "#10b981" },
                { id: 4, name: "Tacheometric Survey", color: "#fbbf24" }
            ],
            notes: [
                { id: 101, targetId: 1, text: "Small area having Fairly level ground" },
                { id: 102, targetId: 1, text: "No angular measurements" },
                { id: 201, targetId: 2, text: "Used where No Effect of electric field" },
                { id: 202, targetId: 2, text: "Angular and Linear measurements" },
                { id: 301, targetId: 3, text: "Fairly open ground" },
                { id: 302, targetId: 3, text: "Swift method of Surveying" },
                { id: 401, targetId: 4, text: "Suitable for Broken Ground, Deep ravines" },
                { id: 402, targetId: 4, text: "Where Direct Chaining Becomes difficult" }
            ]
        };
    </script>

    <div id="desktop-hint">
        <span>📱 Enable <strong>"Desktop Site"</strong> in your mobile browser settings for the absolute best view!</span>
        <button onclick="document.getElementById('desktop-hint').style.display='none'">Dismiss</button>
    </div>

    <div class="header">
        <h1 id="ui-title">Game Title</h1>
        <div class="stats-box">
            <div class="stat-badge" id="score-badge">⭐ <span id="score">0</span></div>
            <div class="stat-badge" id="notes-badge">Notes Left: <span id="notesLeft">0</span></div>
        </div>
    </div>

    <!-- 65% Height Game Area -->
    <div class="game-area">
        
        <!-- Left: Fixed, Perfectly Centered Bow -->
        <div class="bow-container" id="bowContainer">
            <svg class="bow-svg" viewBox="0 0 320 400" id="bowGraphics">
                <defs>
                    <linearGradient id="wood" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#451a03" />
                        <stop offset="50%" stop-color="#92400e" />
                        <stop offset="100%" stop-color="#451a03" />
                    </linearGradient>
                    <filter id="shadow">
                        <feDropShadow dx="8" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.9"/>
                    </filter>
                </defs>

                <!-- Bow Limbs -->
                <path d="M 180,20 Q 260,200 180,380" fill="none" stroke="url(#wood)" stroke-width="20" stroke-linecap="round" filter="url(#shadow)"/>
                <path d="M 180,20 Q 260,200 180,380" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Leather Grip -->
                <path d="M 220,165 Q 228,200 220,235" fill="none" stroke="#0f172a" stroke-width="24" stroke-linecap="round"/>
                <path d="M 220,165 Q 228,200 220,235" fill="none" stroke="#334155" stroke-width="20" stroke-linecap="round" stroke-dasharray="5 3"/>

                <!-- Bow String -->
                <path id="bowString" d="M 180,20 L 180,380" fill="none" stroke="#cbd5e1" stroke-width="4"/>

                <!-- Loaded Arrow (Increased boundaries to completely avoid clipping) -->
                <g id="loadedArrow" style="display: none; transition: transform 0.1s;">
                    <!-- Massive bounding box ensures text NEVER clips -->
                    <foreignObject x="-150" y="150" width="350" height="100">
                        <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; justify-content: center; width: 100%;">
                            <div class="high-contrast-tooltip" id="loadedNoteText"></div>
                        </div>
                    </foreignObject>
                    
                    <!-- Arrow Shaft -->
                    <line x1="-30" y1="200" x2="180" y2="200" stroke="#f8fafc" stroke-width="5" />
                    <!-- Head -->
                    <polygon points="180,192 205,200 180,208" fill="#ef4444" />
                    <!-- Feathers -->
                    <polygon points="-30,200 -40,185 -15,200" fill="#0ea5e9" />
                    <polygon points="-30,200 -40,215 -15,200" fill="#0ea5e9" />
                </g>
            </svg>
        </div>

        <!-- Right: Scrolling Targets spanning full remaining width -->
        <div class="targets-container" id="targetsContainer"></div>
    </div>

    <!-- 35% Height Notes Tray -->
    <div class="tray-container" id="trayContainer"></div>

    <!-- End Game Overlay (Book Chapter Style) -->
    <div class="overlay" id="endScreen">
        <div class="book-summary">
            <h2>Chapter Mastered</h2>
            <p class="score-report">Final Score: <span id="finalScore" style="color:#fbbf24; font-weight:bold;">0</span></p>
            <div id="summaryContent"></div>
        </div>
        <button class="play-btn" onclick="startGame()">Retake Test</button>
    </div>

    <script>
        // --- RELIABLE AUDIO ENGINE ---
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        const playSound = (type) => {
            if (!audioCtx) return;
            try {
                if (type === 'success') {
                    // Ascending Chime (C5, E5, G5, C6)
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    osc.type = 'triangle';
                    
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); 
                    osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3); 
                    
                    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.6, audioCtx.currentTime + 0.05);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                    
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.6);

                } else if (type === 'error') {
                    // Deep Thud/Buzz
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    osc.type = 'sawtooth';
                    
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
                    
                    gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {}
        };

        // Guarantee audio context unlocks
        document.body.addEventListener('click', initAudio, { once: true });
        document.body.addEventListener('touchstart', initAudio, { once: true });

        // --- GAME LOGIC ---
        const gameData = MASTER_GAME_DATA;
        document.getElementById('ui-title').innerText = gameData.gameTitle;

        let score = 0;
        let notesRemaining = 0;
        let selectedNote = null;
        let isAnimating = false;

        const targetsContainer = document.getElementById('targetsContainer');
        const trayContainer = document.getElementById('trayContainer');
        const scoreEl = document.getElementById('score');
        const notesLeftEl = document.getElementById('notesLeft');
        const bowString = document.getElementById('bowString');
        const loadedArrow = document.getElementById('loadedArrow');
        const loadedNoteText = document.getElementById('loadedNoteText');

        let embeddedCounts = {}; 

        function startGame() {
            score = 0;
            notesRemaining = gameData.notes.length;
            scoreEl.innerText = score;
            notesLeftEl.innerText = notesRemaining;
            selectedNote = null;
            isAnimating = false;
            embeddedCounts = {};
            
            document.getElementById('endScreen').classList.remove('active');
            
            resetBow();
            buildTargets();
            buildTray();
        }

        function buildTargets() {
            targetsContainer.innerHTML = '';
            gameData.targets.forEach(target => {
                embeddedCounts[target.id] = 0; 

                const div = document.createElement('div');
                div.className = 'target-wrapper';
                div.id = `target-${target.id}`;
                
                const svg = `
                    <svg class="target-svg" viewBox="0 0 100 100" style="color: ${target.color}">
                        <circle cx="50" cy="50" r="45" fill="#020617" stroke="currentColor" stroke-width="8"/>
                        <circle cx="50" cy="50" r="25" fill="#0f172a" stroke="currentColor" stroke-width="4"/>
                        <circle cx="50" cy="50" r="10" fill="currentColor"/>
                    </svg>
                `;
                
                div.innerHTML = `
                    <div class="embedded-arrows-area" id="embed-area-${target.id}"></div>
                    ${svg}
                    <div class="target-label" style="color: ${target.color}; border-color: ${target.color}">${target.name}</div>
                `;
                
                div.onclick = () => shootTarget(target, div);
                targetsContainer.appendChild(div);
            });
        }

        function buildTray() {
            trayContainer.innerHTML = '';
            const shuffledNotes = [...gameData.notes].sort(() => Math.random() - 0.5);
            
            shuffledNotes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.id = `note-${note.id}`;
                card.innerText = note.text;
                card.onclick = () => loadBow(note, card);
                trayContainer.appendChild(card);
            });
        }

        function loadBow(note, cardElement) {
            if (isAnimating) return;
            initAudio(); // Ensure context is awake

            document.querySelectorAll('.note-card').forEach(c => c.classList.remove('selected'));
            
            selectedNote = note;
            cardElement.classList.add('selected');

            loadedArrow.style.display = 'block';
            loadedNoteText.innerText = note.text;
            
            bowString.setAttribute('d', 'M 180,20 L 20,200 L 180,380'); 
        }

        function resetBow() {
            loadedArrow.style.display = 'none';
            bowString.setAttribute('d', 'M 180,20 L 180,380'); 
        }

        // Beautifully composed arrow with centered text
        function createArrowHTML(text) {
            return `
                <div class="arrow-composition">
                    <div class="arrow-text-layer">
                        <div class="high-contrast-tooltip">${text}</div>
                    </div>
                    <svg width="200" height="20" viewBox="0 0 200 20" style="overflow:visible;">
                        <line x1="0" y1="10" x2="180" y2="10" stroke="#f8fafc" stroke-width="5" />
                        <polygon points="180,2 200,10 180,18" fill="#ef4444" />
                        <polygon points="0,10 -15,-2 10,10" fill="#0ea5e9" />
                        <polygon points="0,10 -15,22 10,10" fill="#0ea5e9" />
                    </svg>
                </div>
            `;
        }

        function shootTarget(targetData, targetEl) {
            if (!selectedNote || isAnimating) return;
            isAnimating = true;

            const bowRect = bowString.getBoundingClientRect();
            const targetSvgRect = targetEl.querySelector('.target-svg').getBoundingClientRect();

            // Coordinate logic
            const startX = bowRect.left + 20; 
            const startY = bowRect.top + (bowRect.height / 2);
            const endX = targetSvgRect.left + (targetSvgRect.width / 2);
            const endY = targetSvgRect.top + (targetSvgRect.height / 2);

            resetBow();
            
            const flyingArrow = document.createElement('div');
            flyingArrow.className = 'flying-arrow';
            flyingArrow.innerHTML = createArrowHTML(selectedNote.text);
            document.body.appendChild(flyingArrow);

            const deltaX = endX - startX;
            const deltaY = endY - startY;
            const angle = Math.atan2(deltaY, deltaX) * (180 / Math.PI);

            flyingArrow.style.left = `${startX}px`;
            flyingArrow.style.top = `${startY}px`;
            flyingArrow.style.transform = `translate(-100%, -50%) rotate(${angle}deg)`;

            const animation = flyingArrow.animate([
                { transform: `translate(-100%, -50%) rotate(${angle}deg)` },
                { transform: `translate(calc(-100% + ${deltaX}px), calc(-50% + ${deltaY}px)) rotate(${angle}deg)` }
            ], {
                duration: 350,
                easing: 'ease-in'
            });

            animation.onfinish = () => {
                flyingArrow.remove();
                evaluateHit(targetData, targetEl, endX, endY, angle);
            };
        }

        function evaluateHit(targetData, targetEl, hitX, hitY, angle) {
            const isCorrect = (selectedNote.targetId === targetData.id);
            const noteCard = document.getElementById(`note-${selectedNote.id}`);

            targetEl.classList.remove('impact-anim');
            void targetEl.offsetWidth; 

            if (isCorrect) {
                playSound('success');
                score += 10;
                notesRemaining--;
                
                targetEl.classList.add('impact-anim'); 
                createExplosion(hitX, hitY, targetData.color);
                showFloatingText("+10", hitX, hitY, "#10b981");
                
                embedArrow(targetData.id, selectedNote.text, angle);
                noteCard.classList.add('hidden'); 
                
                if (notesRemaining === 0) {
                    setTimeout(showWinScreen, 1200);
                }
            } else {
                playSound('error');
                score -= 5;
                
                targetEl.classList.add('impact-anim');
                createExplosion(hitX, hitY, "#ef4444"); 
                showFloatingText("-5", hitX, hitY, "#ef4444");
                
                noteCard.classList.remove('selected'); 
            }

            scoreEl.innerText = score;
            notesLeftEl.innerText = notesRemaining;
            selectedNote = null;
            isAnimating = false;
        }

        function embedArrow(targetId, text, angle) {
            const embedArea = document.getElementById(`embed-area-${targetId}`);
            const arrowCount = embeddedCounts[targetId];
            
            const embedded = document.createElement('div');
            embedded.className = 'embedded-arrow';
            embedded.innerHTML = createArrowHTML(text);
            
            // INCREASED vertical spread so large boxes don't block each other
            const offsets = [0, -60, 60, -120, 120]; 
            const yOffset = offsets[arrowCount % offsets.length];
            
            embedded.style.top = `calc(50% + ${yOffset}px)`;
            
            const finalAngle = angle + (Math.random() * 8 - 4);
            embedded.style.transform = `translateY(-50%) rotate(${finalAngle}deg)`;
            
            embedArea.appendChild(embedded);
            embeddedCounts[targetId]++;
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.background = color;
                particle.style.boxShadow = `0 0 15px ${color}`;
                
                const size = Math.random() * 6 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                document.body.appendChild(particle);

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 100 + 40;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                const anim = particle.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${dx}px, ${dy}px) scale(0)`, opacity: 0 }
                ], {
                    duration: Math.random() * 500 + 300,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
                });

                anim.onfinish = () => particle.remove();
            }
        }

        function showFloatingText(text, x, y, color) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.innerText = text;
            el.style.color = color;
            el.style.left = `${x - 20}px`;
            el.style.top = `${y - 40}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function showWinScreen() {
            document.getElementById('finalScore').innerText = score;
            
            const summaryContent = document.getElementById('summaryContent');
            summaryContent.innerHTML = '';
            
            gameData.targets.forEach(target => {
                const targetNotes = gameData.notes.filter(n => n.targetId === target.id);
                if(targetNotes.length === 0) return;

                const section = document.createElement('div');
                section.className = 'chapter-section';
                
                let html = `<h3 style="color: ${target.color}">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="${target.color}"><circle cx="12" cy="12" r="10"/></svg>
                                ${target.name}
                            </h3>`;
                
                html += `<ul>`;
                targetNotes.forEach(note => {
                    html += `<li>${note.text}</li>`;
                });
                html += `</ul>`;
                
                section.innerHTML = html;
                summaryContent.appendChild(section);
            });

            document.getElementById('endScreen').classList.add('active');
        }

        // Boot Game
        startGame();

    </script>
</body>
</html>
