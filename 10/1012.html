
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nepal Highway Engineering History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --slate-950: #020617;
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --blue-500: #3b82f6;
            --emerald-500: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--slate-950);
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .blueprint-bg {
            background-color: var(--slate-950);
            background-image: 
                linear-gradient(rgba(51, 65, 85, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(51, 65, 85, 0.2) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* 3D Flip Card Logic */
        .card-container {
            perspective: 1200px;
            height: 340px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .card-back {
            background-color: var(--slate-900);
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            border: 2px solid rgba(148, 163, 184, 0.2);
        }

        /* SVG Animation */
        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }
        .sketch-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
        }
        .card-container:not(.flipped) .sketch-path {
            animation: draw 2.5s ease-out forwards;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .progress-glow {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="blueprint-bg min-h-screen">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-lg border-b border-slate-800 px-4 py-4">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-emerald-500 rounded-xl flex items-center justify-center shadow-lg">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v14Z"/><path d="M12 11h4"/><path d="M12 15h4"/><path d="M8 7h8"/></svg>
                </div>
                <div>
                    <h1 class="text-sm font-black tracking-tight text-white leading-tight uppercase">Highway Engineering</h1>
                    <p class="text-[10px] font-bold text-slate-500 tracking-[0.2em]">NEPAL_ROAD_HISTORY</p>
                </div>
            </div>
            <button onclick="resetApp()" class="text-[10px] font-black bg-slate-800 text-slate-300 px-3 py-2 rounded-lg border border-slate-700 active:scale-95 transition-transform">RESET</button>
        </div>
        
        <!-- Progress Bar -->
        <div class="max-w-md mx-auto mt-4 h-1 bg-slate-800 rounded-full overflow-hidden">
            <div id="progressBar" class="h-full bg-gradient-to-r from-blue-500 to-emerald-500 transition-all duration-700 ease-out" style="width: 0%"></div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-5 py-8 pb-32">
        <div class="mb-10">
            <h2 class="text-3xl font-black text-white mb-2 italic">Historical Log</h2>
            <p class="text-sm text-slate-400 font-medium leading-relaxed">Study the technical sketches. Tap to reveal the historical data recorded in the field notes.</p>
        </div>

        <div id="timeline" class="space-y-12">
            <!-- Cards will be injected here by JS -->
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 w-full bg-slate-900/90 backdrop-blur-xl border-t border-slate-800 py-4 px-6 z-40">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2 text-slate-500">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                <span class="text-[10px] font-black uppercase tracking-widest">Internal Engineering Ref</span>
            </div>
            <div id="stats" class="text-[10px] font-mono text-blue-500 font-bold">0 / 6 COMPLETED</div>
        </div>
    </footer>

    <script>
        const timelineData = [
            {
                id: 1,
                year: "Pre 2007 B.S.",
                title: "Negligible Network",
                details: "Road network was negligible (~376 km total). Primary focus was on foot trails. The first motorable dirt road was surveyed around 1981 B.S.",
                gradient: "from-orange-500 to-amber-500",
                svg: `<svg viewBox="0 0 400 240" fill="none" class="w-full h-full"><path class="sketch-path" d="M20 200 Q 100 180 150 210 T 300 170 T 380 120" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 6"/><path d="M0 40 Q 200 20 400 40" stroke="#1e293b" stroke-width="1"/><path d="M0 80 Q 200 60 400 80" stroke="#1e293b" stroke-width="1"/><text x="20" y="220" fill="#64748b" font-size="10" class="mono">DIRT_SURVEY_1981</text></svg>`
            },
            {
                id: 2,
                year: "2013 B.S.",
                title: "First 5 year Plan and Tribhuvan Highway",
                details: " The 1st Five Year Plan Prioritized Construction of Road Networks. Tribhuwan Highway Became the critical first motorable link connecting Kathmandu valley to the Indian border.",
                gradient: "from-blue-500 to-indigo-500",
                svg: `<svg viewBox="0 0 400 240" fill="none" class="w-full h-full"><path d="M0 240 L 150 80 L 250 160 L 400 40" stroke="#1e293b" stroke-width="20" opacity="0.2"/><path class="sketch-path" d="M50 220 L 120 200 L 80 180 L 150 160 L 110 140 L 180 120 L 140 100 L 210 80" stroke="#3b82f6" stroke-width="3" stroke-linejoin="round"/><circle cx="210" cy="80" r="10" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2 2"/><text x="230" y="85" fill="#3b82f6" font-size="10" class="mono">KTM_GATEWAY</text></svg>`
            },
            {
                id: 3,
                year: "2019 B.S.",
                title: "Mahendra Highway",
                details: "Initiated by King Mahendra. Established the primary 'East-West' transport backbone, spanning across the Terai plains.",
                gradient: "from-emerald-500 to-teal-500",
                svg: `<svg viewBox="0 0 400 240" fill="none" class="w-full h-full"><rect x="0" y="110" width="400" height="20" fill="#065f46" opacity="0.1"/><line x1="0" y1="120" x2="400" y2="120" stroke="#10b981" stroke-width="4" stroke-dasharray="20 10" class="sketch-path"/><path d="M180 100 V 140 M 220 100 V 140 M 180 120 H 220" stroke="#10b981" stroke-width="2"/><text x="10" y="100" fill="#64748b" font-size="8" class="mono">EAST_WEST_AXIS</text></svg>`
            },
            {
                id: 4,
                year: "2027 B.S.",
                title: "DOR & NRS 2027",
                details: "Department of Roads established to manage Strategic Road Network (SRN). First Nepal Road Standard (NRS) 2027 introduced technical codification.",
                gradient: "from-purple-500 to-pink-500",
                svg: `<svg viewBox="0 0 400 240" fill="none" class="w-full h-full"><path d="M100 180 L 130 150 H 270 L 300 180" fill="#a855f7" opacity="0.1"/><path d="M130 150 H 270" stroke="#a855f7" stroke-width="4" class="sketch-path"/><text x="160" y="140" fill="#a855f7" font-size="10" font-weight="bold" class="mono">NRS_STANDARD_V1</text><rect x="50" y="50" width="80" height="40" stroke="#a855f7" stroke-dasharray="4 2"/></svg>`
            },
            {
                id: 5,
                year: "2055 B.S.",
                title: "DoLIDAR Established",
                details: "Focused on Local Road Network (LRN) and Agriculture roads, emphasizing rural connectivity and decentralized management.",
                gradient: "from-yellow-500 to-orange-500",
                svg: `<svg viewBox="0 0 400 240" fill="none" class="w-full h-full"><circle cx="100" cy="180" r="8" stroke="#eab308"/><circle cx="300" cy="60" r="8" stroke="#eab308"/><path d="M100 180 Q 200 180 200 120 T 300 60" stroke="#eab308" stroke-width="2" stroke-dasharray="5 5" class="sketch-path"/><text x="140" y="140" fill="#64748b" font-size="9" class="mono">RURAL_LINKS</text></svg>`
            },
            {
                id: 6,
                year: "2063 B.S. - Present",
                title: "National Pride Era",
                details: "Era of mega-projects, including North-South corridors, Fast-tracks, and high-tech infrastructure (Tunnels/Expressways).",
                gradient: "from-red-500 to-rose-500",
                svg: `<svg viewBox="0 0 400 240" fill="none" class="w-full h-full"><path d="M200 40 L 180 220 H 220 Z" fill="#f43f5e" opacity="0.1"/><path d="M200 40 V 220" stroke="#f43f5e" stroke-width="2"/><path d="M200 60 L 100 180 M 200 60 L 300 180" stroke="#f43f5e" stroke-width="1" class="sketch-path"/><text x="215" y="70" fill="#f43f5e" font-size="10" font-weight="bold" class="mono">PRIDE_PROJECTS</text></svg>`
            }
        ];

        let flippedCount = new Set();

        function createTimeline() {
            const container = document.getElementById('timeline');
            container.innerHTML = timelineData.map(item => `
                <div class="card-container" id="container-${item.id}" onclick="flipCard(${item.id})">
                    <div class="card-inner">
                        <!-- FRONT -->
                        <div class="card-front bg-slate-900 shadow-2xl flex flex-col">
                            <div class="h-[65%] w-full bg-slate-950/50 relative border-b border-slate-800">
                                ${item.svg}
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-900 to-transparent"></div>
                                <div class="absolute top-4 right-4 w-8 h-8 rounded-full bg-gradient-to-br ${item.gradient} flex items-center justify-center shadow-lg">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="m17 17-5 5-5-5"/><path d="m7 7 5-5 5 5"/></svg>
                                </div>
                            </div>
                            <div class="h-[35%] w-full p-6 flex flex-col items-center justify-center bg-slate-900">
                                <span class="text-[10px] font-black tracking-[0.3em] text-slate-500 uppercase mb-1">Click 👉 </span>
                                <h3 class="text-4xl font-black text-white tracking-tighter italic">${item.year}</h3>
                                <div class="mt-2 text-[10px] font-bold text-blue-400/60 uppercase tracking-widest">👉 Tap to reveal logs</div>
                            </div>
                        </div>
                        <!-- BACK -->
                        <div class="card-back p-8 flex flex-col justify-center relative">
                            <div class="h-1.5 w-16 rounded-full bg-gradient-to-r ${item.gradient} mb-6"></div>
                            <h3 class="text-2xl font-black text-white mb-3 leading-tight">${item.title}</h3>
                            <p class="text-slate-400 text-sm leading-relaxed font-medium mb-6">${item.details}</p>
                            <div class="mt-auto pt-4 border-t border-slate-800 flex items-center justify-between">
                                <span class="text-[9px] font-mono text-slate-600 uppercase">Ref: DOR_HIST_NP</span>
                                <div class="flex gap-1">
                                    <div class="w-1 h-1 rounded-full bg-blue-500"></div>
                                    <div class="w-1 h-1 rounded-full bg-slate-700"></div>
                                    <div class="w-1 h-1 rounded-full bg-slate-700"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function flipCard(id) {
            const card = document.getElementById(`container-${id}`);
            card.classList.toggle('flipped');
            
            if(card.classList.contains('flipped')) {
                flippedCount.add(id);
                updateStats();
            }
        }

        function updateStats() {
            const percent = (flippedCount.size / timelineData.length) * 100;
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('stats').innerText = `${flippedCount.size} / ${timelineData.length} COMPLETED`;
        }

        function resetApp() {
            flippedCount.clear();
            updateStats();
            document.querySelectorAll('.card-container').forEach(c => c.classList.remove('flipped'));
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', createTimeline);
    </script>
</body>
</html>

```
