

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstiMate Pro - Modern Estimator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Smooth transitions */
        .tab-transition { transition: all 0.3s ease; }
        .math-highlight { color: #2563eb; font-weight: 700; }
        .math-result { color: #059669; font-weight: 700; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-20">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-calculator text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">EstiMate<span class="text-blue-600">Pro</span></h1>
            </div>
            <div class="text-sm font-semibold text-slate-500 bg-slate-100 px-3 py-1 rounded-full hidden sm:block">
                Standard Procedure Estimator
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- LEFT PANEL: CONTROLS -->
        <div class="lg:col-span-4 space-y-6">
            
            <!-- Parameters Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-bold flex items-center gap-2 mb-6 text-slate-800">
                    <i class="fa-solid fa-sliders text-blue-500"></i> Project Parameters
                </h2>

                <!-- Tabs -->
                <div class="flex p-1 bg-slate-100 rounded-xl mb-6">
                    <button id="btn-pcc" class="tab-transition flex-1 py-2.5 text-sm font-bold rounded-lg bg-white shadow text-blue-600" onclick="setType('PCC')">
                        PCC Work
                    </button>
                    <button id="btn-brick" class="tab-transition flex-1 py-2.5 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-700" onclick="setType('Brickwork')">
                        Brickwork
                    </button>
                </div>

                <!-- Volume Input -->
                <div class="mb-6">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-bold text-slate-700">Volume (m³)</label>
                        <span id="vol-display" class="bg-blue-100 text-blue-700 font-bold px-3 py-1 rounded-md text-lg">1.0 m³</span>
                    </div>
                    <input type="range" id="volume" min="1" max="5" step="0.1" value="1" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600" oninput="calculate()">
                </div>

                <!-- Ratio Input -->
                <div class="mb-2">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Mix Ratio</label>
                    <select id="ratio" class="w-full bg-slate-50 border border-slate-300 text-slate-900 font-semibold rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-3 transition-all" onchange="calculate()">
                        <!-- Options populated by JS -->
                    </select>
                </div>
            </div>

            <!-- Rates Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-bold flex items-center gap-2 mb-4 text-slate-800">
                    <i class="fa-solid fa-tags text-green-500"></i> Local Rates (Rs.)
                </h2>
                
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-slate-600">Cement / bag</label>
                        <input type="number" id="rate-cement" value="1000" class="w-32 border border-slate-300 rounded-lg p-2 text-right font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none transition-all" oninput="calculate()">
                    </div>
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-slate-600">Sand / m³</label>
                        <input type="number" id="rate-sand" value="2400" class="w-32 border border-slate-300 rounded-lg p-2 text-right font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none transition-all" oninput="calculate()">
                    </div>
                    <div id="rate-agg-container" class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-slate-600">Aggregate / m³</label>
                        <input type="number" id="rate-aggregate" value="2800" class="w-32 border border-slate-300 rounded-lg p-2 text-right font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none transition-all" oninput="calculate()">
                    </div>
                    <div id="rate-brick-container" class="flex justify-between items-center hidden">
                        <label class="text-sm font-semibold text-slate-600">Brick / nos</label>
                        <input type="number" id="rate-brick" value="25" class="w-32 border border-slate-300 rounded-lg p-2 text-right font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none transition-all" oninput="calculate()">
                    </div>
                    
                    <hr class="border-slate-200 my-2">
                    
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-slate-600">Skilled Labor / day</label>
                        <input type="number" id="rate-skilled" value="1000" class="w-32 border border-slate-300 rounded-lg p-2 text-right font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none transition-all" oninput="calculate()">
                    </div>
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-slate-600">Unskilled / day</label>
                        <input type="number" id="rate-unskilled" value="700" class="w-32 border border-slate-300 rounded-lg p-2 text-right font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none transition-all" oninput="calculate()">
                    </div>
                </div>
            </div>

        </div>

        <!-- RIGHT PANEL: CALCULATIONS & TABLE -->
        <div class="lg:col-span-8 space-y-8">
            
            <!-- Modern Calculation Steps -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-slate-800 px-6 py-5 border-b border-slate-700 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-white flex items-center gap-3">
                        <i class="fa-solid fa-square-root-variable text-blue-400"></i> Mathematical Procedure
                    </h2>
                    <span id="calc-title" class="text-slate-300 font-medium bg-slate-700 px-3 py-1 rounded-lg text-sm"></span>
                </div>
                
                <div class="p-6 bg-slate-50" id="calculation-steps">
                    <!-- Steps injected by JS -->
                </div>
            </div>

            <!-- Rate Analysis Table -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-blue-600 px-6 py-5 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-white flex items-center gap-3">
                        <i class="fa-solid fa-file-invoice-dollar text-blue-200"></i> Rate Analysis
                    </h2>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-slate-700">
                        <thead class="bg-slate-100 text-slate-600 border-b border-slate-200 font-bold uppercase text-xs tracking-wider">
                            <tr>
                                <th class="px-6 py-4 w-1/3">Description</th>
                                <th class="px-4 py-4 text-center">Quantity</th>
                                <th class="px-4 py-4 text-center">Unit</th>
                                <th class="px-4 py-4 text-right">Rate (Rs)</th>
                                <th class="px-6 py-4 text-right">Amount (Rs)</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-100 text-sm">
                            <!-- Rows injected by JS -->
                        </tbody>
                    </table>
                </div>
                
                <!-- Grand Total Footer -->
                <div class="bg-slate-50 p-6 border-t border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div class="text-slate-500 font-medium">
                        Rate per 1 m³ = <span id="rate-per-m3" class="text-slate-900 font-bold text-lg ml-1"></span>
                    </div>
                    <div class="text-2xl font-bold text-slate-800">
                        Grand Total: <span id="grand-total" class="text-blue-600 ml-2"></span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- STATE ---
        let currentType = 'PCC';
        
        // Options mapping
        const optionsPCC = [
            { value: "1:3:6", label: "1:3:6 (M10)" },
            { value: "1:2:4", label: "1:2:4 (M15)" },
            { value: "1:1.5:3", label: "1:1.5:3 (M20)" },
            { value: "1:1:2", label: "1:1:2 (M25)" }
        ];
        const optionsBrick = [
            { value: "1:3", label: "1:3 Cement Mortar" },
            { value: "1:4", label: "1:4 Cement Mortar" },
            { value: "1:5", label: "1:5 Cement Mortar" },
            { value: "1:6", label: "1:6 Cement Mortar" }
        ];

        // Constants
        const norms = { pccPerM3: 0.4, brickPerM3: 0.8 };

        // Initialize App
        function init() {
            updateRatioDropdown();
            calculate();
        }

        // Toggle Type
        function setType(type) {
            currentType = type;
            
            // UI Toggle Tabs
            const btnPcc = document.getElementById('btn-pcc');
            const btnBrick = document.getElementById('btn-brick');
            
            if (type === 'PCC') {
                btnPcc.className = "tab-transition flex-1 py-2.5 text-sm font-bold rounded-lg bg-white shadow text-blue-600";
                btnBrick.className = "tab-transition flex-1 py-2.5 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-700";
                
                document.getElementById('rate-agg-container').classList.remove('hidden');
                document.getElementById('rate-brick-container').classList.add('hidden');
            } else {
                btnBrick.className = "tab-transition flex-1 py-2.5 text-sm font-bold rounded-lg bg-white shadow text-blue-600";
                btnPcc.className = "tab-transition flex-1 py-2.5 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-700";
                
                document.getElementById('rate-agg-container').classList.add('hidden');
                document.getElementById('rate-brick-container').classList.remove('hidden');
            }
            
            updateRatioDropdown();
            calculate();
        }

        function updateRatioDropdown() {
            const select = document.getElementById('ratio');
            select.innerHTML = '';
            const options = currentType === 'PCC' ? optionsPCC : optionsBrick;
            
            options.forEach(opt => {
                const el = document.createElement('option');
                el.value = opt.value;
                el.textContent = opt.label;
                if(currentType === 'PCC' && opt.value === '1:2:4') el.selected = true;
                if(currentType === 'Brickwork' && opt.value === '1:5') el.selected = true;
                select.appendChild(el);
            });
        }

        function formatVal(val, decimals = 2) {
            return parseFloat(val).toFixed(decimals);
        }

        function calculate() {
            const volume = parseFloat(document.getElementById('volume').value);
            document.getElementById('vol-display').textContent = `${volume.toFixed(1)} m³`;
            
            const ratioVal = document.getElementById('ratio').value;
            document.getElementById('calc-title').textContent = `${currentType} - ${ratioVal} mix for ${volume}m³`;

            const rates = {
                cement: parseFloat(document.getElementById('rate-cement').value) || 0,
                sand: parseFloat(document.getElementById('rate-sand').value) || 0,
                aggregate: parseFloat(document.getElementById('rate-aggregate').value) || 0,
                brick: parseFloat(document.getElementById('rate-brick').value) || 0,
                skilled: parseFloat(document.getElementById('rate-skilled').value) || 0,
                unskilled: parseFloat(document.getElementById('rate-unskilled').value) || 0,
            };

            let stepsHTML = '';
            let results = { cement: 0, sand: 0, aggregate: 0, bricks: 0, water: 0, days: 0 };

            if (currentType === 'PCC') {
                const parts = ratioVal.split(':').map(Number);
                const sumParts = parts[0] + parts[1] + parts[2];
                const dryVol = volume * 1.54;
                const cementVol = (dryVol / sumParts) * parts[0];
                const cementBags = cementVol * 30;
                const sandVol = (dryVol / sumParts) * parts[1];
                const aggVol = (dryVol / sumParts) * parts[2];
                
                results.cement = cementBags;
                results.sand = sandVol;
                results.aggregate = aggVol;
                results.water = cementBags * 25;
                results.days = volume * norms.pccPerM3;

                // MODERN HTML BLOCK FOR PCC STEPS
                stepsHTML = `
                    <div class="space-y-4">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <h3 class="text-xs uppercase tracking-widest text-slate-500 font-bold mb-2">Step 1: Volume Conversion</h3>
                            <div class="font-mono text-lg text-slate-800 space-y-2">
                                <p>Wet Volume = <span class="math-highlight">${volume.toFixed(2)} m³</span></p>
                                <p>Dry Volume = Wet Vol + 54% = 1.54 × <span class="math-highlight">${volume.toFixed(2)}</span> = <span class="math-result">${dryVol.toFixed(3)} m³</span></p>
                            </div>
                        </div>

                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <h3 class="text-xs uppercase tracking-widest text-slate-500 font-bold mb-2">Step 2: Proportion</h3>
                            <div class="font-mono text-lg text-slate-800 space-y-2">
                                <p>Ratio = <span class="math-highlight">${ratioVal}</span></p>
                                <p>Sum of parts = ${parts[0]} + ${parts[1]} + ${parts[2]} = <span class="math-result">${sumParts}</span></p>
                            </div>
                        </div>

                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <h3 class="text-xs uppercase tracking-widest text-slate-500 font-bold mb-2">Step 3: Material Required</h3>
                            <div class="font-mono text-[1.1rem] leading-relaxed text-slate-800 space-y-3">
                                <div class="flex items-start gap-4 p-3 bg-blue-50/50 rounded-lg border border-blue-100">
                                    <div class="bg-white p-2 rounded shadow-sm border border-slate-100 w-24 text-center font-bold text-slate-600 text-sm">CEMENT</div>
                                    <div>
                                        <p>Vol = (${dryVol.toFixed(3)} / ${sumParts}) × ${parts[0]} = <span class="math-highlight">${cementVol.toFixed(3)} m³</span></p>
                                        <p class="text-slate-500 text-sm mt-1">(1 m³ = 30 bags)</p>
                                        <p class="mt-1">Bags = ${cementVol.toFixed(3)} × 30 = <span class="math-result text-xl">${cementBags.toFixed(2)} bags</span></p>
                                    </div>
                                </div>

                                <div class="flex items-center gap-4 p-3 bg-slate-50 rounded-lg border border-slate-100">
                                    <div class="bg-white p-2 rounded shadow-sm border border-slate-200 w-24 text-center font-bold text-slate-600 text-sm">SAND</div>
                                    <p>Vol = (${dryVol.toFixed(3)} / ${sumParts}) × ${parts[1]} = <span class="math-result text-xl">${sandVol.toFixed(3)} m³</span></p>
                                </div>

                                <div class="flex items-center gap-4 p-3 bg-slate-50 rounded-lg border border-slate-100">
                                    <div class="bg-white p-2 rounded shadow-sm border border-slate-200 w-24 text-center font-bold text-slate-600 text-sm">AGGREGATE</div>
                                    <p>Vol = (${dryVol.toFixed(3)} / ${sumParts}) × ${parts[2]} = <span class="math-result text-xl">${aggVol.toFixed(3)} m³</span></p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                const parts = ratioVal.split(':').map(Number);
                const sumParts = parts[0] + parts[1];
                
                const volWithMortar = 0.24 * 0.12 * 0.065;
                const volWithoutMortar = 0.23 * 0.11 * 0.055;
                const baseBricks = Math.round(volume / volWithMortar);
                const totalBricks = Math.ceil(baseBricks * 1.05); // 5% wastage
                
                const wetMortar = volume - (baseBricks * volWithoutMortar);
                const dryMortar = wetMortar * 1.3;
                
                const cementVol = (dryMortar / sumParts) * parts[0];
                const cementBags = cementVol * 30;
                const sandVol = (dryMortar / sumParts) * parts[1];

                results.cement = cementBags;
                results.sand = sandVol;
                results.bricks = totalBricks;
                results.water = cementBags * 20;
                results.days = volume * norms.brickPerM3;

                // MODERN HTML BLOCK FOR BRICKWORK STEPS
                stepsHTML = `
                    <div class="space-y-4">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <h3 class="text-xs uppercase tracking-widest text-slate-500 font-bold mb-2">Step 1: Bricks Calculation</h3>
                            <div class="font-mono text-lg text-slate-800 space-y-3">
                                <p class="text-sm text-slate-500">Standard Brick: 230×110×55mm | With 10mm Mortar: 240×120×65mm</p>
                                <p>Vol of 1 Brick (with mortar) = <span class="math-highlight">${volWithMortar.toFixed(6)} m³</span></p>
                                <p>Bricks required = ${volume} / ${volWithMortar.toFixed(6)} = <span class="math-highlight">${baseBricks} nos</span></p>
                                <div class="bg-green-50 text-green-800 p-3 rounded-lg border border-green-200 mt-2">
                                    <p class="font-bold">Total Bricks (incl. 5% waste) = ${baseBricks} × 1.05 = <span class="text-2xl">${totalBricks} nos</span></p>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <h3 class="text-xs uppercase tracking-widest text-slate-500 font-bold mb-2">Step 2: Mortar Volume</h3>
                            <div class="font-mono text-lg text-slate-800 space-y-2">
                                <p>Vol of ${baseBricks} bricks (without mortar) = ${baseBricks} × ${volWithoutMortar.toFixed(6)} = <span class="math-highlight">${(baseBricks * volWithoutMortar).toFixed(3)} m³</span></p>
                                <p>Wet Mortar = ${volume} - ${(baseBricks * volWithoutMortar).toFixed(3)} = <span class="math-highlight">${wetMortar.toFixed(3)} m³</span></p>
                                <p>Dry Mortar (Add 30%) = ${wetMortar.toFixed(3)} × 1.3 = <span class="math-result">${dryMortar.toFixed(3)} m³</span></p>
                            </div>
                        </div>

                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <h3 class="text-xs uppercase tracking-widest text-slate-500 font-bold mb-2">Step 3: Cement & Sand (${ratioVal} mix)</h3>
                            <div class="font-mono text-[1.1rem] leading-relaxed text-slate-800 space-y-3">
                                <div class="flex items-start gap-4 p-3 bg-blue-50/50 rounded-lg border border-blue-100">
                                    <div class="bg-white p-2 rounded shadow-sm border border-slate-100 w-24 text-center font-bold text-slate-600 text-sm">CEMENT</div>
                                    <div>
                                        <p>Vol = (${dryMortar.toFixed(3)} / ${sumParts}) × ${parts[0]} = <span class="math-highlight">${cementVol.toFixed(3)} m³</span></p>
                                        <p class="mt-1">Bags = ${cementVol.toFixed(3)} × 30 = <span class="math-result text-xl">${cementBags.toFixed(2)} bags</span></p>
                                    </div>
                                </div>

                                <div class="flex items-center gap-4 p-3 bg-slate-50 rounded-lg border border-slate-100">
                                    <div class="bg-white p-2 rounded shadow-sm border border-slate-200 w-24 text-center font-bold text-slate-600 text-sm">SAND</div>
                                    <p>Vol = (${dryMortar.toFixed(3)} / ${sumParts}) × ${parts[1]} = <span class="math-result text-xl">${sandVol.toFixed(3)} m³</span></p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            document.getElementById('calculation-steps').innerHTML = stepsHTML;

            // Generate Rate Analysis Table
            const costs = {
                cement: results.cement * rates.cement,
                sand: results.sand * rates.sand,
                aggregate: results.aggregate * rates.aggregate,
                bricks: results.bricks * rates.brick,
                water: results.water * 5,
                skilled: results.days * rates.skilled,
                unskilled: (results.days * 2) * rates.unskilled
            };

            const materialTotal = costs.cement + costs.sand + costs.aggregate + costs.bricks + costs.water;
            const laborTotal = costs.skilled + costs.unskilled;
            const toolsCost = laborTotal * 0.03;
            
            const subTotal = materialTotal + laborTotal + toolsCost;
            const overhead = subTotal * 0.15;
            const grandTotal = subTotal + overhead;

            const makeRow = (desc, qty, unit, rate, amount, isSub = false) => `
                <tr class="hover:bg-blue-50/30 transition-colors ${isSub ? 'bg-slate-50 font-bold text-slate-900' : ''}">
                    <td class="px-6 py-3">${desc}</td>
                    <td class="px-4 py-3 text-center font-mono ${isSub?'':'text-slate-600'}">${qty !== '' ? formatVal(qty) : ''}</td>
                    <td class="px-4 py-3 text-center text-slate-500">${unit}</td>
                    <td class="px-4 py-3 text-right font-mono ${isSub?'':'text-slate-600'}">${rate !== '' ? formatVal(rate) : ''}</td>
                    <td class="px-6 py-3 text-right font-mono font-bold text-slate-800">${formatVal(amount)}</td>
                </tr>
            `;

            let tableHTML = `
                <tr class="bg-slate-200/50"><td colspan="5" class="px-6 py-2 text-xs font-bold text-slate-700 uppercase tracking-widest">A. Material Costs</td></tr>
                ${makeRow('Cement', results.cement, 'Bags', rates.cement, costs.cement)}
                ${makeRow('Sand', results.sand, 'm³', rates.sand, costs.sand)}
            `;
            
            if (currentType === 'PCC') {
                tableHTML += makeRow('Aggregate', results.aggregate, 'm³', rates.aggregate, costs.aggregate);
            } else {
                tableHTML += makeRow('Bricks', results.bricks, 'Nos', rates.brick, costs.bricks);
            }
            
            tableHTML += `
                ${makeRow('Water (approx)', results.water, 'Litre', 5, costs.water)}
                <tr class="bg-slate-200/50"><td colspan="5" class="px-6 py-2 text-xs font-bold text-slate-700 uppercase tracking-widest mt-4">B. Labor Costs (For ${results.days.toFixed(2)} days)</td></tr>
                ${makeRow('Skilled Labor (1x)', results.days, 'Days', rates.skilled, costs.skilled)}
                ${makeRow('Unskilled Labor (2x)', results.days * 2, 'Days', rates.unskilled, costs.unskilled)}
                
                <tr class="bg-slate-200/50"><td colspan="5" class="px-6 py-2 text-xs font-bold text-slate-700 uppercase tracking-widest mt-4">C. Tools & Plant</td></tr>
                ${makeRow('Tools & Equipment (3% of Labor)', '', 'L.S.', '', toolsCost)}
                
                <tr class="border-t-[3px] border-slate-200">
                    <td colspan="4" class="px-6 py-4 text-right font-bold text-slate-700">Sub-Total (A + B + C)</td>
                    <td class="px-6 py-4 text-right font-mono font-bold text-slate-900 text-lg">${formatVal(subTotal)}</td>
                </tr>
                <tr class="bg-amber-50/50">
                    <td colspan="4" class="px-6 py-3 text-right font-semibold text-amber-700">Add 15% Contractor's Overhead & Profit</td>
                    <td class="px-6 py-3 text-right font-mono font-bold text-amber-700">${formatVal(overhead)}</td>
                </tr>
            `;

            document.getElementById('table-body').innerHTML = tableHTML;
            document.getElementById('grand-total').textContent = `Rs. ${formatVal(grandTotal)}`;
            document.getElementById('rate-per-m3').textContent = `Rs. ${formatVal(grandTotal / volume)}`;
        }

        // Run on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
