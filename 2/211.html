<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Helicopter Cargo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@700&display=swap');

        :root {
            --bg-sky-top: #0ea5e9;
            --bg-sky-bottom: #e0f2fe;
            --text-main: #f8fafc;
            --heli-color: #334155;
            --heli-accent: #fbbf24;
            --rope-color: #451a03;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, var(--bg-sky-top) 0%, var(--bg-sky-bottom) 100%);
            color: var(--text-main);
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column;
            min-width: 1000px; /* Essential for side-by-side layout on Desktop Site */
            overflow: hidden;
        }

        /* --- BACKGROUND CLOUDS --- */
        .cloud-layer {
            position: absolute; top: 0; bottom: 0; width: 200%;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg"><path d="M20,40 Q30,20 50,30 Q65,10 85,30 Q100,20 110,40 Q130,30 140,50 Q120,60 110,55 Q90,70 70,55 Q50,70 30,55 Q10,60 20,40 Z" fill="rgba(255,255,255,0.4)"/></svg>');
            background-size: 400px 200px; pointer-events: none; z-index: 0;
            animation: driftClouds 60s linear infinite;
        }
        @keyframes driftClouds { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* --- DESKTOP SITE WARNING --- */
        #desktop-hint {
            background: linear-gradient(90deg, #ea580c, #eab308); color: white; text-align: center; padding: 8px 20px;
            font-size: 1.1rem; font-weight: 800; display: flex; justify-content: center; align-items: center; gap: 15px;
            flex-shrink: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #desktop-hint button {
            background: rgba(0,0,0,0.4); border: 1px solid white; color: white; padding: 4px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        #desktop-hint button:hover { background: white; color: black; }

        /* --- HEADER --- */
        .header {
            height: 80px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px; background: rgba(15, 23, 42, 0.85); border-bottom: 2px solid #334155;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6); z-index: 10; backdrop-filter: blur(5px);
        }
        .header h1 {
            font-size: 2.2rem; font-weight: 900;
            background: linear-gradient(to right, #fbbf24, #f97316);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .stats-box { display: flex; gap: 20px; }
        .stat-badge {
            background: rgba(2, 6, 23, 0.9); border: 2px solid; padding: 8px 20px; border-radius: 25px;
            font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; font-weight: 700; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #caught-badge { border-color: #10b981; color: #10b981; }

        /* --- MAIN GAME AREA --- */
        .game-area {
            flex: 1; display: flex; overflow: hidden; position: relative; z-index: 5;
        }

        /* LEFT: Sky / Helicopter Zone */
        .sky-zone {
            flex: 6; position: relative; display: flex; flex-direction: column; align-items: center;
            overflow-y: auto; /* Allow scrolling down the long rope */
            overflow-x: hidden;
            padding-bottom: 100px;
        }
        .sky-zone::-webkit-scrollbar { width: 10px; }
        .sky-zone::-webkit-scrollbar-track { background: transparent; }
        .sky-zone::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 5px; }

        /* --- HELICOPTER & ROPE --- */
        .heli-system {
            position: absolute; top: 20px; display: flex; flex-direction: column; align-items: center;
            animation: hoverHeli 4s ease-in-out infinite alternate;
            width: 100%;
        }
        .heli-system.fly-away {
            animation: flyAway 2s ease-in forwards;
        }
        @keyframes hoverHeli { 0% { transform: translateY(0px); } 100% { transform: translateY(15px); } }
        @keyframes flyAway { 0% { transform: translateY(15px); } 100% { transform: translateY(-1500px); } }

        .helicopter {
            width: 250px; height: 100px; position: relative; z-index: 20; filter: drop-shadow(0 20px 15px rgba(0,0,0,0.4));
        }

        .topic-banner {
            position: absolute; top: 110px; background: #020617; border: 4px solid #fbbf24;
            padding: 10px 25px; border-radius: 30px; font-weight: 900; font-size: 1.2rem;
            color: #fff; text-transform: uppercase; white-space: nowrap; box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            z-index: 25;
        }

        .main-rope {
            width: 8px; min-height: 1200px; background: repeating-linear-gradient(45deg, #451a03, #451a03 5px, #78350f 5px, #78350f 10px);
            margin-top: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.5); position: relative; z-index: 10;
            transform-origin: top center;
            animation: ropeSway 4s ease-in-out infinite alternate; /* Distracting sway */
        }
        @keyframes ropeSway {
            0% { transform: rotate(-1.5deg); }
            100% { transform: rotate(1.5deg); }
        }

        /* Hooks on the rope */
        .rope-hook-container {
            position: absolute; left: 50%; transform: translateX(-50%);
            width: 120px; height: 80px; display: flex; justify-content: center;
        }
        .hook-svg {
            width: 40px; height: 60px; fill: none; stroke: #94a3b8; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.8)); transition: stroke 0.2s;
        }
        .rope-hook-container.drag-over .hook-svg { stroke: #fbbf24; filter: drop-shadow(0 0 10px #fbbf24); }

        /* RIGHT: Loading Dock / Cargo Tray */
        .dock-zone {
            flex: 4; background: #1e293b; border-left: 6px solid #0f172a;
            display: flex; flex-direction: column; padding: 20px; position: relative; z-index: 10;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        .dock-header {
            font-size: 1.6rem; font-weight: 900; color: #fbbf24; margin-bottom: 20px; text-transform: uppercase;
            text-align: center; border-bottom: 2px dashed #475569; padding-bottom: 10px;
        }
        .cargo-pool {
            flex: 1; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; padding-bottom: 20px; align-items: center;
        }
        .cargo-pool::-webkit-scrollbar { width: 8px; }
        .cargo-pool::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        /* --- CARGO CRATES (Notes) --- */
        .cargo-crate {
            width: 320px; min-height: 80px; background: #eab308;
            border: 4px solid #713f12; border-radius: 8px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.6), inset 0 0 10px rgba(255,255,255,0.4);
            display: flex; align-items: center; justify-content: center; padding: 15px;
            cursor: grab; position: relative; touch-action: none; transition: transform 0.1s, background 0.2s; z-index: 50;
            /* Cargo straps styling */
            background-image: linear-gradient(90deg, transparent 40px, #b45309 40px, #b45309 50px, transparent 50px),
                              linear-gradient(90deg, transparent calc(100% - 50px), #b45309 calc(100% - 50px), #b45309 calc(100% - 40px), transparent calc(100% - 40px));
        }
        .cargo-text { font-size: 1.1rem; font-weight: 800; color: #000; text-align: center; z-index: 2; text-shadow: 0 1px 0 rgba(255,255,255,0.5); }
        
        .cargo-crate:active { cursor: grabbing; }
        .cargo-crate.dragging {
            position: fixed; z-index: 9999; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            transform: scale(1.05); pointer-events: none; opacity: 0.95;
        }

        /* Attached state on the rope */
        .cargo-crate.hooked {
            position: absolute !important; left: 50% !important; top: 40px !important;
            transform: translateX(-50%) !important; pointer-events: none;
            background-color: #34d399; border-color: #065f46; box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            animation: sway 3s infinite alternate ease-in-out; transform-origin: top center;
        }
        @keyframes sway { 0% { transform: translateX(-50%) rotate(-3deg); } 100% { transform: translateX(-50%) rotate(3deg); } }

        /* Wrong attempt shake */
        .cargo-crate.error { background-color: #ef4444; border-color: #7f1d1d; animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }

        /* --- END SCREEN --- */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(2, 6, 23, 0.98); display: flex; flex-direction: column; align-items: center; padding: 60px 40px; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; overflow-y: auto;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .book-summary { width: 100%; max-width: 800px; background: #0f172a; border: 1px solid #334155; border-radius: 15px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); margin-bottom: 40px; }
        .book-summary h2 { font-size: 2.8rem; color: #10b981; text-align: center; margin-bottom: 20px; text-transform: uppercase; }
        .chapter-section { display: flex; flex-direction: column; gap: 15px; }
        .step-row { display: flex; align-items: center; background: #1e293b; padding: 15px; border-radius: 10px; border-left: 5px solid #fbbf24; }
        .step-content span { color: #e2e8f0; font-size: 1.3rem; font-weight: bold; }
        .play-again-btn {
            background: linear-gradient(135deg, #fbbf24, #f97316); color: #000; border: none; padding: 18px 60px; font-size: 1.5rem; font-weight: 900; border-radius: 40px; cursor: pointer; transition: transform 0.2s; box-shadow: 0 10px 20px rgba(249, 115, 22, 0.4);
        }
        .play-again-btn:hover { transform: scale(1.05); }

    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- 1. MASTER GAME DATA -->
    <!-- ========================================== -->
    <script>
                const MASTER_GAME_DATA = {
            mainTitle: "Principles of Stone Masonry",
            // Notes that belong to the Title (All Correct)
            correctNotes: [
                { id: 1, text: "Stones must be properly wetted before use so they don't absorb water from mortar" },
                { id: 2, text: "Pressure should always act perpendicular to the natural bed of the stone" },
                { id: 3, text: "Vertical joints must be staggered (broken) to ensure a strong, interlocking bond" },
                { id: 4, text: "Headers or 'through-stones' must be used frequently to tie the wall faces together" },
                { id: 5, text: "The inner core (hearting) must be solidly packed with mortar and stone chips" },
                { id: 6, text: "Use a plumb bob frequently to constantly check the strict verticality of the wall" },
                { id: 7, text: "The completed masonry work must be properly cured (kept wet) for 2 to 3 weeks" }
            ],
            distractorNotes: [] 
       
        };
    </script>

    <div id="desktop-hint">
        <span>📱 Enable <strong>"Desktop Site"</strong> in your mobile browser settings for the proper wide view!</span>
        <button onclick="document.getElementById('desktop-hint').style.display='none'">Dismiss</button>
    </div>

    <div class="header">
        <h1 id="ui-title">Helicopter Cargo</h1>
        <div class="stats-box">
            <div class="stat-badge" id="caught-badge">Hooked: <span id="hookedCount">0</span> / <span id="totalNeeded">0</span></div>
        </div>
    </div>

    <div class="game-area">
        <div class="cloud-layer"></div>

        <!-- LEFT: Sky / Heli Zone -->
        <div class="sky-zone">
            
            <div class="heli-system" id="heliSystem">
                
                <!-- Highly Realistic Helicopter SVG -->
                <svg class="helicopter" viewBox="0 0 300 120">
                    <defs>
                        <linearGradient id="heliBody" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#475569"/>
                            <stop offset="100%" stop-color="#1e293b"/>
                        </linearGradient>
                    </defs>
                    <!-- Tail boom -->
                    <path d="M 200,60 L 280,55 L 280,65 Z" fill="#334155"/>
                    <path d="M 280,45 L 290,45 L 290,75 L 280,75 Z" fill="#fbbf24"/>
                    <!-- Tail Rotor (Animated via JS or CSS could be used, static here for style) -->
                    <ellipse cx="285" cy="60" rx="5" ry="25" fill="#94a3b8" opacity="0.6">
                        <animateTransform attributeName="transform" type="rotate" from="0 285 60" to="360 285 60" dur="0.1s" repeatCount="indefinite"/>
                    </ellipse>

                    <!-- Skids -->
                    <path d="M 80,105 L 70,115 L 180,115 L 170,105" fill="none" stroke="#94a3b8" stroke-width="4"/>
                    <line x1="50" y1="115" x2="200" y2="115" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

                    <!-- Main Body -->
                    <path d="M 30,70 C 10,70 10,40 60,30 C 100,20 160,20 180,40 C 210,60 200,90 150,90 C 100,90 50,90 30,70 Z" fill="url(#heliBody)"/>
                    <!-- Cockpit Window -->
                    <path d="M 35,60 C 25,50 35,35 60,35 C 80,35 90,45 85,60 Z" fill="#bae6fd" opacity="0.8"/>
                    
                    <!-- Top Rotor Mast -->
                    <rect x="120" y="10" width="10" height="20" fill="#475569"/>
                    <!-- Top Rotor Blade (Animated) -->
                    <ellipse cx="125" cy="10" rx="120" ry="3" fill="#000" opacity="0.5">
                        <animate attributeName="rx" values="120; 10; 120" dur="0.15s" repeatCount="indefinite"/>
                    </ellipse>
                </svg>

                <div class="topic-banner" id="topicBanner">Topic Name Here</div>

                <div class="main-rope" id="mainRope">
                    <!-- Hooks injected by JS based on number of correct notes -->
                </div>
            </div>

        </div>

        <!-- RIGHT: Cargo Dock -->
        <div class="dock-zone">
            <div class="dock-header">Loading Dock</div>
            <div class="cargo-pool" id="cargoPool">
                <!-- Cargo Crates injected and shuffled by JS -->
            </div>
        </div>

    </div>

    <!-- End Game Overlay -->
    <div class="overlay" id="endScreen">
        <div class="book-summary">
            <h2>Cargo Secured!</h2>
            <p class="score-report">You correctly identified all characteristics of:<br><strong id="summaryTitle" style="color:#38bdf8;"></strong></p>
            <div class="chapter-section" id="summaryContent"></div>
        </div>
        <button class="play-again-btn" onclick="startGame()">Next Assignment</button>
    </div>

    <script>
        // --- AUDIO ENGINE ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        const playSound = (type) => {
            if (!audioCtx) return;
            try {
                if (type === 'grab') {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'drop') {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'square'; osc.frequency.setValueAtTime(80, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.8, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'correct') {
                    // Bright Snapping Ding
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime); // C6
                    gain.gain.setValueAtTime(1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    // Loud Buzzer
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'win') {
                    // Helicopter Fly Away Sound (Jet engine taking off)
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 2);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 2);
                }
            } catch (e) {}
        };

        document.body.addEventListener('click', initAudio, { once: true });
        document.body.addEventListener('touchstart', initAudio, { once: true });

        // --- GAME LOGIC & UI BUILDER ---
        const gameData = MASTER_GAME_DATA;
        const totalHooks = gameData.correctNotes.length;
        let hooksFilled = 0;

        const mainRope = document.getElementById('mainRope');
        const cargoPool = document.getElementById('cargoPool');
        const hookedCountEl = document.getElementById('hookedCount');
        document.getElementById('totalNeeded').innerText = totalHooks;
        document.getElementById('topicBanner').innerText = gameData.mainTitle;

        function startGame() {
            hooksFilled = 0;
            hookedCountEl.innerText = hooksFilled;
            document.getElementById('endScreen').classList.remove('active');
            document.getElementById('heliSystem').classList.remove('fly-away');
            
            buildHooks();
            buildCargo();
        }

        function buildHooks() {
            mainRope.innerHTML = '';
            
            // Dynamically set rope length based on the number of hooks to ensure it's always long enough
            const hookSpacing = 160; // Pixels between each hook
            const requiredHeight = (totalHooks * hookSpacing) + 200;
            mainRope.style.height = `${Math.max(1200, requiredHeight)}px`;

            for(let i=0; i<totalHooks; i++) {
                const hookContainer = document.createElement('div');
                hookContainer.className = 'rope-hook-container';
                hookContainer.style.top = `${(i * hookSpacing) + 80}px`; // Fixed pixel spacing instead of percentage
                
                hookContainer.innerHTML = `
                    <svg class="hook-svg" viewBox="0 0 50 80">
                        <path d="M 25,0 L 25,20 C 45,20 45,60 25,60 C 5,60 5,40 15,30"/>
                        <circle cx="25" cy="5" r="3" fill="#000"/>
                    </svg>
                `;
                
                mainRope.appendChild(hookContainer);
            }
        }

        function buildCargo() {
            cargoPool.innerHTML = '';
            
            // Only use correct notes (No distractors)
            let allNotes = [...gameData.correctNotes];
            
            // Shuffle
            allNotes.sort(() => Math.random() - 0.5);

            allNotes.forEach(note => {
                const crate = document.createElement('div');
                crate.className = 'cargo-crate';
                crate.dataset.isCorrect = "true";
                crate.dataset.text = note.text; // store for summary

                crate.innerHTML = `<div class="cargo-text">${note.text}</div>`;

                // Drag Events
                crate.addEventListener('pointerdown', dragStart);

                cargoPool.appendChild(crate);
            });
        }

        // --- DRAG & DROP LOGIC ---
        let activeCrate = null;
        let initialParent = null;
        let offsetX, offsetY;

        function dragStart(e) {
            initAudio();
            const crate = e.target.closest('.cargo-crate');
            if (!crate || crate.classList.contains('hooked')) return; 
            
            activeCrate = crate;
            initialParent = activeCrate.parentElement;
            
            activeCrate.classList.remove('error');

            const rect = activeCrate.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;

            // Lock dimensions
            activeCrate.style.width = `${rect.width}px`;
            activeCrate.style.height = `${rect.height}px`;

            activeCrate.classList.add('dragging');
            document.body.appendChild(activeCrate); 
            
            moveCrate(e.clientX, e.clientY);
            playSound('grab');

            document.addEventListener('pointermove', dragMove);
            document.addEventListener('pointerup', dragEnd);
        }

        function dragMove(e) {
            if (!activeCrate) return;
            moveCrate(e.clientX, e.clientY);

            // Magnetic Proximity Logic
            const crateRect = activeCrate.getBoundingClientRect();
            const crateCenterX = crateRect.left + crateRect.width / 2;
            const crateCenterY = crateRect.top + crateRect.height / 2;

            let closestHook = null;
            let minDistance = 200; // Magnetic Highlight radius

            document.querySelectorAll('.rope-hook-container').forEach(hook => {
                hook.classList.remove('drag-over');
                // Only attract to empty hooks
                if (!hook.querySelector('.cargo-crate')) {
                    const hookRect = hook.getBoundingClientRect();
                    const hookCenterX = hookRect.left + hookRect.width / 2;
                    const hookCenterY = hookRect.top + hookRect.height / 2;

                    const dist = Math.hypot(crateCenterX - hookCenterX, crateCenterY - hookCenterY);
                    if (dist < minDistance) {
                        minDistance = dist;
                        closestHook = hook;
                    }
                }
            });

            if (closestHook) {
                closestHook.classList.add('drag-over');
                
                // AUTO-SNAP: If you get very close, it yanks it out of your hand!
                if (minDistance < 80) {
                    autoSnapToHook(closestHook);
                }
            }
        }

        function moveCrate(x, y) {
            activeCrate.style.left = `${x - offsetX}px`;
            activeCrate.style.top = `${y - offsetY}px`;
        }

        function autoSnapToHook(targetHook) {
            // Remove drag listeners to release the item
            document.removeEventListener('pointermove', dragMove);
            document.removeEventListener('pointerup', dragEnd);

            playSound('correct');
            
            // Clean up target
            document.querySelectorAll('.rope-hook-container').forEach(h => h.classList.remove('drag-over'));

            // Attach crate
            activeCrate.classList.remove('dragging');
            activeCrate.style.left = ''; activeCrate.style.top = '';
            activeCrate.style.width = '250px'; // Shrink slightly to fit rope visually
            
            activeCrate.classList.add('hooked');
            targetHook.appendChild(activeCrate);
            
            hooksFilled++;
            hookedCountEl.innerText = hooksFilled;

            if (hooksFilled === totalHooks) {
                setTimeout(triggerWin, 500);
            }

            activeCrate = null;
            initialParent = null;
        }

        function dragEnd(e) {
            if (!activeCrate) return; // Might have already been auto-snapped

            document.removeEventListener('pointermove', dragMove);
            document.removeEventListener('pointerup', dragEnd);

            // Check if dropped near a highlighted hook
            const targetHook = document.querySelector('.rope-hook-container.drag-over');
            document.querySelectorAll('.rope-hook-container').forEach(h => h.classList.remove('drag-over'));

            if (targetHook) {
                // Manually dropped inside the larger magnetic radius
                autoSnapToHook(targetHook);
            } else {
                // Dropped too far away, return to dock
                playSound('drop');
                activeCrate.classList.remove('dragging');
                activeCrate.style.left = ''; activeCrate.style.top = '';
                activeCrate.style.width = ''; activeCrate.style.height = '';
                initialParent.appendChild(activeCrate);
                
                activeCrate = null;
                initialParent = null;
            }
        }

        function triggerWin() {
            playSound('win');
            document.getElementById('heliSystem').classList.add('fly-away');
            
            setTimeout(showWinScreen, 2000);
        }

        function showWinScreen() {
            document.getElementById('summaryTitle').innerText = gameData.mainTitle;
            const summaryContent = document.getElementById('summaryContent');
            summaryContent.innerHTML = '';
            
            gameData.correctNotes.forEach((note) => {
                const row = document.createElement('div');
                row.className = 'step-row';
                row.innerHTML = `<span>${note.text}</span>`;
                summaryContent.appendChild(row);
            });

            document.getElementById('endScreen').classList.add('active');
        }

        // Boot Game
        startGame();

    </script>
</body>
</html>
