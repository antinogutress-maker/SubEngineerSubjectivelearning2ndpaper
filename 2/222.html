<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World-Class Automated Cement Plant</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');

        :root {
            /* Command Center Colors */
            --bg-void: #0a0f1a;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --panel-border: rgba(56, 189, 248, 0.3);
            --text-glow: #f8fafc;
            
            /* Industrial UI Colors */
            --c-lime: #a3e635;    /* Vibrant Limestone Green */
            --c-clay: #f59e0b;    /* Rich Clay Amber */
            --c-mix:  #38bdf8;    /* Raw Mix Cyan */
            --c-fire: #ef4444;    /* Kiln Fire Red */
            --c-clink: #d946ef;   /* Clinker Purple/Magenta */
            --c-gyps: #f1f5f9;    /* Gypsum White */
            --c-cem:  #94a3b8;    /* Cement Silver */

            --c-accent: #eab308;  /* Construction/Safety Yellow */

            /* Animation Speeds */
            --flow-speed: 2s;
            --gear-speed: 3s;
            --kiln-speed: 6s;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-void);
            background-image: 
                radial-gradient(circle at center, rgba(56, 189, 248, 0.05) 0%, transparent 70%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-glow);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- Dashboard UI --- */
        .dashboard {
            width: 450px;
            height: 100%;
            background: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            box-shadow: 20px 0 60px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            padding: 30px;
            z-index: 10;
            backdrop-filter: blur(20px);
        }

        .header { margin-bottom: 25px; }
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--c-accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(234, 179, 8, 0.4);
        }
        .header p { color: #94a3b8; font-size: 1.05rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }

        /* Telemetry */
        .telemetry { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .metric-box {
            background: linear-gradient(145deg, rgba(30,41,59,0.7), rgba(15,23,42,0.9));
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 15px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .metric-box::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: var(--active-color); box-shadow: 0 0 12px var(--active-color); border-radius: 10px 0 0 10px;
        }
        .metric-label { font-size: 0.8rem; color: #cbd5e1; text-transform: uppercase; letter-spacing: 1px; }
        .metric-value { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 700; margin-top: 5px; color: #fff; }

        /* Status Cards */
        .status-display { flex-grow: 1; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding-right: 8px; }
        .status-display::-webkit-scrollbar { width: 4px; }
        .status-display::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 4px; }

        .status-card {
            border-left: 2px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.015);
            padding: 16px;
            border-radius: 0 12px 12px 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
        }
        .status-card:hover { background: rgba(255,255,255,0.03); }
        .status-card::after {
            content: ''; position: absolute; top: 50%; left: -2px; width: 3px; height: 0%;
            background: var(--card-color); transition: height 0.4s ease, top 0.4s ease; box-shadow: 0 0 15px var(--card-color);
        }
        .status-card.active { background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent); transform: translateX(8px); }
        .status-card.active::after { top: 0; height: 100%; }
        
        .status-card h3 { font-size: 1.15rem; margin-bottom: 6px; color: var(--card-color); text-shadow: 0 0 8px rgba(255,255,255,0.1); }
        .status-card p { font-size: 0.9rem; color: #94a3b8; line-height: 1.4; }

        /* --- Realistic Simulator Canvas --- */
        .canvas-container {
            flex-grow: 1;
            position: relative;
            height: 100%;
            display: flex;
            align-items: flex-start; /* Allow scrolling */
            justify-content: center;
            overflow: auto;
            padding: 40px;
            cursor: grab;
        }
        .canvas-container:active { cursor: grabbing; }

        svg {
            width: 100%;
            height: auto;
            min-width: 1200px;
            max-width: 1800px;
            filter: drop-shadow(0 30px 60px rgba(0,0,0,0.95));
        }

        /* --- World-Class SVG Animations --- */
        
        /* Material Flow Animation */
        .flow-path {
            stroke-dasharray: 15 10;
            animation: flow-anim var(--flow-speed) linear infinite;
        }
        .flow-conveyor {
            stroke-dasharray: 10 5;
            animation: flow-anim 1.5s linear infinite;
        }
        @keyframes flow-anim { to { stroke-dashoffset: -25; } }

        /* Machine Rotations */
        .spin-cw { transform-box: fill-box; transform-origin: center; animation: spin 4s linear infinite; }
        .spin-ccw { transform-box: fill-box; transform-origin: center; animation: spin 4s linear infinite reverse; }
        .spin-fast { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Kiln Rolling */
        .roll-kiln {
            stroke-dasharray: 40 20;
            animation: roll-anim 8s linear infinite;
        }
        @keyframes roll-anim { to { stroke-dashoffset: -60; } }

        /* Dynamic Flame */
        .flame-anim { transform-box: fill-box; transform-origin: left center; animation: flicker 0.1s infinite alternate; }
        @keyframes flicker {
            0% { transform: scaleX(0.95) scaleY(0.98); opacity: 0.85; filter: brightness(1); }
            100% { transform: scaleX(1.05) scaleY(1.02); opacity: 1; filter: brightness(1.4); }
        }

        /* Heat Glow */
        .pulsing-heat { animation: pulse-heat 2s infinite alternate; }
        @keyframes pulse-heat {
            0% { filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.5)); }
            100% { filter: drop-shadow(0 0 40px rgba(239, 68, 68, 1)); }
        }

        /* Smoke/Steam */
        .smoke { opacity: 0; animation: rise 4s ease-in infinite; transform-box: fill-box; transform-origin: bottom center; }
        .smoke:nth-child(2) { animation-delay: 1.3s; }
        .smoke:nth-child(3) { animation-delay: 2.6s; }
        @keyframes rise {
            0% { transform: translateY(0) scale(0.5); opacity: 0.6; }
            100% { transform: translateY(-80px) scale(2); opacity: 0; }
        }

        /* Text Labels */
        .label-bg { fill: rgba(15, 23, 42, 0.9); stroke: rgba(255,255,255,0.1); stroke-width: 1; rx: 6; }
        .label-txt { font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; letter-spacing: 1px; }
        
    </style>
</head>
<body>



    <div class="canvas-container" id="canvas-wrapper">
        <svg viewBox="0 0 1600 2200" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- Shadows & Glows -->
                <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#000" flood-opacity="0.8"/>
                </filter>
                <filter id="glow-fire" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="20" result="blur"/>
                    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                </filter>
                <filter id="glow-bright" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="8" result="blur"/>
                    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                </filter>

                <!-- Realistic Volumetric Metal Gradients -->
                <linearGradient id="metal-v" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#1e293b"/>
                    <stop offset="20%" stop-color="#475569"/>
                    <stop offset="50%" stop-color="#94a3b8"/>
                    <stop offset="80%" stop-color="#334155"/>
                    <stop offset="100%" stop-color="#0f172a"/>
                </linearGradient>
                <linearGradient id="metal-h" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#1e293b"/>
                    <stop offset="20%" stop-color="#475569"/>
                    <stop offset="50%" stop-color="#94a3b8"/>
                    <stop offset="80%" stop-color="#334155"/>
                    <stop offset="100%" stop-color="#0f172a"/>
                </linearGradient>

                <!-- Pipe & Cylinder Gradients -->
                <linearGradient id="pipe-grad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#334155"/>
                    <stop offset="50%" stop-color="#cbd5e1"/>
                    <stop offset="100%" stop-color="#1e293b"/>
                </linearGradient>
                
                <linearGradient id="pipe-glass" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="rgba(51,65,85,0.8)"/>
                    <stop offset="30%" stop-color="rgba(255,255,255,0.2)"/>
                    <stop offset="70%" stop-color="rgba(255,255,255,0.1)"/>
                    <stop offset="100%" stop-color="rgba(15,23,42,0.9)"/>
                </linearGradient>

                <!-- Specialized Gradients -->
                <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#fde047"/>
                    <stop offset="100%" stop-color="#ca8a04"/>
                </linearGradient>

                <linearGradient id="kiln-grad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#3f3f46"/>
                    <stop offset="50%" stop-color="#a1a1aa"/>
                    <stop offset="100%" stop-color="#27272a"/>
                </linearGradient>

                <linearGradient id="heat-grad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#000" stop-opacity="0"/>
                    <stop offset="60%" stop-color="#ef4444" stop-opacity="0.8"/>
                    <stop offset="85%" stop-color="#fef08a" stop-opacity="0.95"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
                </linearGradient>

                <!-- Reusable SVG Components -->
                <g id="gear">
                    <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
                    <path d="M-4,-24 L4,-24 L6,-16 L-6,-16 Z M-4,24 L4,24 L6,16 L-6,16 Z M-24,-4 L-24,4 L-16,6 L-16,-6 Z M24,-4 L24,4 L16,6 L16,-6 Z M-17,-17 L-11,-23 L-8,-16 L-16,-8 Z M17,17 L11,23 L8,16 L16,8 Z M17,-17 L11,-23 L8,-16 L16,-8 Z M-17,17 L-11,23 L-8,16 L-16,8 Z" fill="#64748b"/>
                    <circle cx="0" cy="0" r="6" fill="#0f172a"/>
                </g>
                <g id="conveyor-roller">
                    <circle cx="0" cy="0" r="8" fill="url(#metal-h)" stroke="#0f172a" stroke-width="2"/>
                </g>
            </defs>

            <!-- Background Structural Grid / Beams -->
            <g stroke="rgba(255,255,255,0.03)" stroke-width="4">
                <line x1="200" y1="100" x2="200" y2="2100"/>
                <line x1="1400" y1="100" x2="1400" y2="2100"/>
                <line x1="800" y1="100" x2="800" y2="2100"/>
                <line x1="100" y1="600" x2="1500" y2="600"/>
                <line x1="100" y1="1200" x2="1500" y2="1200"/>
                <line x1="100" y1="1800" x2="1500" y2="1800"/>
            </g>

            <!-- ========================================== -->
            <!-- STAGE 1: EXTRACTION & CRUSHING             -->
            <!-- ========================================== -->
            
            <!-- Limestone Line (Left) -->
            <g transform="translate(300, 150)" filter="url(#drop-shadow)">
                <!-- Hopper -->
                <path d="M -80,0 L 80,0 L 40,80 L -40,80 Z" fill="url(#accent-grad)" stroke="#ca8a04" stroke-width="3"/>
                <path d="M -80,0 L -70,-20 L 70,-20 L 80,0 Z" fill="#475569"/>
                <!-- Crusher Body -->
                <rect x="-50" y="80" width="100" height="90" fill="url(#metal-v)" rx="10"/>
                <rect x="-40" y="90" width="80" height="70" fill="#0f172a" rx="5"/>
                <!-- Jaw Crushers / Gears -->
                <use href="#gear" x="-15" y="125" class="spin-cw" />
                <use href="#gear" x="15" y="125" class="spin-ccw" />
                <path d="M -30,170 L 30,170 L 20,200 L -20,200 Z" fill="url(#metal-v)"/>
            </g>

            <!-- Clay Line (Right) -->
            <g transform="translate(1300, 150)" filter="url(#drop-shadow)">
                <path d="M -60,0 L 60,0 L 30,80 L -30,80 Z" fill="url(#metal-v)" stroke="#475569" stroke-width="3"/>
                <path d="M -60,0 L -50,-20 L 50,-20 L 60,0 Z" fill="#475569"/>
                <rect x="-40" y="80" width="80" height="80" fill="url(#metal-v)" rx="10"/>
                <rect x="-30" y="90" width="60" height="60" fill="#0f172a" rx="5"/>
                <use href="#gear" x="-10" y="120" class="spin-cw" />
                <use href="#gear" x="10" y="120" class="spin-ccw" />
                <path d="M -20,160 L 20,160 L 15,190 L -15,190 Z" fill="url(#metal-v)"/>
            </g>


            <!-- ========================================== -->
            <!-- CONVEYORS & PIPING (Layer 1)               -->
            <!-- ========================================== -->
            <g filter="url(#drop-shadow)">
                <!-- Left Conveyor (Crusher to Raw Mill) -->
                <path d="M 300 350 L 300 480 L 450 480" fill="none" stroke="#1e293b" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Right Conveyor (Crusher to Raw Mill) -->
                <path d="M 1300 340 L 1300 480 L 1150 480" fill="none" stroke="#1e293b" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
                
                <!-- Center Elevating Pipe (Raw Mill to Blending Silo) -->
                <path d="M 800 550 L 800 700" fill="none" stroke="url(#pipe-grad)" stroke-width="30" stroke-linecap="round"/>
                <path d="M 800 550 L 800 700" fill="none" stroke="url(#pipe-glass)" stroke-width="30" stroke-linecap="round"/>
                
                <!-- Pipe to Preheater -->
                <path d="M 800 950 L 800 1000" fill="none" stroke="url(#pipe-grad)" stroke-width="26"/>
            </g>

            <!-- Conveyor Belts details -->
            <g>
                <!-- Lime Conveyor Belt -->
                <path d="M 300 350 L 300 480 L 450 480" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M 300 350 L 300 480 L 450 480" fill="none" stroke="var(--c-lime)" stroke-width="6" class="flow-conveyor" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Clay Conveyor Belt -->
                <path d="M 1300 340 L 1300 480 L 1150 480" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M 1300 340 L 1300 480 L 1150 480" fill="none" stroke="var(--c-clay)" stroke-width="6" class="flow-conveyor" stroke-linecap="round" stroke-linejoin="round"/>
            </g>


            <!-- ========================================== -->
            <!-- STAGE 2: RAW MILL & BLENDING               -->
            <!-- ========================================== -->
            
            <!-- Huge Tube Mill (Horizontal) -->
            <g transform="translate(800, 480)" filter="url(#drop-shadow)">
                <!-- Base supports -->
                <rect x="-320" y="40" width="60" height="50" fill="#1e293b"/>
                <rect x="260" y="40" width="60" height="50" fill="#1e293b"/>
                
                <!-- Mill Drum -->
                <rect x="-350" y="-40" width="700" height="80" fill="url(#metal-h)" rx="10"/>
                
                <!-- Metal bands on drum (animated to show rotation) -->
                <g class="roll-kiln" stroke="#334155" stroke-width="12">
                    <line x1="-300" y1="-40" x2="-300" y2="40"/>
                    <line x1="-150" y1="-40" x2="-150" y2="40"/>
                    <line x1="0" y1="-40" x2="0" y2="40"/>
                    <line x1="150" y1="-40" x2="150" y2="40"/>
                    <line x1="300" y1="-40" x2="300" y2="40"/>
                </g>
                
                <!-- Center Discharge -->
                <path d="M -40,40 L 40,40 L 30,80 L -30,80 Z" fill="url(#metal-v)"/>
            </g>

            <!-- Massive Blending Silos -->
            <g transform="translate(800, 850)" filter="url(#drop-shadow)">
                <!-- Left Silo -->
                <g transform="translate(-120, 0)">
                    <path d="M -50,-150 L 50,-150 L 50,50 L -50,50 Z" fill="url(#metal-v)"/>
                    <path d="M -50,-150 L 0,-180 L 50,-150 Z" fill="#475569"/>
                    <path d="M -50,50 L 0,100 L 50,50 Z" fill="url(#metal-v)"/>
                    <line x1="-50" y1="-100" x2="50" y2="-100" stroke="#1e293b" stroke-width="4"/>
                    <line x1="-50" y1="-20" x2="50" y2="-20" stroke="#1e293b" stroke-width="4"/>
                </g>
                <!-- Right Silo -->
                <g transform="translate(120, 0)">
                    <path d="M -50,-150 L 50,-150 L 50,50 L -50,50 Z" fill="url(#metal-v)"/>
                    <path d="M -50,-150 L 0,-180 L 50,-150 Z" fill="#475569"/>
                    <path d="M -50,50 L 0,100 L 50,50 Z" fill="url(#metal-v)"/>
                    <line x1="-50" y1="-100" x2="50" y2="-100" stroke="#1e293b" stroke-width="4"/>
                    <line x1="-50" y1="-20" x2="50" y2="-20" stroke="#1e293b" stroke-width="4"/>
                </g>
                <!-- Center Main Silo (Larger) -->
                <g transform="translate(0, 20)">
                    <path d="M -70,-180 L 70,-180 L 70,60 L -70,60 Z" fill="url(#pipe-grad)"/>
                    <path d="M -70,-180 L 0,-220 L 70,-180 Z" fill="#94a3b8"/>
                    <path d="M -70,60 L 0,130 L 70,60 Z" fill="url(#pipe-grad)"/>
                    <!-- Silo details -->
                    <rect x="-10" y="-180" width="20" height="240" fill="#334155"/> <!-- Ladder -->
                    <line x1="-70" y1="-50" x2="70" y2="-50" stroke="#334155" stroke-width="6"/>
                </g>
            </g>


            <!-- ========================================== -->
            <!-- STAGE 3: PREHEATER TOWER & ROTARY KILN     -->
            <!-- ========================================== -->
            
            <!-- Structural Tower for Preheater -->
            <g stroke="#1e293b" stroke-width="6" filter="url(#drop-shadow)">
                <line x1="700" y1="1000" x2="700" y2="1400"/>
                <line x1="900" y1="1000" x2="900" y2="1400"/>
                <line x1="700" y1="1100" x2="900" y2="1100"/>
                <line x1="700" y1="1200" x2="900" y2="1200"/>
                <line x1="700" y1="1300" x2="900" y2="1300"/>
                <line x1="700" y1="1000" x2="900" y2="1100"/>
                <line x1="700" y1="1100" x2="900" y2="1200"/>
                <line x1="700" y1="1200" x2="900" y2="1300"/>
            </g>

            <!-- Preheater Cyclones (Stacked) -->
            <g transform="translate(800, 1000)" filter="url(#drop-shadow)">
                <!-- Cyclone 1 (Top) -->
                <path d="M -40,30 L 40,30 L 40,70 L 10,120 L -10,120 L -40,70 Z" fill="url(#metal-v)"/>
                <rect x="-15" y="0" width="30" height="30" fill="url(#metal-v)"/>
                <!-- Connecting Duct -->
                <path d="M 0,120 C 0,140 60,120 60,150" fill="none" stroke="url(#pipe-grad)" stroke-width="12"/>

                <!-- Cyclone 2 -->
                <g transform="translate(50, 120) scale(0.9)">
                    <path d="M -40,30 L 40,30 L 40,70 L 10,120 L -10,120 L -40,70 Z" fill="url(#metal-v)"/>
                    <rect x="-15" y="0" width="30" height="30" fill="url(#metal-v)"/>
                    <path d="M 0,120 C 0,140 -80,120 -80,150" fill="none" stroke="url(#pipe-grad)" stroke-width="12"/>
                </g>

                <!-- Cyclone 3 -->
                <g transform="translate(-30, 230) scale(1.1)">
                    <path d="M -40,30 L 40,30 L 40,70 L 10,120 L -10,120 L -40,70 Z" fill="url(#metal-v)"/>
                    <rect x="-15" y="0" width="30" height="30" fill="url(#metal-v)"/>
                    <!-- Inlet to Kiln -->
                    <path d="M 0,120 C 0,160 50,140 50,180" fill="none" stroke="url(#metal-v)" stroke-width="20"/>
                </g>

                <!-- Steam/Exhaust out the top -->
                <g transform="translate(0, -10)">
                    <circle cx="-10" cy="-20" r="15" fill="#94a3b8" class="smoke" />
                    <circle cx="10" cy="-40" r="25" fill="#cbd5e1" class="smoke" />
                    <circle cx="0" cy="-70" r="35" fill="#f8fafc" class="smoke" />
                </g>
            </g>

            <!-- Massive Rotary Kiln (Tilted) -->
            <g transform="translate(820, 1420) rotate(-4)" filter="url(#drop-shadow)">
                
                <!-- Support Piers -->
                <path d="M -400,60 L -360,60 L -370,180 L -410,180 Z" fill="#1e293b"/>
                <path d="M -150,60 L -110,60 L -120,180 L -160,180 Z" fill="#1e293b"/>
                <path d="M 100,60 L 140,60 L 130,180 L 90,180 Z" fill="#1e293b"/>

                <!-- Main Kiln Tube -->
                <rect x="-480" y="-50" width="650" height="100" fill="url(#kiln-grad)" rx="5"/>
                
                <!-- Intense Heat Glow Overlay (Burning Zone) -->
                <rect x="-480" y="-50" width="400" height="100" fill="url(#heat-grad)" style="mix-blend-mode: overlay;" class="pulsing-heat"/>
                
                <!-- Tire Rings (Riding Rings) -->
                <rect x="-390" y="-55" width="20" height="110" fill="#0f172a" rx="2"/>
                <rect x="-140" y="-55" width="20" height="110" fill="#0f172a" rx="2"/>
                <rect x="110" y="-55" width="20" height="110" fill="#0f172a" rx="2"/>

                <!-- Kiln Drive Gear (Center) -->
                <rect x="-30" y="-60" width="40" height="120" fill="url(#accent-grad)" rx="3"/>
                <path d="M -30,-60 L 10,-60 L 10,60 L -30,60 Z" fill="none" stroke="#ca8a04" stroke-width="4" stroke-dasharray="8 4" class="roll-kiln"/>

                <!-- Burner Pipe (Fuel Injection) -->
                <path d="M -600,0 L -480,0" fill="none" stroke="#475569" stroke-width="12"/>
                <path d="M -500,-10 L -470,0 L -500,10 Z" fill="#0f172a"/>
                
                <!-- Raging Flames inside Kiln -->
                <g transform="translate(-470, 0)" class="flame-anim" filter="url(#glow-fire)">
                    <path d="M 0,0 C 80,-40 150,-10 220,0 C 150,10 80,40 0,0 Z" fill="#ef4444"/>
                    <path d="M 0,0 C 60,-20 120,-5 180,0 C 120,5 60,20 0,0 Z" fill="#f59e0b"/>
                    <path d="M 0,0 C 40,-10 80,-2 120,0 C 80,2 40,10 0,0 Z" fill="#ffffff"/>
                </g>

                <!-- Fuel line flowing in -->
                <path d="M -700,0 L -500,0" fill="none" stroke="var(--c-fire)" stroke-width="4" stroke-dasharray="10 5" class="flow-conveyor" filter="url(#glow-bright)"/>
            </g>


            <!-- ========================================== -->
            <!-- STAGE 4: CLINKER COOLER & FINISH MILL      -->
            <!-- ========================================== -->
            
            <!-- Grate Cooler -->
            <g transform="translate(450, 1500)" filter="url(#drop-shadow)">
                <!-- Main Cooler Box -->
                <polygon points="-80,-40 120,0 120,80 -80,80" fill="url(#metal-v)" stroke="#334155" stroke-width="4"/>
                
                <!-- Glowing Clinker Bed inside -->
                <polygon points="-70,-20 110,10 110,30 -70,0" fill="url(#heat-grad)" class="pulsing-heat"/>
                
                <!-- Cooling Fans (Bottom) -->
                <g transform="translate(-40, 90)">
                    <circle cx="0" cy="0" r="20" fill="#0f172a"/>
                    <path d="M-15,0 L15,0 M0,-15 L0,15" stroke="#38bdf8" stroke-width="6" class="spin-fast" filter="url(#glow-bright)"/>
                </g>
                <g transform="translate(20, 90)">
                    <circle cx="0" cy="0" r="20" fill="#0f172a"/>
                    <path d="M-15,0 L15,0 M0,-15 L0,15" stroke="#38bdf8" stroke-width="6" class="spin-fast" filter="url(#glow-bright)"/>
                </g>
                <g transform="translate(80, 90)">
                    <circle cx="0" cy="0" r="20" fill="#0f172a"/>
                    <path d="M-15,0 L15,0 M0,-15 L0,15" stroke="#38bdf8" stroke-width="6" class="spin-fast" filter="url(#glow-bright)"/>
                </g>

                <!-- Drop chute -->
                <path d="M 80,80 L 80,140 L 40,180" fill="none" stroke="url(#pipe-grad)" stroke-width="30" stroke-linejoin="round"/>
            </g>

            <!-- Conveyor from Cooler to Finish Mill -->
            <path d="M 450 1680 L 750 1680" fill="none" stroke="#1e293b" stroke-width="24" stroke-linecap="round"/>
            <path d="M 450 1680 L 750 1680" fill="none" stroke="var(--c-clink)" stroke-width="8" stroke-dasharray="12 6" class="flow-conveyor" filter="url(#glow-bright)"/>

            <!-- Gypsum Hopper (Right side feeding into finish mill) -->
            <g transform="translate(1200, 1600)" filter="url(#drop-shadow)">
                <path d="M -50,-50 L 50,-50 L 20,40 L -20,40 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
                <text x="0" y="-10" text-anchor="middle" font-family="Orbitron" font-size="14" font-weight="bold" fill="#0f172a">GYPSUM</text>
                <!-- Feeder -->
                <path d="M -10,40 L -10,80 L -300,80" fill="none" stroke="#1e293b" stroke-width="16" stroke-linejoin="round"/>
                <path d="M -10,40 L -10,80 L -300,80" fill="none" stroke="var(--c-gyps)" stroke-width="6" stroke-dasharray="8 4" class="flow-conveyor"/>
            </g>

            <!-- Finish Tube Mill -->
            <g transform="translate(800, 1750)" filter="url(#drop-shadow)">
                <!-- Bases -->
                <rect x="-180" y="50" width="50" height="40" fill="#1e293b"/>
                <rect x="130" y="50" width="50" height="40" fill="#1e293b"/>
                
                <!-- Mill Body -->
                <rect x="-200" y="-50" width="400" height="100" fill="url(#metal-v)" rx="8"/>
                <rect x="-200" y="-50" width="400" height="100" fill="none" stroke="#475569" stroke-width="4" rx="8"/>
                
                <!-- Rotation details -->
                <g class="roll-kiln" stroke="#0f172a" stroke-width="8">
                    <line x1="-150" y1="-50" x2="-150" y2="50"/>
                    <line x1="-50" y1="-50" x2="-50" y2="50"/>
                    <line x1="50" y1="-50" x2="50" y2="50"/>
                    <line x1="150" y1="-50" x2="150" y2="50"/>
                </g>

                <!-- Elevator / Transport pipe to Cement Silos -->
                <path d="M 0,50 L 0,150" fill="none" stroke="url(#pipe-grad)" stroke-width="36"/>
            </g>


            <!-- ========================================== -->
            <!-- STAGE 5: CEMENT SILOS & DISPATCH           -->
            <!-- ========================================== -->
            
            <!-- Massive Concrete Dispatch Silos -->
            <g transform="translate(800, 2050)" filter="url(#drop-shadow)">
                <!-- Silo 1 -->
                <g transform="translate(-100, 0)">
                    <rect x="-60" y="-150" width="120" height="150" fill="url(#pipe-grad)"/>
                    <path d="M -60,-150 L 0,-180 L 60,-150 Z" fill="#94a3b8"/>
                    <path d="M -60,0 L -20,60 L 20,60 L 60,0 Z" fill="url(#pipe-grad)"/>
                    <rect x="-20" y="60" width="40" height="20" fill="#1e293b"/>
                </g>
                <!-- Silo 2 -->
                <g transform="translate(100, 0)">
                    <rect x="-60" y="-150" width="120" height="150" fill="url(#pipe-grad)"/>
                    <path d="M -60,-150 L 0,-180 L 60,-150 Z" fill="#94a3b8"/>
                    <path d="M -60,0 L -20,60 L 20,60 L 60,0 Z" fill="url(#pipe-grad)"/>
                    <rect x="-20" y="60" width="40" height="20" fill="#1e293b"/>
                </g>
            </g>

            <!-- Dispatch Truck (Highly Realistic) -->
            <g transform="translate(800, 2150)" filter="url(#drop-shadow)">
                <!-- Dust / Filling effect -->
                <path d="M -100,-20 L -80,20 L -120,20 Z" fill="rgba(148, 163, 184, 0.5)" filter="url(#glow-bright)"/>

                <!-- Truck Chassis & Wheels -->
                <rect x="-180" y="50" width="260" height="15" fill="#1e293b" rx="5"/>
                <circle cx="-140" cy="70" r="16" fill="#0f172a" stroke="#475569" stroke-width="4"/>
                <circle cx="-90" cy="70" r="16" fill="#0f172a" stroke="#475569" stroke-width="4"/>
                <circle cx="50" cy="70" r="16" fill="#0f172a" stroke="#475569" stroke-width="4"/>
                
                <!-- Truck Cab -->
                <path d="M 40,50 L 40,0 L 80,0 L 100,20 L 100,50 Z" fill="url(#accent-grad)"/>
                <polygon points="50,5 75,5 90,20 50,20" fill="#0f172a"/> <!-- Window -->

                <!-- Cement Drum / Tanker -->
                <ellipse cx="-70" cy="15" rx="90" ry="35" fill="url(#metal-v)"/>
                <ellipse cx="-70" cy="15" rx="90" ry="35" fill="none" stroke="#e2e8f0" stroke-width="2"/>
                <path d="M -150,50 L -160,0 L -180,0 L -180,50 Z" fill="url(#accent-grad)"/> <!-- Rear engine/pump -->
            </g>

            <!-- ========================================== -->
            <!-- DYNAMIC MATERIAL FLOW (Piping Internal)    -->
            <!-- ========================================== -->
            <g filter="url(#glow-bright)">
                <!-- Raw Mix Flowing UP to Preheater -->
                <path d="M 800 550 L 800 700" fill="none" stroke="var(--c-mix)" stroke-width="8" class="flow-path"/>
                <path d="M 800 950 L 800 1000" fill="none" stroke="var(--c-mix)" stroke-width="8" class="flow-path"/>
                
                <!-- Dropping into Preheater Tower -->
                <path d="M 800 1000 L 800 1350" fill="none" stroke="var(--c-mix)" stroke-width="6" class="flow-path"/>

                <!-- Finished Cement Flowing UP to Silos -->
                <path d="M 800 1800 L 800 1900" fill="none" stroke="var(--c-cem)" stroke-width="12" class="flow-path"/>
            </g>


            <!-- ========================================== -->
            <!-- SYSTEM LABELS & SCADA TAGS                 -->
            <!-- ========================================== -->
            <g>
                <!-- Stage 1 -->
                <rect x="200" y="50" width="200" height="40" class="label-bg"/>
                <text x="300" y="75" text-anchor="middle" class="label-txt" fill="var(--c-lime)">1. LIMESTONE EXTRACTION</text>

                <rect x="1200" y="50" width="200" height="40" class="label-bg"/>
                <text x="1300" y="75" text-anchor="middle" class="label-txt" fill="var(--c-clay)">1. CLAY EXTRACTION</text>

                <!-- Stage 2 -->
                <rect x="700" y="400" width="200" height="40" class="label-bg"/>
                <text x="800" y="425" text-anchor="middle" class="label-txt" fill="var(--c-mix)">2. RAW TUBE MILL</text>

                <rect x="920" y="750" width="160" height="40" class="label-bg"/>
                <text x="1000" y="775" text-anchor="middle" class="label-txt" fill="var(--c-mix)">HOMOGENIZATION</text>

                <!-- Stage 3 -->
                <rect x="940" y="1150" width="180" height="40" class="label-bg"/>
                <text x="1030" y="1175" text-anchor="middle" class="label-txt" fill="#f8fafc">3. CYCLONE PREHEATER</text>

                <rect x="500" y="1250" width="220" height="40" class="label-bg"/>
                <text x="610" y="1275" text-anchor="middle" class="label-txt" fill="var(--c-fire)">3. ROTARY KILN (1450°C)</text>

                <!-- Stage 4 -->
                <rect x="300" y="1460" width="180" height="40" class="label-bg"/>
                <text x="390" y="1485" text-anchor="middle" class="label-txt" fill="var(--c-clink)">4. GRATE COOLER</text>

                <rect x="880" y="1700" width="180" height="40" class="label-bg"/>
                <text x="970" y="1725" text-anchor="middle" class="label-txt" fill="var(--c-cem)">4. FINISH MILL</text>

                <!-- Stage 5 -->
                <rect x="940" y="1950" width="180" height="40" class="label-bg"/>
                <text x="1030" y="1975" text-anchor="middle" class="label-txt" fill="var(--c-cem)">5. STORAGE SILOS</text>

                <rect x="500" y="2150" width="220" height="40" class="label-bg"/>
                <text x="610" y="2175" text-anchor="middle" class="label-txt" fill="var(--c-accent)" style="font-size: 18px;">BULK DISPATCH TERMINAL</text>
            </g>

        </svg>
    </div>

    <script>
        // Automatic System Tour Logic
        const steps = [
            document.getElementById('step-1'),
            document.getElementById('step-2'),
            document.getElementById('step-3'),
            document.getElementById('step-4'),
            document.getElementById('step-5')
        ];
        
        // Define coordinates to scroll the canvas to for each step (x, y)
        const scrollPositions = [
            0,     // 1. Crushing
            400,   // 2. Milling & Blending
            1000,  // 3. Preheater & Kiln
            1500,  // 4. Cooler & Finish
            2000   // 5. Dispatch
        ];

        let currentStep = 0;
        const canvasWrapper = document.getElementById('canvas-wrapper');

        function autoCycle() {
            steps.forEach(step => step.classList.remove('active'));
            
            const activeStep = steps[currentStep];
            activeStep.classList.add('active');
            activeStep.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            // Smooth scroll the canvas to focus on the machinery
            canvasWrapper.scrollTo({
                top: scrollPositions[currentStep] * (canvasWrapper.scrollHeight / 2400),
                behavior: 'smooth'
            });

            currentStep = (currentStep + 1) % steps.length;
        }

        // Allow manual click on steps to pause auto-cycle temporarily
        let cycleTimer = setInterval(autoCycle, 5000);
        
        steps.forEach((step, index) => {
            step.addEventListener('click', () => {
                clearInterval(cycleTimer);
                currentStep = index;
                autoCycle();
                cycleTimer = setInterval(autoCycle, 5000);
            });
        });

        autoCycle(); // Init

        // Live Telemetry Simulation
        const kilnTemp = document.getElementById('kiln-temp');
        const feedRate = document.getElementById('feed-rate');
        const phTemp = document.getElementById('ph-temp');
        const outputRate = document.getElementById('output-rate');

        setInterval(() => {
            kilnTemp.innerText = `${1450 + (Math.floor(Math.random() * 11) - 5)} °C`;
            feedRate.innerText = `${320 + (Math.floor(Math.random() * 7) - 3)} T/H`;
            phTemp.innerText = `${850 + (Math.floor(Math.random() * 9) - 4)} °C`;
            outputRate.innerText = `${305 + (Math.floor(Math.random() * 5) - 2)} T/H`;
        }, 1500);

        // Simple drag-to-scroll for canvas
        let isDown = false;
        let startY;
        let scrollTop;

        canvasWrapper.addEventListener('mousedown', (e) => {
            isDown = true;
            startY = e.pageY - canvasWrapper.offsetTop;
            scrollTop = canvasWrapper.scrollTop;
            clearInterval(cycleTimer); // pause tour on interaction
        });
        canvasWrapper.addEventListener('mouseleave', () => isDown = false);
        canvasWrapper.addEventListener('mouseup', () => {
            isDown = false;
            cycleTimer = setInterval(autoCycle, 5000); // resume
        });
        canvasWrapper.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const y = e.pageY - canvasWrapper.offsetTop;
            const walk = (y - startY) * 2;
            canvasWrapper.scrollTop = scrollTop - walk;
        });

    </script>
</body>
</html>
