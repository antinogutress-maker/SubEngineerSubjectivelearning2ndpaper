<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Pop The Balloon</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap');

        :root {
            --bg-dark: #020617;
            --bg-panel: #0f172a;
            --text-main: #f8fafc;
            --accent-gold: #fbbf24;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #0ea5e9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            min-width: 900px; /* Forces wide layout for Desktop Site */
            overflow: hidden;
        }

        /* --- DESKTOP SITE WARNING --- */
        #desktop-hint {
            background: linear-gradient(90deg, #ec4899, #8b5cf6);
            color: white;
            text-align: center;
            padding: 8px 20px;
            font-size: 1.1rem;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #desktop-hint button {
            background: rgba(0,0,0,0.4);
            border: 1px solid white;
            color: white;
            padding: 4px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #desktop-hint button:hover { background: white; color: black; }

        /* --- HEADER --- */
        .header {
            height: 75px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 2px solid #1e293b;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 50;
        }
        .header h1 {
            font-size: 2rem; font-weight: 800;
            background: linear-gradient(to right, #ec4899, #fbbf24);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 1.5px;
        }
        .stats-box {
            display: flex; gap: 15px;
        }
        .stat-badge {
            background: rgba(2, 6, 23, 0.9);
            border: 2px solid;
            padding: 6px 18px; border-radius: 25px;
            font-family: 'JetBrains Mono', monospace; font-size: 1.3rem;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        #score-badge { border-color: var(--accent-gold); color: var(--accent-gold); }
        #notes-badge { border-color: var(--accent-blue); color: var(--accent-blue); }

        /* --- TARGET HUD --- */
        .target-hud-container {
            position: absolute;
            top: 95px; /* Below header */
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .target-hud-label {
            background: #020617;
            color: #94a3b8;
            padding: 4px 12px;
            border-radius: 10px 10px 0 0;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid #334155;
            border-bottom: none;
        }
        .target-hud {
            background: rgba(15, 23, 42, 0.95);
            padding: 15px 40px;
            border-radius: 15px;
            border: 4px solid #fff;
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .hud-change-anim { animation: hudPulse 0.5s ease; }
        @keyframes hudPulse {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.1); filter: brightness(1.5); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        /* --- GAME AREA (Sky) --- */
        .game-area {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at bottom, #1e293b 0%, #020617 100%);
            overflow: hidden;
        }

        /* --- BALLOONS --- */
        .balloon-wrapper {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: crosshair;
            z-index: 10;
            transition: transform 0.1s;
        }
        .balloon-wrapper:hover { transform: scale(1.05); }

        .balloon-svg {
            width: 80px; height: 110px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
            overflow: visible;
        }

        .hanging-note {
            margin-top: -5px; /* Overlap with string slightly */
            background: #fbbf24;
            color: #020617;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1.15rem;
            font-weight: 800;
            text-align: center;
            width: max-content;
            max-width: 260px;
            border: 3px solid #b45309;
            box-shadow: 0 8px 15px rgba(0,0,0,0.6);
            /* Gives it a slightly organic swing */
            transform-origin: top center;
            animation: swing 3s ease-in-out infinite alternate;
        }
        @keyframes swing {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }

        /* Drop Animation for Wrong Pop */
        .balloon-drop { animation: dropFast 0.8s ease-in forwards; pointer-events: none; }
        @keyframes dropFast {
            0% { transform: translateY(0) rotate(0deg); }
            20% { transform: translateY(-20px) rotate(-10deg); filter: grayscale(100%) brightness(0.5); }
            100% { transform: translateY(800px) rotate(45deg); opacity: 0; filter: grayscale(100%) brightness(0.5); }
        }

        /* --- EFFECTS --- */
        .particle { position: absolute; border-radius: 50%; pointer-events: none; z-index: 100; }
        
        .float-text {
            position: absolute; font-weight: 900; font-size: 2.5rem;
            pointer-events: none; z-index: 300;
            text-shadow: 0 4px 10px rgba(0,0,0,1);
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -80px) scale(1.5); }
        }

        /* --- END SCREEN --- */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(2, 6, 23, 0.98);
            display: flex; flex-direction: column; align-items: center;
            padding: 60px 40px; z-index: 500;
            opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease;
            overflow-y: auto;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }
        
        .book-summary {
            width: 100%; max-width: 800px;
            background: #0f172a; border: 1px solid #334155;
            border-radius: 15px; padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); margin-bottom: 40px;
        }
        .book-summary h2 {
            font-size: 2.8rem; color: #fbbf24; text-align: center; margin-bottom: 10px;
            text-transform: uppercase; border-bottom: 2px solid #334155; padding-bottom: 20px;
        }
        .book-summary p.score-report {
            text-align: center; font-size: 1.4rem; color: #94a3b8; margin-bottom: 40px; font-family: 'JetBrains Mono';
        }
        .chapter-section { margin-bottom: 30px; }
        .chapter-section h3 {
            font-size: 1.7rem; color: #38bdf8; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;
        }
        .chapter-section ul { list-style-type: none; padding-left: 20px; }
        .chapter-section li {
            font-size: 1.3rem; color: #e2e8f0; margin-bottom: 12px; position: relative; line-height: 1.5;
        }
        .chapter-section li::before {
            content: "➔"; position: absolute; left: -30px; color: #10b981; font-weight: bold;
        }
        button.play-btn {
            background: linear-gradient(135deg, #ec4899, #fbbf24); color: #000; border: none; padding: 20px 70px;
            font-size: 1.6rem; font-weight: 900; border-radius: 40px; cursor: pointer; transition: transform 0.2s;
            box-shadow: 0 10px 20px rgba(236, 72, 153, 0.4); flex-shrink: 0;
        }
        button.play-btn:hover { transform: scale(1.05); }

    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- 1. MASTER GAME DATA -->
    <!-- ========================================== -->
    <script>
        const MASTER_GAME_DATA = {
            gameTitle: "Laying and Bonds of Bricks",
            targets: [
                { id: 1, name: "Laying", color: "#3b82f6" },
                { id: 2, name: "Bonds", color: "#f59e0b" }
            ],
            notes: [
                { id: 101, targetId: 1, text: "Soak bricks in water before laying to stop them from absorbing water from mortar" },
                { id: 102, targetId: 1, text: "Lay bricks with the frog facing upward to form a strong shear key" },
                { id: 103, targetId: 1, text: "Check verticality strictly using a plumb bob" },
                { id: 104, targetId: 1, text: "Maintain uniform mortar joint thickness, typically 10mm" },
                { id: 105, targetId: 1, text: "Strictly avoid continuous vertical joints to prevent crack propagation" },
                { id: 201, targetId: 2, text: "Purpose is to distribute loads evenly over a large wall area" },
                { id: 202, targetId: 2, text: "English Bond: Alternate courses of headers and stretchers (Strongest bond)" },
                { id: 203, targetId: 2, text: "Flemish Bond: Alternate headers and stretchers in the same course (Best appearance)" },
                { id: 204, targetId: 2, text: "Queen closers are placed next to the corner header to break vertical joints" },
                { id: 205, targetId: 2, text: "Stretcher bond is only used for half-brick thick partition walls" },
                { id: 206, targetId: 2, text: "Header bond is best suited for curved walls and foundations" }
            ]

        };
    </script>

    <div id="desktop-hint">
        <span>📱 Enable <strong>"Desktop Site"</strong> in your mobile browser settings for the absolute best view!</span>
        <button onclick="document.getElementById('desktop-hint').style.display='none'">Dismiss</button>
    </div>

    <div class="header">
        <h1 id="ui-title">Game Title</h1>
        <div class="stats-box">
            <div class="stat-badge" id="score-badge">⭐ <span id="score">0</span></div>
            <div class="stat-badge" id="notes-badge">Popped: <span id="notesCaught">0</span> / <span id="notesTotal">0</span></div>
        </div>
    </div>

    <!-- Target HUD -->
    <div class="target-hud-container">
        <div class="target-hud-label">Find This Principle</div>
        <div class="target-hud" id="targetHud">Loading...</div>
    </div>

    <div class="game-area" id="gameArea">
        <!-- Balloons will be injected here dynamically -->
    </div>

    <!-- End Game Overlay -->
    <div class="overlay" id="endScreen">
        <div class="book-summary">
            <h2>Chapter Mastered</h2>
            <p class="score-report">Final Score: <span id="finalScore" style="color:#fbbf24; font-weight:bold;">0</span></p>
            <div id="summaryContent"></div>
        </div>
        <button class="play-btn" onclick="startGame()">Retake Test</button>
    </div>

    <script>
        // --- AUDIO ENGINE ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        const playSound = (type) => {
            if (!audioCtx) return;
            try {
                if (type === 'pop') {
                    // Bright, snappy Pop!
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.connect(gainNode); gainNode.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'wrong') {
                    // Dull Thud
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                    gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.connect(gainNode); gainNode.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {}
        };
        document.body.addEventListener('click', initAudio, { once: true });
        document.body.addEventListener('touchstart', initAudio, { once: true });

        // --- GAME VARIABLES ---
        const gameData = MASTER_GAME_DATA;
        document.getElementById('ui-title').innerText = gameData.gameTitle;
        document.getElementById('notesTotal').innerText = gameData.notes.length;

        const gameArea = document.getElementById('gameArea');
        const scoreEl = document.getElementById('score');
        const caughtEl = document.getElementById('notesCaught');
        const targetHud = document.getElementById('targetHud');

        let score = 0;
        let caughtCount = 0;
        let currentTargetId = null;
        let animationFrameId;
        
        // Note pools
        let pendingQueue = []; // Notes waiting to be spawned
        let activeBalloons = []; // Balloons currently floating
        let completedNoteIds = new Set(); // Notes correctly popped
        let lastSpawnTime = 0;
        let isGameRunning = false;

        // Colors for balloons
        const balloonColors = ["#ef4444", "#3b82f6", "#10b981", "#f59e0b", "#8b5cf6", "#ec4899"];

        function startGame() {
            score = 0;
            caughtCount = 0;
            scoreEl.innerText = score;
            caughtEl.innerText = caughtCount;
            completedNoteIds.clear();
            
            // Clear area
            activeBalloons.forEach(b => b.element.remove());
            activeBalloons = [];
            
            // Queue all notes
            pendingQueue = [...gameData.notes].sort(() => Math.random() - 0.5);
            
            document.getElementById('endScreen').classList.remove('active');
            
            setNewTarget();

            isGameRunning = true;
            lastSpawnTime = Date.now();
            cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function setNewTarget() {
            // Find targets that still have unpopped notes
            const availableTargets = new Set();
            gameData.notes.forEach(note => {
                if (!completedNoteIds.has(note.id)) {
                    availableTargets.add(note.targetId);
                }
            });

            const targetArray = Array.from(availableTargets);
            
            if (targetArray.length === 0) {
                // Game Over - all done
                isGameRunning = false;
                setTimeout(showWinScreen, 1000);
                return;
            }

            // Pick a random target from available. If possible, pick a different one than current.
            let newTargetId;
            if (targetArray.length > 1) {
                const others = targetArray.filter(id => id !== currentTargetId);
                newTargetId = others[Math.floor(Math.random() * others.length)];
            } else {
                newTargetId = targetArray[0];
            }

            currentTargetId = newTargetId;
            const targetData = gameData.targets.find(t => t.id === currentTargetId);

            // Update UI
            targetHud.innerText = targetData.name;
            targetHud.style.borderColor = targetData.color;
            targetHud.style.color = targetData.color;
            targetHud.style.boxShadow = `0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px ${targetData.color}44`;

            // Animation
            targetHud.classList.remove('hud-change-anim');
            void targetHud.offsetWidth;
            targetHud.classList.add('hud-change-anim');
        }

        function createBalloonSVG(color) {
            return `
                <svg class="balloon-svg" viewBox="0 0 60 100">
                    <defs>
                        <radialGradient id="grad-${color.replace('#','')}" cx="30%" cy="30%" r="50%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
                            <stop offset="20%" stop-color="${color}" />
                            <stop offset="100%" stop-color="#020617" />
                        </radialGradient>
                    </defs>
                    <!-- Balloon Body -->
                    <path d="M30,0 C10,0 0,15 0,35 C0,55 20,70 30,75 C40,70 60,55 60,35 C60,15 50,0 30,0 Z" fill="url(#grad-${color.replace('#','')})"/>
                    <!-- Knot -->
                    <path d="M30,75 L25,82 L35,82 Z" fill="${color}"/>
                    <!-- String -->
                    <path d="M30,82 Q35,90 30,100" stroke="#94a3b8" fill="none" stroke-width="2"/>
                </svg>
            `;
        }

        function spawnBalloon() {
            if (pendingQueue.length === 0) return;
            
            const noteData = pendingQueue.shift();
            const bColor = balloonColors[Math.floor(Math.random() * balloonColors.length)];
            
            const el = document.createElement('div');
            el.className = 'balloon-wrapper';
            
            el.innerHTML = `
                ${createBalloonSVG(bColor)}
                <div class="hanging-note">${noteData.text}</div>
            `;
            
            gameArea.appendChild(el);

            // Positioning
            const playRect = gameArea.getBoundingClientRect();
            // Start below screen
            const startY = playRect.height + 150; 
            
            // Random X, keeping fully inside screen
            const minX = 130;
            const maxX = playRect.width - 130;
            const startX = Math.random() * (maxX - minX) + minX;

            const balloonObj = {
                data: noteData,
                element: el,
                color: bColor,
                x: startX,
                y: startY,
                speed: Math.random() * 1.5 + 1.5, // Rise speed
                isDead: false
            };

            // Click Handler
            el.onmousedown = () => popBalloon(balloonObj);
            el.ontouchstart = (e) => { e.preventDefault(); popBalloon(balloonObj); };

            activeBalloons.push(balloonObj);
        }

        function popBalloon(balloon) {
            if (!isGameRunning || balloon.isDead) return;
            initAudio(); // ensure audio plays
            
            balloon.isDead = true; // prevent double clicks

            const isCorrect = (balloon.data.targetId === currentTargetId);
            const rect = balloon.element.getBoundingClientRect();
            const gameRect = gameArea.getBoundingClientRect();
            const hitX = rect.left + rect.width / 2 - gameRect.left;
            const hitY = rect.top + 50 - gameRect.top; // approx center of balloon

            if (isCorrect) {
                // Correct Pop!
                playSound('pop');
                score += 10;
                caughtCount++;
                completedNoteIds.add(balloon.data.id);
                
                scoreEl.innerText = score;
                caughtEl.innerText = caughtCount;
                
                createExplosion(hitX, hitY, balloon.color);
                showFloatingText("+10", hitX, hitY, "#10b981");
                
                balloon.element.remove();

                // AUTOMATICALLY CHANGE TOPIC!
                setNewTarget();

            } else {
                // Wrong Pop!
                playSound('wrong');
                score -= 5;
                scoreEl.innerText = score;
                
                showFloatingText("-5", hitX, hitY, "#ef4444");

                // Drop animation
                balloon.element.classList.add('balloon-drop');
                const domEl = balloon.element;
                setTimeout(() => domEl.remove(), 800);

                // Return note to queue so it spawns again later
                pendingQueue.push(balloon.data);
            }
        }

        function gameLoop() {
            if (!isGameRunning) return;

            // Spawn Logic: keep ~4 balloons on screen if available
            const now = Date.now();
            const maxBalloons = Math.min(4, gameData.notes.length - completedNoteIds.size);
            
            let aliveBalloons = activeBalloons.filter(b => !b.isDead).length;
            
            if (aliveBalloons < maxBalloons && pendingQueue.length > 0) {
                if (now - lastSpawnTime > 1200) { 
                    spawnBalloon();
                    lastSpawnTime = now;
                }
            }

            // Movement Logic
            for (let i = activeBalloons.length - 1; i >= 0; i--) {
                const b = activeBalloons[i];
                if (b.isDead) {
                    // It was popped, remove from active tracking
                    activeBalloons.splice(i, 1);
                    continue;
                }

                b.y -= b.speed;
                // Add a gentle horizontal sway
                const sway = Math.sin(now / 1000 + b.x) * 20; 
                b.element.style.transform = `translate(calc(-50% + ${sway}px), ${b.y}px)`;
                b.element.style.left = `${b.x}px`;

                // If it floats off the top without being clicked
                if (b.y < -200) {
                    b.element.remove();
                    // Put it back in queue to spawn again!
                    pendingQueue.push(b.data);
                    activeBalloons.splice(i, 1);
                }
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- VISUAL EFFECTS ---
        function createExplosion(x, y, color) {
            for (let i = 0; i < 25; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.background = color;
                particle.style.boxShadow = `0 0 10px ${color}`;
                
                const size = Math.random() * 8 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                gameArea.appendChild(particle);

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 100 + 20;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                const anim = particle.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`, opacity: 0 }
                ], {
                    duration: Math.random() * 400 + 300,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
                });
                anim.onfinish = () => particle.remove();
            }
        }

        function showFloatingText(text, x, y, color) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.innerText = text;
            el.style.color = color;
            el.style.left = `${x}px`;
            el.style.top = `${y - 30}px`;
            gameArea.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        // --- END SCREEN ---
        function showWinScreen() {
            document.getElementById('finalScore').innerText = score;
            const summaryContent = document.getElementById('summaryContent');
            summaryContent.innerHTML = '';
            
            gameData.targets.forEach(target => {
                const targetNotes = gameData.notes.filter(n => n.targetId === target.id);
                if(targetNotes.length === 0) return;

                const section = document.createElement('div');
                section.className = 'chapter-section';
                let html = `<h3 style="color: ${target.color}">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="${target.color}"><circle cx="12" cy="12" r="10"/></svg>
                                ${target.name}
                            </h3>`;
                html += `<ul>`;
                targetNotes.forEach(note => {
                    html += `<li>${note.text}</li>`;
                });
                html += `</ul>`;
                section.innerHTML = html;
                summaryContent.appendChild(section);
            });

            document.getElementById('endScreen').classList.add('active');
        }

        // Boot Game
        startGame();

    </script>
</body>
</html>
