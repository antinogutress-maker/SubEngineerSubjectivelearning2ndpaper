<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Notes Catcher</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap');

        :root {
            --bg-dark: #020617;
            --bg-panel: #0f172a;
            --text-main: #f8fafc;
            --accent-gold: #fbbf24;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #0ea5e9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            min-width: 900px; /* Forces wide layout for Desktop Site */
            overflow: hidden;
        }

        /* --- DESKTOP SITE WARNING --- */
        #desktop-hint {
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            color: white;
            text-align: center;
            padding: 8px 20px;
            font-size: 1.1rem;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #desktop-hint button {
            background: rgba(0,0,0,0.4);
            border: 1px solid white;
            color: white;
            padding: 4px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #desktop-hint button:hover { background: white; color: black; }

        /* --- HEADER --- */
        .header {
            height: 75px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 2px solid #1e293b;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 10;
        }
        .header h1 {
            font-size: 2rem; font-weight: 800;
            background: linear-gradient(to right, #fbbf24, #f97316);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 1.5px;
        }
        .stats-box {
            position: absolute; right: 30px;
            display: flex; gap: 15px;
        }
        .stat-badge {
            background: rgba(2, 6, 23, 0.9);
            border: 2px solid;
            padding: 6px 18px; border-radius: 25px;
            font-family: 'JetBrains Mono', monospace; font-size: 1.3rem;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        #score-badge { border-color: var(--accent-gold); color: var(--accent-gold); }
        #notes-badge { border-color: var(--accent-blue); color: var(--accent-blue); }

        /* --- GAME AREA --- */
        .game-area {
            flex: 1;
            display: flex;
            background: radial-gradient(circle at top, #1e293b 0%, #020617 100%);
            position: relative;
            overflow: hidden;
        }

        /* Playable Catching Zone */
        .play-zone {
            flex: 1;
            position: relative;
            overflow: hidden;
            /* Grid background for depth */
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* --- THE BASKET --- */
        #basket-container {
            position: absolute;
            bottom: 40px;
            left: 50%; /* Set by JS */
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 220px;
            pointer-events: none; /* Let touch events pass to play-zone */
            z-index: 20;
            transition: color 0.3s;
        }

        .basket-svg {
            width: 160px;
            height: 100px;
            filter: drop-shadow(0 0 20px currentColor);
            transition: all 0.3s ease;
        }

        .basket-title {
            margin-top: 10px;
            background: #020617;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            border: 3px solid currentColor;
            font-weight: 800;
            font-size: 1.2rem;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            width: max-content;
            max-width: 300px;
        }

        /* Basket Catch Animation */
        .basket-catch-anim { animation: basketBounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes basketBounce {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1) translateY(10px); filter: brightness(1.5); }
            100% { transform: translateX(-50%) scale(1); }
        }

        /* --- FALLING NOTES --- */
        .falling-note {
            position: absolute;
            top: -100px;
            left: 0; /* Set by JS */
            width: 200px;
            background: rgba(251, 191, 36, 0.95);
            border: 3px solid #b45309;
            color: #000;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1.1rem;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 10;
            transform: translateX(-50%);
            /* Add a glowing tail/aura */
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.6), inset 0 0 10px rgba(255,255,255,0.5);
        }

        /* Wrong Basket Bounce Animation */
        .bounce-away {
            animation: flyAway 0.6s ease-in forwards;
        }
        @keyframes flyAway {
            0% { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateX(-150%) scale(0.5) rotate(-45deg) translateY(-200px); opacity: 0; }
        }

        /* --- SIDE SWAP BUTTON PANEL --- */
        .swap-panel {
            width: 220px;
            background: #0f172a;
            border-left: 4px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
            z-index: 30;
        }

        .swap-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            border-radius: 20px;
            width: 100%;
            padding: 40px 20px;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.5);
            transition: all 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .swap-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(139, 92, 246, 0.5);
        }
        .swap-btn svg { width: 50px; height: 50px; fill: white; }

        .next-up-indicator {
            margin-top: 30px;
            text-align: center;
            color: #94a3b8;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .next-color-box {
            width: 40px; height: 40px;
            border-radius: 50%;
            margin: 10px auto;
            border: 3px solid #fff;
            box-shadow: 0 0 15px currentColor;
        }

        /* --- PARTICLES & TEXT --- */
        .particle { position: absolute; border-radius: 50%; pointer-events: none; z-index: 100; }
        .float-text {
            position: absolute; font-weight: 900; font-size: 2.5rem;
            pointer-events: none; z-index: 300;
            text-shadow: 0 4px 10px rgba(0,0,0,1);
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
        }

        /* --- END SCREEN --- */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(2, 6, 23, 0.98);
            display: flex; flex-direction: column; align-items: center;
            padding: 60px 40px; z-index: 500;
            opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease;
            overflow-y: auto;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }
        
        .book-summary {
            width: 100%; max-width: 800px;
            background: #0f172a; border: 1px solid #334155;
            border-radius: 15px; padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            margin-bottom: 40px;
        }
        .book-summary h2 {
            font-size: 2.8rem; color: #fbbf24; text-align: center; margin-bottom: 10px;
            text-transform: uppercase; border-bottom: 2px solid #334155; padding-bottom: 20px;
        }
        .book-summary p.score-report {
            text-align: center; font-size: 1.4rem; color: #94a3b8; margin-bottom: 40px; font-family: 'JetBrains Mono';
        }
        .chapter-section { margin-bottom: 30px; }
        .chapter-section h3 {
            font-size: 1.7rem; color: #38bdf8; margin-bottom: 15px;
            display: flex; align-items: center; gap: 10px;
        }
        .chapter-section ul { list-style-type: none; padding-left: 20px; }
        .chapter-section li {
            font-size: 1.3rem; color: #e2e8f0; margin-bottom: 12px; position: relative; line-height: 1.5;
        }
        .chapter-section li::before {
            content: "➔"; position: absolute; left: -30px; color: #10b981; font-weight: bold;
        }
        button.play-btn {
            background: linear-gradient(135deg, #0ea5e9, #10b981); color: #000; border: none; padding: 20px 70px;
            font-size: 1.6rem; font-weight: 900; border-radius: 40px; cursor: pointer; transition: transform 0.2s;
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.4); flex-shrink: 0;
        }
        button.play-btn:hover { transform: scale(1.05); }

    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- 1. MASTER GAME DATA -->
    <!-- ========================================== -->
    <script>
        const MASTER_GAME_DATA = {
            gameTitle: "Types of Bitumen",
            targets: [
                { id: 1, name: "Penetration Grade Bitumen", color: "#3b82f6" },

                { id: 4, name: "Modified Bitumen", color: "#8b5cf6" },
                { id: 5, name: "Oxidized (Blown) Bitumen", color: "#ef4444" }
            ],
            notes: [

                { id: 102, targetId: 1, text: "E.g., 80/100 grade means 8 to 10 mm penetration depth" },
                { id: 103, targetId: 1, text: "Lower penetration grades (e.g., 30/40) are harder, best for hot climates" },

                { id: 501, targetId: 5, text: "Produced by blowing air through hot bitumen during manufacturing" },
                { id: 502, targetId: 5, text: "Has lower temperature susceptibility (doesn't soften easily in heat)" },
                { id: 503, targetId: 5, text: "Widely used for industrial applications, roofing, waterproofing, and joint fillers" }
            ]

        };
    </script>

    <div id="desktop-hint">
        <span>📱 Enable <strong>"Desktop Site"</strong> in your mobile browser settings for the absolute best view!</span>
        <button onclick="document.getElementById('desktop-hint').style.display='none'">Dismiss</button>
    </div>

    <div class="header">
        <h1 id="ui-title">Game Title</h1>
        <div class="stats-box">
            <div class="stat-badge" id="score-badge">⭐ <span id="score">0</span></div>
            <div class="stat-badge" id="notes-badge">Caught: <span id="notesCaught">0</span> / <span id="notesTotal">0</span></div>
        </div>
    </div>

    <div class="game-area">
        
        <!-- Left: Play Zone (Falling notes and basket) -->
        <div class="play-zone" id="playZone">
            
            <!-- Dynamic Basket -->
            <div id="basket-container">
                <svg class="basket-svg" viewBox="0 0 200 120">
                    <defs>
                        <linearGradient id="basketGlow" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="currentColor" stop-opacity="0.8"/>
                            <stop offset="100%" stop-color="currentColor" stop-opacity="0.1"/>
                        </linearGradient>
                    </defs>
                    <!-- Back Rim -->
                    <ellipse cx="100" cy="20" rx="90" ry="15" fill="#020617" stroke="#334155" stroke-width="4"/>
                    <!-- Basket Body -->
                    <path d="M 10,20 Q 10,110 50,110 L 150,110 Q 190,110 190,20 Z" fill="url(#basketGlow)" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
                    <!-- Front Rim -->
                    <path d="M 10,20 Q 100,40 190,20" fill="none" stroke="currentColor" stroke-width="8"/>
                </svg>
                <div class="basket-title" id="basketTitle">Title</div>
            </div>

        </div>

        <!-- Right: Side Swap Panel -->
        <div class="swap-panel">
            <button class="swap-btn" id="swapBtn">
                <svg viewBox="0 0 24 24"><path d="M12 2.5A9.5 9.5 0 0 0 2.5 12a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2 5.5 5.5 0 1 1 5.5 5.5h-1.6l2.8 2.8-2.8 2.8V19.5H12a9.5 9.5 0 1 0 0-17z"/></svg>
                Change<br>Basket
            </button>
            <div class="next-up-indicator">
                Next Basket:
                <div class="next-color-box" id="nextColorBox"></div>
            </div>
        </div>
    </div>

    <!-- End Game Overlay -->
    <div class="overlay" id="endScreen">
        <div class="book-summary">
            <h2>Chapter Mastered</h2>
            <p class="score-report">Final Score: <span id="finalScore" style="color:#fbbf24; font-weight:bold;">0</span></p>
            <div id="summaryContent"></div>
        </div>
        <button class="play-btn" onclick="startGame()">Retake Test</button>
    </div>

    <script>
        // --- AUDIO ENGINE ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        const playSound = (type) => {
            if (!audioCtx) return;
            try {
                if (type === 'catch') {
                    // Magical Chime (Arpeggio)
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime); // E5
                    osc.frequency.setValueAtTime(880.00, audioCtx.currentTime + 0.1); // A5
                    osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.2); // E6
                    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.connect(gainNode); gainNode.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    // Dull Thud / Boing
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
                    gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.connect(gainNode); gainNode.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {}
        };
        document.body.addEventListener('click', initAudio, { once: true });
        document.body.addEventListener('touchstart', initAudio, { once: true });

        // --- GAME VARIABLES ---
        const gameData = MASTER_GAME_DATA;
        document.getElementById('ui-title').innerText = gameData.gameTitle;
        document.getElementById('notesTotal').innerText = gameData.notes.length;

        const playZone = document.getElementById('playZone');
        const basketContainer = document.getElementById('basketContainer'); // Typo fix below
        const basketElem = document.getElementById('basket-container');
        const basketTitle = document.getElementById('basketTitle');
        const swapBtn = document.getElementById('swapBtn');
        const nextColorBox = document.getElementById('nextColorBox');
        const scoreEl = document.getElementById('score');
        const caughtEl = document.getElementById('notesCaught');

        let score = 0;
        let caughtCount = 0;
        let currentTargetIndex = 0;
        let basketX = 0;
        let animationFrameId;
        
        // Queue system
        let pendingQueue = [];
        let activeNotes = [];
        let lastSpawnTime = 0;
        let isGameRunning = false;

        // --- BASKET MOVEMENT ---
        playZone.addEventListener('mousemove', (e) => {
            if(!isGameRunning) return;
            const rect = playZone.getBoundingClientRect();
            // Clamp basket inside play area
            let x = e.clientX - rect.left;
            x = Math.max(110, Math.min(x, rect.width - 110)); 
            basketX = x;
            basketElem.style.left = `${basketX}px`;
        });

        playZone.addEventListener('touchmove', (e) => {
            if(!isGameRunning) return;
            // Prevent scrolling while dragging basket
            e.preventDefault(); 
            const rect = playZone.getBoundingClientRect();
            let x = e.touches[0].clientX - rect.left;
            x = Math.max(110, Math.min(x, rect.width - 110));
            basketX = x;
            basketElem.style.left = `${basketX}px`;
        }, { passive: false });

        // --- BASKET SWAPPING ---
        function updateBasketUI() {
            const target = gameData.targets[currentTargetIndex];
            basketElem.style.color = target.color;
            basketTitle.innerText = target.name;

            // Update "Next Up" indicator
            const nextIndex = (currentTargetIndex + 1) % gameData.targets.length;
            nextColorBox.style.color = gameData.targets[nextIndex].color;
        }

        swapBtn.addEventListener('click', () => {
            initAudio();
            currentTargetIndex = (currentTargetIndex + 1) % gameData.targets.length;
            updateBasketUI();
        });

        // --- GAME LOOP ---
        function startGame() {
            score = 0;
            caughtCount = 0;
            scoreEl.innerText = score;
            caughtEl.innerText = caughtCount;
            currentTargetIndex = 0;
            activeNotes.forEach(n => n.element.remove());
            activeNotes = [];
            
            // Shuffle notes into pending queue
            pendingQueue = [...gameData.notes].sort(() => Math.random() - 0.5);
            
            updateBasketUI();
            document.getElementById('endScreen').classList.remove('active');
            
            // Center basket initially
            basketX = playZone.clientWidth / 2;
            basketElem.style.left = `${basketX}px`;

            isGameRunning = true;
            lastSpawnTime = Date.now();
            cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function spawnNote() {
            if (pendingQueue.length === 0) return;
            
            const noteData = pendingQueue.shift();
            const el = document.createElement('div');
            el.className = 'falling-note';
            el.innerText = noteData.text;
            playZone.appendChild(el);

            // Random X position ensuring it doesn't spawn half off-screen
            const minX = 110;
            const maxX = playZone.clientWidth - 110;
            const startX = Math.random() * (maxX - minX) + minX;

            activeNotes.push({
                data: noteData,
                element: el,
                x: startX,
                y: -100,
                speed: Math.random() * 2 + 2.5 // Fall speed between 2.5 and 4.5
            });
        }

        function gameLoop() {
            if (!isGameRunning) return;

            // Spawn logic: Try to keep 2-3 notes on screen
            const now = Date.now();
            if (activeNotes.length < 3 && pendingQueue.length > 0) {
                if (now - lastSpawnTime > 1500) { // Spawn every 1.5 seconds max
                    spawnNote();
                    lastSpawnTime = now;
                }
            }

            // Basket bounding box
            const basketRect = basketElem.getBoundingClientRect();
            const playRect = playZone.getBoundingClientRect();
            // Local coords for basket catch zone (top rim of basket)
            const catchY = basketRect.top - playRect.top + 20; 
            const catchLeft = basketX - 90;
            const catchRight = basketX + 90;

            for (let i = activeNotes.length - 1; i >= 0; i--) {
                const note = activeNotes[i];
                note.y += note.speed;
                note.element.style.transform = `translate(-50%, ${note.y}px)`;
                note.element.style.left = `${note.x}px`;

                // Check Collision
                // If note bottom reaches basket rim level
                if (note.y + 30 > catchY && note.y < catchY + 50) {
                    if (note.x > catchLeft && note.x < catchRight) {
                        // IT HIT THE BASKET
                        const currentTarget = gameData.targets[currentTargetIndex];
                        
                        if (note.data.targetId === currentTarget.id) {
                            // CORRECT BASKET!
                            playSound('catch');
                            score += 10;
                            caughtCount++;
                            scoreEl.innerText = score;
                            caughtEl.innerText = caughtCount;
                            
                            createExplosion(note.x, catchY, currentTarget.color);
                            showFloatingText("+10", note.x, catchY, "#10b981");
                            
                            // Basket animation
                            basketElem.classList.remove('basket-catch-anim');
                            void basketElem.offsetWidth;
                            basketElem.classList.add('basket-catch-anim');

                            note.element.remove();
                            activeNotes.splice(i, 1);

                            if (caughtCount === gameData.notes.length) {
                                isGameRunning = false;
                                setTimeout(showWinScreen, 1000);
                            }
                            continue;
                        } else {
                            // WRONG BASKET!
                            playSound('wrong');
                            score -= 5;
                            scoreEl.innerText = score;
                            
                            createExplosion(note.x, catchY, "#ef4444");
                            showFloatingText("-5", note.x, catchY, "#ef4444");

                            // Bounce it away visually
                            note.element.classList.add('bounce-away');
                            const domElement = note.element;
                            setTimeout(() => domElement.remove(), 600);
                            
                            // Put back in queue to fall again later
                            pendingQueue.push(note.data);
                            activeNotes.splice(i, 1);
                            continue;
                        }
                    }
                }

                // If note hits the floor (missed entirely)
                if (note.y > playRect.height + 100) {
                    // Recycle without penalty (or small penalty if desired. Left as 0 penalty)
                    note.element.remove();
                    pendingQueue.push(note.data);
                    activeNotes.splice(i, 1);
                }
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- VISUAL EFFECTS ---
        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.background = color;
                particle.style.boxShadow = `0 0 10px ${color}`;
                
                const size = Math.random() * 8 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                playZone.appendChild(particle);

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 80 + 20;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                const anim = particle.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${dx}px, ${dy}px) scale(0)`, opacity: 0 }
                ], {
                    duration: Math.random() * 400 + 300,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
                });
                anim.onfinish = () => particle.remove();
            }
        }

        function showFloatingText(text, x, y, color) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.innerText = text;
            el.style.color = color;
            el.style.left = `${x - 20}px`;
            el.style.top = `${y - 40}px`;
            playZone.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        // --- END SCREEN ---
        function showWinScreen() {
            document.getElementById('finalScore').innerText = score;
            const summaryContent = document.getElementById('summaryContent');
            summaryContent.innerHTML = '';
            
            gameData.targets.forEach(target => {
                const targetNotes = gameData.notes.filter(n => n.targetId === target.id);
                if(targetNotes.length === 0) return;

                const section = document.createElement('div');
                section.className = 'chapter-section';
                let html = `<h3 style="color: ${target.color}">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="${target.color}"><circle cx="12" cy="12" r="10"/></svg>
                                ${target.name}
                            </h3>`;
                html += `<ul>`;
                targetNotes.forEach(note => {
                    html += `<li>${note.text}</li>`;
                });
                html += `</ul>`;
                section.innerHTML = html;
                summaryContent.appendChild(section);
            });

            document.getElementById('endScreen').classList.add('active');
        }

        // Boot Game
        startGame();

    </script>
</body>
</html>
