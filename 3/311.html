<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Memorization Shooter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap');

        :root {
            --bg-dark: #020617;
            --bg-panel: #0f172a;
            --text-main: #f8fafc;
            --accent-gold: #fbbf24;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #0ea5e9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            min-width: 900px; /* Forces wide layout for Desktop Site */
        }

        /* --- DESKTOP SITE WARNING --- */
        #desktop-hint {
            background: linear-gradient(90deg, #ef4444, #f97316);
            color: white;
            text-align: center;
            padding: 8px 20px;
            font-size: 1.1rem;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #desktop-hint button {
            background: rgba(0,0,0,0.4);
            border: 1px solid white;
            color: white;
            padding: 4px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #desktop-hint button:hover { background: white; color: black; }

        /* --- HEADER --- */
        .header {
            height: 75px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 2px solid #1e293b;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 10;
        }
        .header h1 {
            font-size: 2rem; font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #34d399);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 1.5px;
        }
        .stats-box {
            position: absolute; right: 30px;
            display: flex; gap: 15px;
        }
        .stat-badge {
            background: rgba(2, 6, 23, 0.9);
            border: 2px solid;
            padding: 6px 18px; border-radius: 25px;
            font-family: 'JetBrains Mono', monospace; font-size: 1.3rem;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        #score-badge { border-color: var(--accent-gold); color: var(--accent-gold); }
        #notes-badge { border-color: var(--accent-blue); color: var(--accent-blue); }

        /* --- GAME AREA (65% Height) --- */
        .game-area {
            flex: 0 0 65vh;
            display: flex;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            position: relative;
            overflow: hidden;
        }

        /* Fixed Gun Area (Left) */
        .gun-container {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%); 
            width: 320px; 
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        /* Smoothing transition for mouse tracking */
        #gunGraphics {
            transition: transform 0.1s ease-out;
            transform-origin: 120px 220px; /* Pivot around the grip/trigger */
        }

        /* Scrolling Targets Area (Right) */
        .targets-container {
            position: absolute;
            left: 320px; 
            right: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            align-items: flex-end; 
            padding: 60px 40px 60px 0;
            gap: 150px; 
            background: transparent; 
            z-index: 10;
        }
        .targets-container::-webkit-scrollbar { width: 10px; }
        .targets-container::-webkit-scrollbar-track { background: transparent; }
        .targets-container::-webkit-scrollbar-thumb { background: #475569; border-radius: 5px; }

        /* --- TARGETS --- */
        .target-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            cursor: crosshair;
            transition: transform 0.2s;
        }
        .target-wrapper:hover .target-svg { transform: scale(1.1); }
        
        .target-wrapper.impact-anim { animation: impact 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
        @keyframes impact {
            0% { transform: translateX(0); }
            20% { transform: translateX(15px) rotate(5deg); filter: brightness(1.5); }
            40% { transform: translateX(-10px) rotate(-3deg); }
            60% { transform: translateX(5px) rotate(2deg); }
            80% { transform: translateX(-2px) rotate(-1deg); }
            100% { transform: translateX(0); filter: brightness(1); }
        }

        .target-svg { width: 110px; height: 110px; filter: drop-shadow(0 0 15px currentColor); transition: transform 0.3s; z-index: 5;}
        
        .target-label {
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
            text-align: center;
            background: #020617;
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid currentColor;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            z-index: 5;
        }

        /* Embedded Bullets Container */
        .embedded-bullets-area {
            position: absolute;
            left: -280px; 
            top: 0;
            width: 280px;
            height: 100px;
            pointer-events: none;
            z-index: 1;
        }

        /* --- NOTE TRAY (35% Height) --- */
        .tray-container {
            flex: 1;
            background: #020617;
            border-top: 5px solid #1e293b;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: center;
            align-content: flex-start;
            padding: 25px;
            gap: 20px;
            overflow-y: auto;
            box-shadow: inset 0 15px 30px rgba(0,0,0,0.9);
        }

        .note-card {
            width: calc(33% - 20px);
            min-width: 260px;
            min-height: 100px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            position: relative;
        }
        .note-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: #475569; border-radius: 10px 0 0 10px; transition: 0.2s;
        }
        .note-card:hover { transform: translateY(-4px); border-color: var(--accent-blue); color: #fff; }
        .note-card:hover::before { background: var(--accent-blue); }
        
        .note-card.selected {
            border-color: var(--accent-gold);
            background: rgba(251, 191, 36, 0.15);
            color: var(--accent-gold);
            transform: scale(0.95);
            pointer-events: none;
            box-shadow: inset 0 0 20px rgba(251, 191, 36, 0.2);
        }
        .note-card.selected::before { background: var(--accent-gold); }
        .note-card.hidden { display: none; }

        /* --- SVG GUN & BULLETS --- */
        .gun-svg { width: 100%; height: 100%; overflow: visible; }
        
        .high-contrast-tooltip {
            background: #fbbf24;
            color: #000;
            padding: 8px 16px; 
            border-radius: 6px;
            font-size: 14px; 
            font-weight: 800;
            border: 2px solid #000;
            text-align: center;
            width: max-content;
            max-width: 240px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            margin: 0 auto;
        }

        .bullet-composition {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px; 
            height: 20px;
        }
        .bullet-text-layer {
            position: absolute;
            top: -45px; 
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .flying-bullet {
            position: fixed;
            z-index: 200;
            pointer-events: none;
            transform-origin: center right; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .embedded-bullet {
            position: absolute;
            right: 0px; 
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: right center;
            animation: thwack 0.3s ease-out forwards;
        }
        
        @keyframes thwack {
            0% { transform: translateX(-50px) scale(1.2); opacity: 0; }
            50% { transform: translateX(10px) scale(0.9); opacity: 1; }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }

        .particle { position: fixed; border-radius: 50%; pointer-events: none; z-index: 150; }
        .muzzle-flash { position: fixed; border-radius: 50%; background: #fef08a; pointer-events: none; z-index: 100; box-shadow: 0 0 40px 10px #f59e0b; }

        .float-text {
            position: fixed;
            font-weight: 900; font-size: 2.2rem;
            pointer-events: none; z-index: 300;
            text-shadow: 0 3px 8px rgba(0,0,0,1);
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.5); }
        }

        /* --- END SCREEN (BOOK CHAPTER SUMMARY) --- */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #020617;
            display: flex; flex-direction: column; align-items: center;
            padding: 60px 40px; z-index: 500;
            opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease;
            overflow-y: auto;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }
        
        .book-summary {
            width: 100%; max-width: 800px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            margin-bottom: 40px;
        }
        .book-summary h2 {
            font-size: 2.8rem; color: #fbbf24; text-align: center; margin-bottom: 10px;
            text-transform: uppercase; border-bottom: 2px solid #334155; padding-bottom: 20px;
        }
        .book-summary p.score-report {
            text-align: center; font-size: 1.4rem; color: #94a3b8; margin-bottom: 40px; font-family: 'JetBrains Mono';
        }

        .chapter-section { margin-bottom: 30px; }
        .chapter-section h3 {
            font-size: 1.7rem; color: #38bdf8; margin-bottom: 15px;
            display: flex; align-items: center; gap: 10px;
        }
        .chapter-section ul {
            list-style-type: none; padding-left: 20px;
        }
        .chapter-section li {
            font-size: 1.3rem; color: #e2e8f0; margin-bottom: 12px; position: relative;
            line-height: 1.5;
        }
        .chapter-section li::before {
            content: "➔"; position: absolute; left: -30px; color: #10b981; font-weight: bold;
        }

        button.play-btn {
            background: linear-gradient(135deg, #0ea5e9, #10b981);
            color: #000; border: none; padding: 20px 70px;
            font-size: 1.6rem; font-weight: 900; border-radius: 40px;
            cursor: pointer; transition: transform 0.2s;
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.4);
            flex-shrink: 0;
        }
        button.play-btn:hover { transform: scale(1.05); }

    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- 1. MASTER GAME DATA -->
    <!-- ========================================== -->
    <script>
        const MASTER_GAME_DATA = {
            gameTitle: "Internal Effects of Loading",
            targets: [
                { id: 1, name: "Axial Stress", color: "#3b82f6" },
                { id: 2, name: "Shear Stress", color: "#f59e0b" },
                { id: 3, name: "Bending Stress", color: "#10b981" },
                { id: 4, name: "Torsional Stress", color: "#8b5cf6" }
            ],
            notes: [
                { id: 101, targetId: 1, text: "Developed when a load acts parallel to the longitudinal axis of the member" },
                { id: 102, targetId: 1, text: "Results in uniform internal resistance (pure Tension or pure Compression)" },
                { id: 103, targetId: 1, text: "Exam Keyword: Uniformly distributed across the entire cross-section" },
                { id: 201, targetId: 2, text: "Developed when a load acts parallel (tangential) to the resisting cross-section" },
                { id: 202, targetId: 2, text: "Tends to cause one face of the material to slide over the adjacent face" },
                { id: 203, targetId: 2, text: "Exam Keyword: Maximum at the neutral axis for a rectangular beam section" },
                { id: 301, targetId: 3, text: "Developed due to a bending moment or transverse loading on a beam" },
                { id: 302, targetId: 3, text: "Causes Compression on one side of the Neutral Axis and Tension on the other" },
                { id: 303, targetId: 3, text: "Exam Keyword: Bending stress is exactly zero strictly at the Neutral Axis" },
                { id: 401, targetId: 4, text: "Developed when a twisting moment (Torque) is applied along the longitudinal axis" },
                { id: 402, targetId: 4, text: "Commonly seen in circular shafts transmitting mechanical power" },
                { id: 403, targetId: 4, text: "Exam Keyword: Torsional shear stress is maximum at the outer surface and zero at the center" }
            ]

        };
    </script>

    <div id="desktop-hint">
        <span>📱 Enable <strong>"Desktop Site"</strong> in your mobile browser settings for the absolute best view!</span>
        <button onclick="document.getElementById('desktop-hint').style.display='none'">Dismiss</button>
    </div>

    <div class="header">
        <h1 id="ui-title">Game Title</h1>
        <div class="stats-box">
            <div class="stat-badge" id="score-badge">⭐ <span id="score">0</span></div>
            <div class="stat-badge" id="notes-badge">Bullets Left: <span id="notesLeft">0</span></div>
        </div>
    </div>

    <!-- 65% Height Game Area -->
    <div class="game-area" id="gameArea">
        
        <!-- Left: Fixed Gun Container -->
        <div class="gun-container" id="gunContainer">
            <svg class="gun-svg" viewBox="0 0 320 400" id="gunGraphics">
                <defs>
                    <!-- Red Gun Main Body Gradient -->
                    <linearGradient id="gunRed" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ef4444" />
                        <stop offset="50%" stop-color="#dc2626" />
                        <stop offset="100%" stop-color="#991b1b" />
                    </linearGradient>
                    <!-- Dark/Black Components Gradient -->
                    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#1e293b" />
                        <stop offset="100%" stop-color="#020617" />
                    </linearGradient>
                    <filter id="shadow">
                        <feDropShadow dx="6" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.8"/>
                    </filter>
                </defs>

                <!-- MP4/SMG Gun Design -->
                <g filter="url(#shadow)" id="gunBody">
                    <!-- Stock (Black) -->
                    <path d="M 40,195 L 90,195 L 90,225 L 50,250 Z" fill="url(#darkMetal)" />
                    <path d="M 40,195 L 50,250 L 30,240 Z" fill="#020617" />
                    
                    <!-- Grip (Black) -->
                    <path d="M 110,220 L 130,220 L 125,270 L 100,270 Z" fill="url(#darkMetal)" />
                    <!-- Trigger Guard -->
                    <path d="M 130,220 Q 140,240 155,220" fill="none" stroke="#334155" stroke-width="4" />
                    <!-- Trigger -->
                    <line x1="138" y1="220" x2="135" y2="230" stroke="#94a3b8" stroke-width="3" />
                    
                    <!-- Magazine (Black) -->
                    <path d="M 165,220 L 190,220 L 185,290 L 155,290 Z" fill="url(#darkMetal)" />
                    <line x1="160" y1="230" x2="160" y2="280" stroke="#020617" stroke-width="2" />
                    <line x1="170" y1="230" x2="170" y2="280" stroke="#020617" stroke-width="2" />
                    <line x1="180" y1="230" x2="180" y2="280" stroke="#020617" stroke-width="2" />

                    <!-- Main Body (Crimson Red!) -->
                    <rect x="90" y="180" width="130" height="40" rx="4" fill="url(#gunRed)" />
                    <rect x="90" y="180" width="130" height="15" fill="#7f1d1d" opacity="0.6" /> <!-- Top detail shading -->
                    
                    <!-- Barrel (Black) -->
                    <rect x="220" y="190" width="80" height="14" fill="url(#darkMetal)" />
                    <!-- Muzzle brake -->
                    <rect x="280" y="186" width="20" height="22" rx="2" fill="url(#darkMetal)" /> 

                    <!-- Sights (Black) -->
                    <rect x="100" y="170" width="10" height="10" fill="url(#darkMetal)" />
                    <rect x="210" y="175" width="8" height="5" fill="url(#darkMetal)" />
                </g>

                <!-- Loaded Bullet Indicator (Hovering above the gun) -->
                <g id="loadedBullet" style="display: none;">
                    <foreignObject x="-60" y="80" width="350" height="100">
                        <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; justify-content: center; width: 100%;">
                            <div class="high-contrast-tooltip" id="loadedNoteText"></div>
                        </div>
                    </foreignObject>
                    <!-- Connecting line to indicate it's chambered -->
                    <line x1="155" y1="160" x2="155" y2="180" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 2" />
                </g>
                
                <!-- Coordinate tracking point for the muzzle (Invisible) -->
                <circle cx="300" cy="197" r="1" fill="transparent" id="muzzlePoint" />
            </svg>
        </div>

        <!-- Right: Scrolling Targets -->
        <div class="targets-container" id="targetsContainer"></div>
    </div>

    <!-- 35% Height Notes Tray -->
    <div class="tray-container" id="trayContainer"></div>

    <!-- End Game Overlay (Book Chapter Style) -->
    <div class="overlay" id="endScreen">
        <div class="book-summary">
            <h2>Chapter Mastered</h2>
            <p class="score-report">Final Score: <span id="finalScore" style="color:#fbbf24; font-weight:bold;">0</span></p>
            <div id="summaryContent"></div>
        </div>
        <button class="play-btn" onclick="startGame()">Retake Test</button>
    </div>

    <script>
        // --- GUN AND IMPACT AUDIO ENGINE ---
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        const playSound = (type) => {
            if (!audioCtx) return;
            try {
                if (type === 'shoot') {
                    // Gunshot (Noise burst + fast descending pitch)
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    osc.type = 'sawtooth';
                    
                    // Sharp crack
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.15); 
                    
                    gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);

                } else if (type === 'success') {
                    // Metallic Target Ping (High pitch, short decay)
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1400, audioCtx.currentTime); 
                    
                    gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);

                } else if (type === 'error') {
                    // Dull Thud / Ricochet 
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    osc.type = 'square';
                    
                    osc.frequency.setValueAtTime(80, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.2);
                    
                    gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch (e) {}
        };

        document.body.addEventListener('click', initAudio, { once: true });
        document.body.addEventListener('touchstart', initAudio, { once: true });

        // --- GAME LOGIC ---
        const gameData = MASTER_GAME_DATA;
        document.getElementById('ui-title').innerText = gameData.gameTitle;

        let score = 0;
        let notesRemaining = 0;
        let selectedNote = null;
        let isAnimating = false;

        const targetsContainer = document.getElementById('targetsContainer');
        const trayContainer = document.getElementById('trayContainer');
        const scoreEl = document.getElementById('score');
        const notesLeftEl = document.getElementById('notesLeft');
        const gameArea = document.getElementById('gameArea');
        
        const loadedBullet = document.getElementById('loadedBullet');
        const loadedNoteText = document.getElementById('loadedNoteText');
        const muzzlePoint = document.getElementById('muzzlePoint');
        const gunGraphics = document.getElementById('gunGraphics');

        let embeddedCounts = {}; 

        // Dynamic Gun Aiming Tracker
        gameArea.addEventListener('mousemove', (e) => {
            if (!selectedNote || isAnimating) return;
            
            const gunRect = gunGraphics.getBoundingClientRect();
            // Pivot at approximate trigger area (120, 220) relative to SVG
            const pivotX = gunRect.left + (120 / 320) * gunRect.width;
            const pivotY = gunRect.top + (220 / 400) * gunRect.height;
            
            const deltaX = e.clientX - pivotX;
            const deltaY = e.clientY - pivotY;
            const angle = Math.atan2(deltaY, deltaX) * (180 / Math.PI);
            
            // Limit gun rotation range so it doesn't flip upside down
            let clampedAngle = Math.max(-60, Math.min(60, angle));
            
            gunGraphics.style.transform = `rotate(${clampedAngle}deg)`;
        });

        function startGame() {
            score = 0;
            notesRemaining = gameData.notes.length;
            scoreEl.innerText = score;
            notesLeftEl.innerText = notesRemaining;
            selectedNote = null;
            isAnimating = false;
            embeddedCounts = {};
            
            document.getElementById('endScreen').classList.remove('active');
            
            loadedBullet.style.display = 'none';
            gunGraphics.style.transform = 'rotate(0deg)';
            buildTargets();
            buildTray();
        }

        function buildTargets() {
            targetsContainer.innerHTML = '';
            gameData.targets.forEach(target => {
                embeddedCounts[target.id] = 0; 

                const div = document.createElement('div');
                div.className = 'target-wrapper';
                div.id = `target-${target.id}`;
                
                const svg = `
                    <svg class="target-svg" viewBox="0 0 100 100" style="color: ${target.color}">
                        <circle cx="50" cy="50" r="45" fill="#020617" stroke="currentColor" stroke-width="8"/>
                        <circle cx="50" cy="50" r="25" fill="#0f172a" stroke="currentColor" stroke-width="4"/>
                        <circle cx="50" cy="50" r="10" fill="currentColor"/>
                    </svg>
                `;
                
                div.innerHTML = `
                    <div class="embedded-bullets-area" id="embed-area-${target.id}"></div>
                    ${svg}
                    <div class="target-label" style="color: ${target.color}; border-color: ${target.color}">${target.name}</div>
                `;
                
                div.onclick = () => shootTarget(target, div);
                targetsContainer.appendChild(div);
            });
        }

        function buildTray() {
            trayContainer.innerHTML = '';
            const shuffledNotes = [...gameData.notes].sort(() => Math.random() - 0.5);
            
            shuffledNotes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.id = `note-${note.id}`;
                card.innerText = note.text;
                card.onclick = () => loadGun(note, card);
                trayContainer.appendChild(card);
            });
        }

        function loadGun(note, cardElement) {
            if (isAnimating) return;
            initAudio(); // Ensure context is awake

            document.querySelectorAll('.note-card').forEach(c => c.classList.remove('selected'));
            
            selectedNote = note;
            cardElement.classList.add('selected');

            loadedBullet.style.display = 'block';
            loadedNoteText.innerText = note.text;
        }

        function createBulletHTML(text) {
            return `
                <div class="bullet-composition">
                    <div class="bullet-text-layer">
                        <div class="high-contrast-tooltip">${text}</div>
                    </div>
                    <svg width="200" height="20" viewBox="0 0 200 20" style="overflow:visible;">
                        <!-- Glowing Trail -->
                        <line x1="0" y1="10" x2="180" y2="10" stroke="#fef08a" stroke-width="3" stroke-dasharray="15 5" opacity="0.6"/>
                        <!-- Bullet Head -->
                        <path d="M 180 6 L 195 10 L 180 14 Z" fill="#f59e0b" />
                        <!-- Glow effect -->
                        <ellipse cx="185" cy="10" rx="15" ry="5" fill="#f59e0b" opacity="0.5" filter="blur(2px)"/>
                    </svg>
                </div>
            `;
        }

        function createMuzzleFlash(x, y) {
            const flash = document.createElement('div');
            flash.className = 'muzzle-flash';
            flash.style.left = `${x - 20}px`;
            flash.style.top = `${y - 20}px`;
            flash.style.width = '40px';
            flash.style.height = '40px';
            document.body.appendChild(flash);
            
            const anim = flash.animate([
                { transform: 'scale(0.5)', opacity: 1 },
                { transform: 'scale(1.5)', opacity: 0 }
            ], { duration: 100, easing: 'ease-out' });
            
            anim.onfinish = () => flash.remove();
        }

        function shootTarget(targetData, targetEl) {
            if (!selectedNote || isAnimating) return;
            isAnimating = true;

            // Stop CSS tracking transition to snap perfectly to target instantly
            gunGraphics.style.transition = 'none';

            // 1. Calculate Exact Angle to Target Center
            const gunRect = gunGraphics.getBoundingClientRect();
            const pivotX = gunRect.left + (120 / 320) * gunRect.width;
            const pivotY = gunRect.top + (220 / 400) * gunRect.height;
            
            const targetSvgRect = targetEl.querySelector('.target-svg').getBoundingClientRect();
            const endX = targetSvgRect.left + (targetSvgRect.width / 2);
            const endY = targetSvgRect.top + (targetSvgRect.height / 2);

            const deltaToTargetX = endX - pivotX;
            const deltaToTargetY = endY - pivotY;
            const preciseAngle = Math.atan2(deltaToTargetY, deltaToTargetX) * (180 / Math.PI);

            // Rotate Gun to exact angle
            gunGraphics.style.transform = `rotate(${preciseAngle}deg)`;
            
            // Force browser repaint to update muzzle coordinates physically
            void gunGraphics.offsetWidth;

            // 2. Fire Mechanism
            playSound('shoot');
            loadedBullet.style.display = 'none';

            // Calculate actual starting point from rotated muzzle
            const muzzleRect = muzzlePoint.getBoundingClientRect();
            const startX = muzzleRect.left + (muzzleRect.width/2); 
            const startY = muzzleRect.top + (muzzleRect.height/2);

            createMuzzleFlash(startX, startY);
            
            // Apply Gun Recoil Animation (moves backward along the rotated axis)
            gunGraphics.animate([
                { transform: `rotate(${preciseAngle}deg) translateX(0px)` },
                { transform: `rotate(${preciseAngle}deg) translateX(-15px)` },
                { transform: `rotate(${preciseAngle}deg) translateX(0px)` }
            ], { duration: 150, easing: 'ease-out' }).onfinish = () => {
                gunGraphics.style.transition = 'transform 0.1s ease-out'; // Restore hover tracking
            };

            // 3. Bullet Flight
            const flyingBullet = document.createElement('div');
            flyingBullet.className = 'flying-bullet';
            flyingBullet.innerHTML = createBulletHTML(selectedNote.text);
            document.body.appendChild(flyingBullet);

            const flightDeltaX = endX - startX;
            const flightDeltaY = endY - startY;
            const flightAngle = Math.atan2(flightDeltaY, flightDeltaX) * (180 / Math.PI);

            flyingBullet.style.left = `${startX}px`;
            flyingBullet.style.top = `${startY}px`;
            flyingBullet.style.transform = `translate(-100%, -50%) rotate(${flightAngle}deg)`;

            const animation = flyingBullet.animate([
                { transform: `translate(-100%, -50%) rotate(${flightAngle}deg)` },
                { transform: `translate(calc(-100% + ${flightDeltaX}px), calc(-50% + ${flightDeltaY}px)) rotate(${flightAngle}deg)` }
            ], {
                duration: 200, // Fast bullet
                easing: 'linear'
            });

            animation.onfinish = () => {
                flyingBullet.remove();
                evaluateHit(targetData, targetEl, endX, endY, flightAngle);
            };
        }

        function evaluateHit(targetData, targetEl, hitX, hitY, angle) {
            const isCorrect = (selectedNote.targetId === targetData.id);
            const noteCard = document.getElementById(`note-${selectedNote.id}`);

            targetEl.classList.remove('impact-anim');
            void targetEl.offsetWidth; 

            if (isCorrect) {
                playSound('success');
                score += 10;
                notesRemaining--;
                
                targetEl.classList.add('impact-anim'); 
                createExplosion(hitX, hitY, targetData.color);
                showFloatingText("+10", hitX, hitY, "#10b981");
                
                embedBullet(targetData.id, selectedNote.text, angle);
                noteCard.classList.add('hidden'); 
                
                if (notesRemaining === 0) {
                    setTimeout(showWinScreen, 1200);
                }
            } else {
                playSound('error');
                score -= 5;
                
                targetEl.classList.add('impact-anim');
                createExplosion(hitX, hitY, "#ef4444"); 
                showFloatingText("-5", hitX, hitY, "#ef4444");
                
                noteCard.classList.remove('selected'); 
            }

            scoreEl.innerText = score;
            notesLeftEl.innerText = notesRemaining;
            selectedNote = null;
            isAnimating = false;
        }

        function embedBullet(targetId, text, angle) {
            const embedArea = document.getElementById(`embed-area-${targetId}`);
            const bulletCount = embeddedCounts[targetId];
            
            const embedded = document.createElement('div');
            embedded.className = 'embedded-bullet';
            embedded.innerHTML = createBulletHTML(text);
            
            const offsets = [0, -60, 60, -120, 120]; 
            const yOffset = offsets[bulletCount % offsets.length];
            
            embedded.style.top = `calc(50% + ${yOffset}px)`;
            
            const finalAngle = angle + (Math.random() * 6 - 3); // slight random angle for realism
            embedded.style.transform = `translateY(-50%) rotate(${finalAngle}deg)`;
            
            embedArea.appendChild(embedded);
            embeddedCounts[targetId]++;
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.background = color;
                particle.style.boxShadow = `0 0 15px ${color}`;
                
                const size = Math.random() * 6 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                document.body.appendChild(particle);

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 100 + 40;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                const anim = particle.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${dx}px, ${dy}px) scale(0)`, opacity: 0 }
                ], {
                    duration: Math.random() * 400 + 200,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
                });

                anim.onfinish = () => particle.remove();
            }
        }

        function showFloatingText(text, x, y, color) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.innerText = text;
            el.style.color = color;
            el.style.left = `${x - 20}px`;
            el.style.top = `${y - 40}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function showWinScreen() {
            document.getElementById('finalScore').innerText = score;
            
            const summaryContent = document.getElementById('summaryContent');
            summaryContent.innerHTML = '';
            
            gameData.targets.forEach(target => {
                const targetNotes = gameData.notes.filter(n => n.targetId === target.id);
                if(targetNotes.length === 0) return;

                const section = document.createElement('div');
                section.className = 'chapter-section';
                
                let html = `<h3 style="color: ${target.color}">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="${target.color}"><circle cx="12" cy="12" r="10"/></svg>
                                ${target.name}
                            </h3>`;
                
                html += `<ul>`;
                targetNotes.forEach(note => {
                    html += `<li>${note.text}</li>`;
                });
                html += `</ul>`;
                
                section.innerHTML = html;
                summaryContent.appendChild(section);
            });

            document.getElementById('endScreen').classList.add('active');
        }

        // Boot Game
        startGame();

    </script>
</body>
</html>
