<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydraulic & Energy Grade Line Simulator</title>
    <style>
        :root {
            /* Palette Configuration */
            --bg-dash: #0f172a;
            --panel-bg: #1e293b;
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --svg-bg: #fafafa;
            --fluid-blue: #e0f7fa;
            --pipe-grey: #b0bec5;
            --earth-warm: #8d6e63;
            --earth-dark: #4e342e;
            --pump-grey: #607d8b;
            --hgl-color: #03a9f4;
            --egl-color: #ff5722;
            --label-dark: #212121;
            
            /* Dynamic Physics Variables */
            --sim-progress: 0;
            --hgl-length: 1500;
            --egl-length: 1500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dash);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .dashboard {
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 1280px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .titles h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            margin-bottom: 6px;
        }

        .titles p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .status-badge {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .canvas-container {
            background: var(--svg-bg);
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .controls-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(0,0,0,0.2);
            padding: 16px;
            border-radius: 12px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            background: #334155;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            font-family: inherit;
        }

        button:hover {
            background: #475569;
        }

        button:active {
            transform: scale(0.96);
        }

        .slider-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* SVG Animations & Dynamic Styles */
        .grade-line {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke-dashoffset 0.1s linear;
        }

        #hgl-path {
            stroke: var(--hgl-color);
            stroke-width: 4;
            stroke-dasharray: var(--hgl-length);
            stroke-dashoffset: calc(var(--hgl-length) - (var(--hgl-length) * var(--sim-progress)));
        }

        #egl-path {
            stroke: var(--egl-color);
            stroke-width: 4;
            stroke-dasharray: 8 8; /* Dotted visually, but we need JS trickery to animate a dashed line properly. 
                                      We will wrap it in a mask to reveal it smoothly. */
        }

        /* The reveal mask for EGL and HGL to support tracing smoothly */
        #reveal-mask-path {
            fill: none;
            stroke: white;
            stroke-width: 600; /* Giant stroke to cover bounding box */
            stroke-dasharray: var(--egl-length);
            stroke-dashoffset: calc(var(--egl-length) - (var(--egl-length) * var(--sim-progress)));
            transition: stroke-dashoffset 0.1s linear;
        }

        .impeller {
            transform-origin: 750px 550px;
            animation: spin 0.8s cubic-bezier(0.36, 0, 0.64, 1) infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .flow-particle {
            fill: none;
            stroke: #ffffff;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 1 30;
            opacity: 0.6;
            animation: flowAnim 1.5s linear infinite;
        }

        @keyframes flowAnim {
            to { stroke-dashoffset: -31; }
        }

        .water-surface {
            fill: none;
            stroke: rgba(255,255,255,0.6);
            stroke-width: 2;
            stroke-dasharray: 20 40;
            animation: ripple 3s linear infinite;
        }

        @keyframes ripple {
            to { stroke-dashoffset: -60; }
        }

        /* Tooltip Logic */
        .svg-tooltip {
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(10px);
            pointer-events: none;
        }

        .svg-tooltip.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Syphon Peak Warning Pulse */
        .pulse-warning {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { filter: drop-shadow(0 0 2px rgba(255,0,0,0.5)); }
            50% { filter: drop-shadow(0 0 15px rgba(255,0,0,0.9)); }
            100% { filter: drop-shadow(0 0 2px rgba(255,0,0,0.5)); }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header-section">
            <div class="titles">
                <h1>Pipeline Energy Dynamics Simulator</h1>
                <p>Interactive tracking of HGL (Hydraulic Grade Line) & EGL (Energy Grade Line)</p>
            </div>
            <div id="status-badge" class="status-badge">Phase: Source Energy</div>
        </div>

        <div class="canvas-container">
            <svg viewBox="0 0 1200 650" id="main-svg">
                <defs>
                    <linearGradient id="terrain-grad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#a1887f"/>
                        <stop offset="40%" stop-color="#8d6e63"/>
                        <stop offset="100%" stop-color="#4e342e"/>
                    </linearGradient>

                    <linearGradient id="pipe-body" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#90a4ae"/>
                        <stop offset="30%" stop-color="#cfd8dc"/>
                        <stop offset="100%" stop-color="#546e7a"/>
                    </linearGradient>

                    <linearGradient id="water-grad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#b2ebf2" stop-opacity="0.9"/>
                        <stop offset="100%" stop-color="#00bcd4" stop-opacity="0.8"/>
                    </linearGradient>

                    <radialGradient id="pump-grad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#78909c"/>
                        <stop offset="80%" stop-color="#455a64"/>
                        <stop offset="100%" stop-color="#263238"/>
                    </radialGradient>

                    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                        <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.3"/>
                    </filter>
                    
                    <filter id="tooltip-shadow">
                        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15"/>
                    </filter>

                    <mask id="reveal-mask">
                        <path id="reveal-mask-path" class="grade-line" 
                              d="M 50,400 L 120,400 L 120,402 C 150,404 180,405 250,410 L 450,420 C 500,422 510,428 550,430 C 590,432 600,438 650,440 L 730,445 M 770,215 L 820,220 C 870,225 880,230 950,235 L 1080,240"/>
                    </mask>
                </defs>

                <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300 M 0,400 L 1200,400 M 0,500 L 1200,500 M 0,600 L 1200,600" stroke="#eceff1" stroke-width="1" fill="none"/>

                <path d="M 0,650 L 0,460 C 80,460 150,470 250,570 L 450,570 C 500,570 510,180 550,180 C 590,180 600,570 650,570 L 730,570 L 820,570 C 870,570 880,350 950,350 L 1200,350 L 1200,650 Z" fill="url(#terrain-grad)"/>

                <path d="M 20,380 L 140,380 L 140,490 C 140,500 130,510 120,510 L 40,510 C 30,510 20,500 20,490 Z" fill="#cfd8dc" stroke="#90a4ae" stroke-width="4"/>
                <path d="M 24,400 L 136,400 L 136,506 L 24,506 Z" fill="url(#water-grad)"/>
                <path d="M 24,400 L 136,400" class="water-surface"/>
                
                <path d="M 1060,280 L 1180,280 L 1180,390 C 1180,400 1170,410 1160,410 L 1080,410 C 1070,410 1060,400 1060,390 Z" fill="#cfd8dc" stroke="#90a4ae" stroke-width="4"/>
                <path d="M 1064,300 L 1176,300 L 1176,406 L 1064,406 Z" fill="url(#water-grad)"/>
                <path d="M 1064,300 L 1176,300" class="water-surface"/>

                <path id="main-pipe" d="M 120,450 C 150,450 180,550 250,550 L 450,550 C 500,550 510,150 550,150 C 590,150 600,550 650,550 L 730,550 M 770,550 L 820,550 C 870,550 880,250 950,250 L 1080,250" fill="none" stroke="url(#pipe-body)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
                
                <path d="M 120,450 C 150,450 180,550 250,550 L 450,550 C 500,550 510,150 550,150 C 590,150 600,550 650,550 L 730,550 M 770,550 L 820,550 C 870,550 880,250 950,250 L 1080,250" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" transform="translate(-3, -4)"/>
                
                <path d="M 120,450 C 150,450 180,550 250,550 L 450,550 C 500,550 510,150 550,150 C 590,150 600,550 650,550 L 730,550 M 770,550 L 820,550 C 870,550 880,250 950,250 L 1080,250" class="flow-particle"/>

                <path d="M 1080,238 Q 1120,238 1130,300 L 1110,300 Q 1100,262 1080,262 Z" fill="#b2ebf2" opacity="0.8"/>
                <path d="M 1080,238 Q 1120,238 1130,300 L 1110,300 Q 1100,262 1080,262 Z" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>

                <g id="piezo-1">
                    <path d="M 345,540 L 345,390 C 345,385 355,385 355,390 L 355,540" fill="none" stroke="#cfd8dc" stroke-width="2" opacity="0.8"/>
                    <path d="M 347,538 L 347,425 L 353,425 L 353,538 Z" fill="url(#water-grad)"/>
                    <path d="M 347,425 L 353,425" stroke="#ffffff" stroke-width="1"/>
                </g>

                <g id="piezo-3">
                    <path d="M 815,540 L 815,190 C 815,185 825,185 825,190 L 825,540" fill="none" stroke="#cfd8dc" stroke-width="2" opacity="0.8"/>
                    <path d="M 817,538 L 817,230 L 823,230 L 823,538 Z" fill="url(#water-grad)"/>
                    <path d="M 817,230 L 823,230" stroke="#ffffff" stroke-width="1"/>
                </g>

                <g id="piezo-2-vacuum">
                    <path d="M 548,140 L 548,110 L 552,110 L 552,140 Z" fill="#78909c"/>
                    <path d="M 550,70 C 561,70 570,79 570,90 C 570,101 561,110 550,110 C 539,110 530,101 530,90 C 530,79 539,70 550,70 Z" fill="#eceff1" stroke="#455a64" stroke-width="3" filter="url(#shadow)"/>
                    <path d="M 550,75 C 558,75 565,82 565,90 C 565,98 558,105 550,105 C 542,105 535,98 535,90 C 535,82 542,75 550,75 Z" fill="#ffffff"/>
                    <path d="M 550,75 L 550,80 M 535,90 L 540,90 M 565,90 L 560,90" stroke="#212121" stroke-width="1.5"/>
                    <path d="M 550,90 L 540,84 L 542,82 Z" fill="#ff5722"/>
                    <path d="M 550,88 C 551,88 552,89 552,90 C 552,91 551,92 550,92 C 549,92 548,91 548,90 C 548,89 549,88 550,88 Z" fill="#212121"/>
                </g>

                <g id="pump-station" filter="url(#shadow)">
                    <path d="M 750,490 C 790,490 810,540 810,570 C 810,610 750,620 720,590 C 690,560 700,490 750,490 Z" fill="url(#pump-grad)" stroke="#37474f" stroke-width="3"/>
                    <path d="M 750,510 C 772,510 790,528 790,550 C 790,572 772,590 750,590 C 728,590 710,572 710,550 C 710,528 728,510 750,510 Z" fill="#263238"/>
                    
                    <g class="impeller">
                        <path d="M 750,550 Q 770,520 785,535 Q 775,545 750,550" fill="#90a4ae"/>
                        <path d="M 750,550 Q 780,570 765,585 Q 755,575 750,550" fill="#90a4ae"/>
                        <path d="M 750,550 Q 730,580 715,565 Q 725,555 750,550" fill="#90a4ae"/>
                        <path d="M 750,550 Q 720,530 735,515 Q 745,525 750,550" fill="#90a4ae"/>
                        <path d="M 750,542 C 754,542 758,546 758,550 C 758,554 754,558 750,558 C 746,558 742,554 742,550 C 742,546 746,542 750,542 Z" fill="#cfd8dc"/>
                    </g>
                </g>

                <g font-family="inherit" font-weight="bold" font-size="12" fill="#455a64">
                    <text x="35" y="365">SOURCE (ELEV. H1)</text>
                    <text x="1065" y="265">DISCHARGE (ELEV. H2 > H1)</text>
                    <text x="710" y="640">BOOSTER PUMP STATION</text>
                </g>

                <g mask="url(#reveal-mask)">
                    <path d="M 50,400 L 120,400 L 120,402 C 150,404 180,405 250,410 L 450,420 C 500,422 510,428 550,430 C 590,432 600,438 650,440 L 730,445 M 770,215 L 820,220 C 870,225 880,230 950,235 L 1080,240" 
                          id="egl-path" fill="none" stroke-linecap="round"/>
                    
                    <path d="M 50,400 L 120,400 L 120,410 C 150,412 180,415 250,420 L 450,430 C 500,432 510,438 550,440 C 590,442 600,448 650,450 L 730,455 M 770,225 L 820,230 C 870,235 880,240 950,245 L 1080,250" 
                          id="hgl-path" fill="none" stroke-linecap="round"/>
                </g>

                <g transform="translate(20, 20)" font-family="inherit" font-size="12">
                    <path d="M 0,0 L 0,60 L 180,60 L 180,0 Z" fill="#ffffff" opacity="0.9" stroke="#eceff1"/>
                    <path d="M 10,20 L 40,20" stroke="#03a9f4" stroke-width="4"/>
                    <text x="50" y="24" fill="#212121" font-weight="bold">HGL (Hydraulic Grade)</text>
                    <path d="M 10,40 L 40,40" stroke="#ff5722" stroke-width="4" stroke-dasharray="4 4"/>
                    <text x="50" y="44" fill="#212121" font-weight="bold">EGL (Energy Grade)</text>
                </g>

                <g id="tooltip-layer">
                    <g class="svg-tooltip" id="tt-1" transform="translate(180, 360)">
                        <path d="M 0,0 C 5,0 10,5 10,10 L 10,35 C 10,40 5,45 0,45 L -200,45 C -205,45 -210,40 -210,35 L -210,10 C -210,5 -205,0 -200,0 Z M -10,45 L 0,55 L 10,45 Z" fill="#1e293b" filter="url(#tooltip-shadow)"/>
                        <text x="-100" y="20" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">HGL = EGL = Total Energy</text>
                        <text x="-100" y="35" fill="#94a3b8" font-size="10" text-anchor="middle">v²/2g is zero at surface</text>
                    </g>

                    <g class="svg-tooltip" id="tt-2" transform="translate(350, 320)">
                        <path d="M 0,0 C 5,0 10,5 10,10 L 10,35 C 10,40 5,45 0,45 L -160,45 C -165,45 -170,40 -170,35 L -170,10 C -170,5 -165,0 -160,0 Z M -10,45 L 0,55 L 10,45 Z" fill="#1e293b" filter="url(#tooltip-shadow)"/>
                        <text x="-80" y="20" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Friction Loss (hf)</text>
                        <text x="-80" y="35" fill="#94a3b8" font-size="10" text-anchor="middle">HGL drops in direction of flow</text>
                    </g>

                    <g class="svg-tooltip pulse-warning" id="tt-3" transform="translate(550, 40)">
                        <path d="M -130,-10 C -125,-10 -120,-5 -120,0 L -120,35 C -120,40 -125,45 -130,45 L -140,45 L -150,55 L -160,45 L -330,45 C -335,45 -340,40 -340,35 L -340,0 C -340,-5 -335,-10 -330,-10 Z" fill="#7f1d1d" filter="url(#tooltip-shadow)"/>
                        <text x="-230" y="10" fill="#fca5a5" font-size="13" font-weight="bold" text-anchor="middle">SYPHON PEAK</text>
                        <text x="-230" y="28" fill="#f8fafc" font-size="11" text-anchor="middle">Pipe is above HGL.</text>
                        <text x="-230" y="40" fill="#f8fafc" font-size="11" text-anchor="middle">Negative (Suction) Pressure!</text>
                    </g>

                    <g class="svg-tooltip" id="tt-4" transform="translate(750, 150)">
                        <path d="M 80,-10 C 85,-10 90,-5 90,0 L 90,35 C 90,40 85,45 80,45 L -20,45 L -30,55 L -40,45 L -100,45 C -105,45 -110,40 -110,35 L -110,0 C -110,-5 -105,-10 -100,-10 Z" fill="#065f46" filter="url(#tooltip-shadow)"/>
                        <text x="-10" y="10" fill="#6ee7b7" font-size="12" font-weight="bold" text-anchor="middle">BOOSTER PUMP</text>
                        <text x="-10" y="25" fill="#f8fafc" font-size="10" text-anchor="middle">Net Head Addition (Hp)</text>
                        <text x="-10" y="38" fill="#f8fafc" font-size="10" text-anchor="middle">Instant vertical energy jump.</text>
                    </g>

                    <g class="svg-tooltip" id="tt-5" transform="translate(1080, 180)">
                        <path d="M 0,0 C 5,0 10,5 10,10 L 10,35 C 10,40 5,45 0,45 L -20,45 L -30,55 L -40,45 L -160,45 C -165,45 -170,40 -170,35 L -170,10 C -170,5 -165,0 -160,0 Z" fill="#1e293b" filter="url(#tooltip-shadow)"/>
                        <text x="-80" y="20" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">FREE DISCHARGE</text>
                        <text x="-80" y="35" fill="#94a3b8" font-size="10" text-anchor="middle">HGL aligns with pipe centerline</text>
                    </g>
                </g>
            </svg>
        </div>

        <div class="controls-wrapper">
            <div class="btn-group">
                <button id="btn-replay" title="Replay">⏮</button>
                <button id="btn-prev" title="Step Backward">⏪</button>
                <button id="btn-play" title="Play/Pause">⏯</button>
                <button id="btn-next" title="Step Forward">Press 👉  </button>
            </div>
            <div class="slider-container">
                <input type="range" id="progress-slider" min="0" max="1000" value="0">
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const root = document.documentElement;
            const slider = document.getElementById('progress-slider');
            const statusBadge = document.getElementById('status-badge');
            
            // Buttons
            const btnReplay = document.getElementById('btn-replay');
            const btnPrev = document.getElementById('btn-prev');
            const btnPlay = document.getElementById('btn-play');
            const btnNext = document.getElementById('btn-next');
            
            // Tooltips
            const tooltips = [
                document.getElementById('tt-1'),
                document.getElementById('tt-2'),
                document.getElementById('tt-3'),
                document.getElementById('tt-4'),
                document.getElementById('tt-5')
            ];

            // Setup accurate lengths for tracing
            const maskPath = document.getElementById('reveal-mask-path');
            const pathLength = maskPath.getTotalLength();
            root.style.setProperty('--egl-length', pathLength);
            root.style.setProperty('--hgl-length', pathLength);

            let isPlaying = false;
            let animationFrame;

            // Phase definitions
            const phases = [
                { threshold: 0,   text: "Source Total Energy: HGL and EGL start together." },
                { threshold: 0.2, text: "Plain Area: Continuous friction loss (hf) visible." },
                { threshold: 0.45, text: "Syphon Peak: Negative (suction) pressure zone." },
                { threshold: 0.65, text: "Pump Station: Adding mechanical head (Hp)." },
                { threshold: 0.9, text: "Final Discharge: Free jet to higher elevation." }
            ];

            function updateState(value) {
                const progress = value / 1000;
                root.style.setProperty('--sim-progress', progress);

                // Update text and tooltips
                let currentPhase = phases[0];
                let activeTooltipIdx = 0;

                for (let i = phases.length - 1; i >= 0; i--) {
                    if (progress >= phases[i].threshold) {
                        currentPhase = phases[i];
                        activeTooltipIdx = i;
                        break;
                    }
                }

                statusBadge.textContent = "Phase: " + currentPhase.text;

                // Toggle tooltip visibility
                tooltips.forEach((tt, idx) => {
                    if (idx === activeTooltipIdx) {
                        tt.classList.add('active');
                    } else {
                        tt.classList.remove('active');
                    }
                });
            }

            function playAnimation() {
                if (!isPlaying) return;
                
                let val = parseInt(slider.value);
                val += 2; // Animation speed
                
                if (val >= 1000) {
                    val = 1000;
                    isPlaying = false;
                }
                
                slider.value = val;
                updateState(val);
                
                if (isPlaying) {
                    animationFrame = requestAnimationFrame(playAnimation);
                }
            }

            // Event Listeners
            slider.addEventListener('input', (e) => {
                isPlaying = false;
                cancelAnimationFrame(animationFrame);
                updateState(e.target.value);
            });

            btnPlay.addEventListener('click', () => {
                isPlaying = !isPlaying;
                if (isPlaying) {
                    if (slider.value >= 1000) slider.value = 0;
                    playAnimation();
                } else {
                    cancelAnimationFrame(animationFrame);
                }
            });

            btnReplay.addEventListener('click', () => {
                isPlaying = false;
                cancelAnimationFrame(animationFrame);
                slider.value = 0;
                updateState(0);
            });

            btnNext.addEventListener('click', () => {
                isPlaying = false;
                cancelAnimationFrame(animationFrame);
                let val = parseInt(slider.value);
                val = Math.min(1000, val + 200);
                slider.value = val;
                updateState(val);
            });

            btnPrev.addEventListener('click', () => {
                isPlaying = false;
                cancelAnimationFrame(animationFrame);
                let val = parseInt(slider.value);
                val = Math.max(0, val - 200);
                slider.value = val;
                updateState(val);
            });

            // Initialize
            updateState(0);
        });
    </script>
</body>
</html>
