<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@700&display=swap');

        :root {
            --bg-dark: #000000;
            --text-main: #f8fafc;
            --accent-gold: #fbbf24;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #0ea5e9;
            --panel-bg: rgba(30, 41, 59, 0.95);
            --panel-border: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column;
            overflow: hidden;
            touch-action: none; 
        }

        /* --- UI SCREENS --- */
        .screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: var(--bg-dark); z-index: 500; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease; overflow-y: auto; padding: 20px;
        }
        .screen.active { opacity: 1; pointer-events: auto; }

        .title-text {
            font-size: 2.2rem; font-weight: 900; margin-bottom: 30px; text-align: center;
            background: linear-gradient(to right, var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase;
        }

        .btn-group { display: flex; gap: 20px; }
        
        button.action-btn {
            background: linear-gradient(135deg, #3b82f6, #10b981); color: #ffffff; border: none; padding: 15px 40px;
            font-size: 1.2rem; font-weight: 900; border-radius: 30px; cursor: pointer;
            box-shadow: 0 8px 15px rgba(59, 130, 246, 0.4); text-transform: uppercase;
        }
        button.action-btn.read-btn {
            background: linear-gradient(135deg, #64748b, #475569); box-shadow: 0 8px 15px rgba(100, 116, 139, 0.4);
        }
        button.action-btn:active { transform: scale(0.95); }

        /* --- READ SCREEN --- */
        .read-container {
            width: 100%; max-width: 600px; background: var(--panel-bg); border: 1px solid var(--panel-border);
            border-radius: 12px; padding: 20px; margin-bottom: 20px; overflow-y: auto; max-height: 70vh;
        }
        .chapter-section { margin-bottom: 20px; }
        .chapter-section h3 { font-size: 1.3rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #475569; padding-bottom: 5px; }
        .chapter-section ul { list-style-type: none; padding-left: 10px; }
        .chapter-section li { font-size: 1rem; color: #e2e8f0; margin-bottom: 8px; position: relative; line-height: 1.4; }
        .chapter-section li::before { content: "➔"; position: absolute; left: -18px; color: var(--accent-green); font-weight: bold; }

        /* --- HEADER --- */
        .header {
            flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px; gap: 8px; background: var(--panel-bg); border-bottom: 2px solid var(--panel-border);
            z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .header.game-active { opacity: 1; pointer-events: auto; }
        
        .stats-box { display: flex; width: 100%; justify-content: space-around; gap: 10px; }
        .stat-badge {
            background: #334155; border: 2px solid; padding: 4px 12px; border-radius: 20px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; font-weight: 700;
            display: flex; align-items: center; gap: 5px; color: #fff;
        }
        #score-badge { border-color: var(--accent-gold); }
        #notes-badge { border-color: var(--accent-blue); }

        /* --- GAME AREA --- */
        .game-area {
            flex: 1; position: relative; overflow: hidden; opacity: 0; pointer-events: none;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            cursor: crosshair;
        }
        .game-area.game-active { opacity: 1; pointer-events: auto; }

        /* --- BIGGER CORNER TARGETS --- */
        .target-node {
            position: absolute; width: 140px; height: 130px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20; transition: transform 0.1s, opacity 0.4s;
        }
        .target-node:active { transform: scale(0.95); }
        
        .target-circle {
            width: 80px; height: 80px; border-radius: 50%; border: 5px solid currentColor;
            background: radial-gradient(circle, currentColor 10%, transparent 20%, transparent 40%, currentColor 50%, transparent 60%);
            box-shadow: 0 0 15px currentColor, inset 0 0 10px currentColor;
            margin-bottom: 8px; position: relative;
        }
        .target-label {
            font-size: 1rem; font-weight: 900; text-align: center;
            background: #334155; padding: 6px 10px; border-radius: 6px;
            color: #fff; border: 2px solid currentColor; line-height: 1.1;
        }

        .pos-tl { top: 15px; left: 10px; }
        .pos-tr { top: 15px; right: 10px; }
        .pos-bl { bottom: 25px; left: 10px; }
        .pos-br { bottom: 25px; right: 10px; }

        .embedded-arrow {
            position: absolute; width: 24px; height: 10px; transform-origin: left center;
            pointer-events: none; z-index: 25;
        }
        .embedded-arrow svg { width: 100%; height: 100%; fill: #e2e8f0; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }

        /* --- CENTER GUN STATION --- */
        .gun-station {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 150px; height: 150px; display: flex; align-items: center; justify-content: center;
            z-index: 30; pointer-events: none;
        }
        #rifleGraphics {
            width: 100%; height: 100%; overflow: visible; transform-origin: center center;
            transition: transform 0.08s cubic-bezier(0.25, 1, 0.5, 1); 
            filter: drop-shadow(0 8px 10px rgba(255,255,255,0.1));
        }

        /* --- LOADED NOTE --- */
        .loaded-note-card {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, 85px);
            padding: 12px 18px; border-radius: 8px; border: 3px solid #cbd5e1; 
            font-size: 1.1rem; font-weight: 900; text-align: center;
            width: max-content; max-width: 280px; z-index: 40; pointer-events: none;
            transition: opacity 0.2s, transform 0.2s, background-color 0.3s;
        }
        .loaded-note-card.hidden { opacity: 0; transform: translate(-50%, 85px) scale(0.5); }

        /* --- ANIMATIONS & EFFECTS --- */
        .flying-projectile {
            position: absolute; z-index: 35; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
        }
        .projectile-body {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 20px; height: 6px; background: #e2e8f0; border-radius: 2px 6px 6px 2px; box-shadow: 0 0 8px #fff;
        }
        .projectile-text {
            position: absolute; background: #fff; color: #000;
            padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 800; white-space: nowrap; 
            max-width: 120px; overflow: hidden; text-overflow: ellipsis; transform: translateY(25px); 
        }

        .float-text {
            position: absolute; font-weight: 900; font-size: 1.8rem;
            pointer-events: none; z-index: 300; text-shadow: 0 2px 4px rgba(255,255,255,0.2);
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -60px) scale(1.3); }
        }

        /* --- END SCREEN --- */
        .end-panel {
            width: 100%; max-width: 400px; background: var(--panel-bg); border: 1px solid var(--panel-border);
            border-radius: 12px; padding: 30px; text-align: center; margin-bottom: 20px;
        }
        .end-panel h2 { font-size: 2rem; color: var(--accent-gold); margin-bottom: 10px; text-transform: uppercase; }
        .end-panel p { font-size: 1.2rem; color: #cbd5e1; margin-bottom: 20px; }

    </style>
</head>
<body>

    <script>
        const MASTER_GAME_DATA = {
            gameTitle: "Dampness: Sources, Prevention & Treatment",
            targets: [
                { id: 1, name: "Sources of Dampness", color: "#3b82f6" },
                { id: 2, name: "Prevention of Dampness", color: "#10b981" },
                { id: 3, name: "Methods of Damp Proofing", color: "#f59e0b" }
            ],
            notes: [
                { id: 101, targetId: 1, text: "Rising moisture from the ground due to capillary action in foundations" },
                { id: 102, targetId: 1, text: "Splashing of heavy rainfall on exposed walls without proper protection" },
                { id: 103, targetId: 1, text: "Condensation of water vapor on cold internal surfaces (poor insulation)" },
                { id: 104, targetId: 1, text: "Defective materials or poor workmanship, like leaky pipes or bad joints" },
                { id: 201, targetId: 2, text: "Provide a Damp Proof Course (DPC) between the foundation and plinth level" },
                { id: 202, targetId: 2, text: "Apply high-quality plastering on all exposed external wall surfaces" },
                { id: 203, targetId: 2, text: "Maintain an adequate roof slope to ensure quick drainage of rainwater" },
                { id: 204, targetId: 2, text: "Ensure plenty of ventilation and sunshine to keep the interiors dry" },
                { id: 301, targetId: 3, text: "Membrane Damp Proofing: Applying a waterproof layer like bitumen or polythene" },
                { id: 302, targetId: 3, text: "Surface Treatment: Coating the surface with water-repellent paints or solutions" },
                { id: 303, targetId: 3, text: "Integral Treatment: Adding special waterproof compounds directly into the wet concrete mix" },
                { id: 304, targetId: 3, text: "Guniting: Spraying a rich cement mortar under high pressure onto the surface" },
                { id: 305, targetId: 3, text: "Grouting: Injecting a thin cement slurry into cracks and voids under pressure" },
                { id: 306, targetId: 3, text: "Cavity Wall: Building two separate wall layers with an air gap to block moisture" }
            ]

        };

        const NOTE_COLORS = ['#fbbf24', '#10b981', '#38bdf8', '#f472b6', '#a78bfa', '#cbd5e1', '#f87171', '#bef264', '#fcd34d'];
    </script>

    <div id="startScreen" class="screen active">
        <h1 class="title-text"> Click on 👇 targets to <br>Shot 🎯 </h1>
        <div class="btn-group">
            <button class="action-btn" onclick="startGame()">Play</button>
            <button class="action-btn read-btn" onclick="showReadScreen()">Read</button>
        </div>
    </div>

    <div id="readScreen" class="screen">
        <div class="read-container" id="readContent"></div>
        <button class="action-btn read-btn" onclick="showStartScreen()">Back</button>
    </div>

    <div class="header" id="gameHeader">
        <div class="stats-box">
            <div class="stat-badge" id="score-badge">⭐ <span id="score">0</span></div>
            <div class="stat-badge" id="notes-badge">Click on 🎯 : <span id="notesCaught">0</span> / <span id="notesTotal">0</span></div>
        </div>
    </div>

    <div class="game-area" id="gameArea">
        <div class="gun-station" id="gunStation">
            <svg id="rifleGraphics" viewBox="0 0 200 200">
                <path d="M 15,90 L 45,90 L 45,110 L 15,115 Z" fill="#f97316" stroke="#c2410c"/>
                <path d="M 10,90 L 15,90 L 15,115 L 10,116 Z" fill="#c2410c"/> 
                <rect x="45" y="94" width="15" height="12" fill="#ea580c"/> 
                
                <path d="M 55,110 L 68,110 L 62,135 L 48,135 Z" fill="#3b82f6" rx="2" stroke="#1d4ed8"/>
                
                <path d="M 80,110 L 95,110 L 92,145 L 75,142 Z" fill="#eab308" stroke="#a16207" stroke-width="1"/>
                
                <rect x="50" y="86" width="65" height="24" rx="3" fill="#ef4444" stroke="#b91c1c"/>
                <path d="M 65,110 C 65,122 78,122 78,110" fill="none" stroke="#b91c1c" stroke-width="3"/>
                <path d="M 72,110 L 72,115 C 72,118 75,118 75,118" fill="none" stroke="#fecaca" stroke-width="2"/>
                
                <rect x="115" y="88" width="45" height="20" rx="2" fill="#10b981" stroke="#047857"/>
                <rect x="120" y="92" width="8" height="4" fill="#047857" rx="1"/>
                <rect x="135" y="92" width="8" height="4" fill="#047857" rx="1"/>
                
                <rect x="160" y="94" width="25" height="8" fill="#d946ef"/>
                <rect x="185" y="92" width="8" height="12" fill="#86198f" rx="1"/>
                
                <path d="M 60,75 L 110,75 L 105,86 L 65,86 Z" fill="#06b6d4"/>
                <rect x="58" y="72" width="5" height="16" fill="#0891b2"/>
                <rect x="108" y="70" width="8" height="20" fill="#0891b2"/>
            </svg>
        </div>
        <div class="loaded-note-card" id="currentNoteCard">Loading...</div>
    </div>

    <div id="endScreen" class="screen">
        <div class="end-panel">
            <h2>Mission Complete</h2>
            <p>Final Score: <span id="finalScore" style="color:#fbbf24; font-weight:900;">0</span></p>
        </div>
        <div class="btn-group">
            <button class="action-btn" onclick="showStartScreen()">Home</button>
            <button class="action-btn read-btn" onclick="startGame()">Replay</button>
        </div>
    </div>

    <script>
        // --- AUDIO ENGINE ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        const playSound = (type) => {
            if (!audioCtx) return;
            try {
                if (type === 'shoot') {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.7, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'correct') {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.8, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'wrong') {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'square'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch (e) {}
        };

        document.body.addEventListener('click', initAudio, { once: true });
        document.body.addEventListener('touchstart', initAudio, { once: true });
        document.body.addEventListener('keydown', initAudio, { once: true });

        function hideAllScreens() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('gameHeader').classList.remove('game-active');
            document.getElementById('gameArea').classList.remove('game-active');
        }

        function showStartScreen() {
            hideAllScreens();
            document.getElementById('startScreen').classList.add('active');
        }

        function showReadScreen() {
            hideAllScreens();
            const rc = document.getElementById('readContent');
            rc.innerHTML = '';
            MASTER_GAME_DATA.targets.forEach(target => {
                const notes = MASTER_GAME_DATA.notes.filter(n => n.targetId === target.id);
                if(notes.length === 0) return;
                let html = `<div class="chapter-section"><h3 style="color: ${target.color}">${target.name}</h3><ul>`;
                notes.forEach(n => { html += `<li>${n.text}</li>`; });
                html += `</ul></div>`;
                rc.innerHTML += html;
            });
            document.getElementById('readScreen').classList.add('active');
        }

        const POSITIONS = ['pos-tl', 'pos-tr', 'pos-bl', 'pos-br'];
        let activeTargets = [];
        let pendingTargets = [];
        let activeQueue = [];
        let noteCounts = {}; 
        
        let score = 0; let caughtCount = 0;
        let isShooting = false; let currentLoadedNote = null;

        function startGame() {
            hideAllScreens();
            document.getElementById('gameHeader').classList.add('game-active');
            document.getElementById('gameArea').classList.add('game-active');
            
            score = 0; caughtCount = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('notesCaught').innerText = caughtCount;
            document.getElementById('notesTotal').innerText = MASTER_GAME_DATA.notes.length;
            
            document.querySelectorAll('.target-node').forEach(t => t.remove());

            let allTargets = [...MASTER_GAME_DATA.targets];
            activeTargets = allTargets.slice(0, 4);
            pendingTargets = allTargets.slice(4);

            activeQueue = [];
            noteCounts = {};

            activeTargets.forEach((t, i) => {
                mountTargetDOM(t, i);
                queueTargetNotes(t.id);
            });

            shuffleQueue();
            loadNextNote();
        }

        function queueTargetNotes(targetId) {
            let notesForTarget = MASTER_GAME_DATA.notes.filter(n => n.targetId === targetId);
            noteCounts[targetId] = notesForTarget.length;
            activeQueue.push(...notesForTarget);
        }

        function shuffleQueue() {
            activeQueue.sort(() => Math.random() - 0.5);
        }

        function mountTargetDOM(targetData, posIndex) {
            const gameArea = document.getElementById('gameArea');
            const el = document.createElement('div');
            el.className = `target-node ${POSITIONS[posIndex]}`;
            el.id = `target-node-${targetData.id}`;
            el.style.color = targetData.color;
            
            el.innerHTML = `
                <div class="target-circle"></div>
                <div class="target-label" style="border-color:${targetData.color}">${targetData.name}</div>
            `;
            gameArea.appendChild(el);
        }

        function replaceTarget(oldTargetId) {
            const oldIndex = activeTargets.findIndex(t => t.id === oldTargetId);
            const oldNode = document.getElementById(`target-node-${oldTargetId}`);
            
            if (oldNode) {
                oldNode.style.opacity = '0';
                setTimeout(() => oldNode.remove(), 300);
            }

            if (pendingTargets.length > 0) {
                let newTarget = pendingTargets.shift();
                activeTargets[oldIndex] = newTarget;
                
                setTimeout(() => {
                    mountTargetDOM(newTarget, oldIndex);
                    queueTargetNotes(newTarget.id);
                    shuffleQueue();
                }, 300);
            } else {
                activeTargets.splice(oldIndex, 1);
            }
        }

        function loadNextNote() {
            const card = document.getElementById('currentNoteCard');
            if (activeQueue.length === 0) {
                setTimeout(() => {
                    hideAllScreens();
                    document.getElementById('finalScore').innerText = score;
                    document.getElementById('endScreen').classList.add('active');
                }, 800);
                return;
            }
            
            currentLoadedNote = activeQueue.shift();
            card.innerText = currentLoadedNote.text;
            
            card.style.backgroundColor = NOTE_COLORS[Math.floor(Math.random() * NOTE_COLORS.length)];
            card.style.color = '#000000';
            card.classList.remove('hidden');
        }

        document.addEventListener('keydown', function(e) {
            if (!document.getElementById('gameArea').classList.contains('game-active')) return;
            if (isShooting || !currentLoadedNote) return;

            let targetPosClass = null;
            if (e.key === '4') targetPosClass = 'pos-tl';
            else if (e.key === '5') targetPosClass = 'pos-tr';
            else if (e.key === '1') targetPosClass = 'pos-bl';
            else if (e.key === '2') targetPosClass = 'pos-br';

            if (targetPosClass) {
                const targetNode = document.querySelector(`.${targetPosClass}`);
                if (targetNode) {
                    const rect = targetNode.getBoundingClientRect();
                    const hitX = rect.left + rect.width / 2;
                    const hitY = rect.top + rect.height / 2;

                    const targetId = parseInt(targetNode.id.replace('target-node-', ''));
                    const targetData = activeTargets.find(t => t.id === targetId);

                    fireGunAt(targetData, targetNode, hitX, hitY);
                }
            }
        });

        document.getElementById('gameArea').addEventListener('pointerdown', function(e) {
            if (!document.getElementById('gameArea').classList.contains('game-active')) return;
            if (isShooting || !currentLoadedNote) return;

            const targetNode = e.target.closest('.target-node');
            const hitX = e.clientX;
            const hitY = e.clientY;

            let targetData = null;
            if (targetNode) {
                const targetId = parseInt(targetNode.id.replace('target-node-', ''));
                targetData = activeTargets.find(t => t.id === targetId);
            }

            fireGunAt(targetData, targetNode, hitX, hitY);
        });

        function fireGunAt(targetData, targetElement, hitX, hitY) {
            isShooting = true; initAudio(); playSound('shoot');
            const card = document.getElementById('currentNoteCard');
            card.classList.add('hidden');

            const gunRect = document.getElementById('gunStation').getBoundingClientRect();
            const gunX = gunRect.left + gunRect.width / 2; const gunY = gunRect.top + gunRect.height / 2;

            const dx = hitX - gunX; const dy = hitY - gunY;
            const angle = Math.atan2(dy, dx) * (180 / Math.PI);
            const isGunFlipped = dx < 0;
            
            const rifle = document.getElementById('rifleGraphics');
            rifle.style.transform = `rotate(${angle}deg) scaleY(${isGunFlipped ? -1 : 1}) translateX(-15px)`;

            const proj = document.createElement('div');
            proj.className = 'flying-projectile';
            proj.innerHTML = `<div class="projectile-body"></div><div class="projectile-text" style="color:#000;">${currentLoadedNote.text}</div>`;
            proj.style.left = `${gunX}px`; proj.style.top = `${gunY}px`;
            proj.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
            document.body.appendChild(proj);

            const duration = Math.hypot(dx, dy) * 1.0; 

            const anim = proj.animate([
                { transform: `translate(-50%, -50%) rotate(${angle}deg)` },
                { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${angle}deg)` }
            ], { duration: duration, easing: 'linear' });

            anim.onfinish = () => {
                proj.remove(); 
                evaluateHit(targetData, targetElement, hitX, hitY, angle);
            };

            setTimeout(() => {
                rifle.style.transform = `rotate(${angle}deg) scaleY(${isGunFlipped ? -1 : 1}) translateX(0px)`;
            }, 80);
        }

        function evaluateHit(targetData, targetElement, hitX, hitY, hitAngle) {
            if (!targetData) {
                playSound('wrong'); score -= 5;
                document.getElementById('score').innerText = score;
                showFloatingText("-5", hitX, hitY, varColor('--accent-red', '#ef4444'));
                setTimeout(() => { isShooting = false; document.getElementById('currentNoteCard').classList.remove('hidden'); }, 400);
                return;
            }

            const isCorrect = (currentLoadedNote.targetId === targetData.id);

            if (isCorrect) {
                playSound('correct'); score += 10; caughtCount++;
                document.getElementById('score').innerText = score;
                document.getElementById('notesCaught').innerText = caughtCount;
                showFloatingText("+10", hitX, hitY, varColor('--accent-green', '#10b981'));
                attachArrow(targetElement, hitAngle);
                noteCounts[targetData.id]--;
                
                setTimeout(() => {
                    if (noteCounts[targetData.id] === 0) replaceTarget(targetData.id);
                    isShooting = false; loadNextNote();
                }, 200);

            } else {
                playSound('wrong'); score -= 5;
                document.getElementById('score').innerText = score;
                showFloatingText("-5", hitX, hitY, varColor('--accent-red', '#ef4444'));
                setTimeout(() => { isShooting = false; document.getElementById('currentNoteCard').classList.remove('hidden'); }, 400);
            }
        }

        function attachArrow(targetNode, angle) {
            const circle = targetNode.querySelector('.target-circle');
            const arrow = document.createElement('div');
            arrow.className = 'embedded-arrow';
            const offsetDist = Math.random() * 18; 
            const offsetAng = Math.random() * Math.PI * 2;
            const ox = Math.cos(offsetAng) * offsetDist;
            const oy = Math.sin(offsetAng) * offsetDist;
            arrow.style.left = `calc(50% + ${ox}px)`;
            arrow.style.top = `calc(50% + ${oy}px)`;
            arrow.style.transform = `translate(-100%, -50%) rotate(${angle}deg)`;
            arrow.innerHTML = `<svg viewBox="0 0 24 24"><path d="M2 12h18M14 6l6 6-6 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;
            circle.appendChild(arrow);
        }

        function showFloatingText(text, x, y, color) {
            const el = document.createElement('div');
            el.className = 'float-text'; el.innerText = text; el.style.color = color;
            el.style.left = `${x}px`; el.style.top = `${y - 30}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function varColor(name, fallback) {
            const val = getComputedStyle(document.documentElement).getPropertyValue(name);
            return val ? val.trim() : fallback;
        }
    </script>
</body>
</html>
