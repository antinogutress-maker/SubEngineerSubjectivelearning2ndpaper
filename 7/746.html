
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@700&display=swap');

        :root {
            --bg-dark: #020617;
            --bg-grid: #0f172a;
            --text-main: #f8fafc;
            --accent-gold: #fbbf24;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #0ea5e9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            color: var(--text-main);
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column;
            overflow: hidden;
            touch-action: none; 
        }

        /* --- HEADER --- */
        .header {
            flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px; gap: 8px; background: rgba(15, 23, 42, 0.95); border-bottom: 2px solid #334155;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); z-index: 50;
        }
        .header h1 {
            font-size: 1.3rem; font-weight: 900;
            background: linear-gradient(to right, #0ea5e9, #10b981);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 1px; text-align: center;
        }
        .stats-box { display: flex; width: 100%; justify-content: space-around; gap: 10px; }
        .stat-badge {
            background: rgba(2, 6, 23, 0.9); border: 2px solid; padding: 4px 12px; border-radius: 20px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; font-weight: 700;
            box-shadow: 0 0 10px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 5px;
        }
        #score-badge { border-color: var(--accent-gold); color: var(--accent-gold); }
        #notes-badge { border-color: var(--accent-blue); color: var(--accent-blue); }

        /* --- GAME AREA --- */
        .game-area {
            flex: 1; position: relative;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            overflow: hidden;
        }

        /* --- CORNER TARGETS (Medium Size) --- */
        .target-node {
            position: absolute; width: 120px; height: 110px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; z-index: 20; transition: transform 0.1s;
        }
        .target-node:active { transform: scale(0.9); }
        
        .target-circle {
            width: 55px; height: 55px; border-radius: 50%;
            border: 4px solid currentColor;
            background: radial-gradient(circle, currentColor 10%, transparent 20%, transparent 40%, currentColor 50%, transparent 60%);
            box-shadow: 0 0 20px currentColor, inset 0 0 15px currentColor;
            margin-bottom: 6px;
        }
        .target-label {
            font-size: 0.85rem; font-weight: 900; text-align: center;
            background: rgba(2, 6, 23, 0.8); padding: 5px 8px; border-radius: 6px;
            color: #fff; border: 1px solid currentColor; line-height: 1.1;
        }

        /* Corners */
        .pos-tl { top: 15px; left: 10px; }
        .pos-tr { top: 15px; right: 10px; }
        .pos-bl { bottom: 25px; left: 10px; }
        .pos-br { bottom: 25px; right: 10px; }

        /* --- CENTER GUN STATION --- */
        .gun-station {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 140px; height: 140px; 
            display: flex; align-items: center; justify-content: center;
            z-index: 30; pointer-events: none;
        }

        #rifleGraphics {
            width: 100%; height: 100%; overflow: visible;
            transform-origin: center center;
            /* Fast transition for snappy aiming and recoil */
            transition: transform 0.08s cubic-bezier(0.25, 1, 0.5, 1); 
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.8));
        }

        /* --- LOADED NOTE (Readable Size) --- */
        .loaded-note-card {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, 85px);
            background: #fbbf24; color: #000;
            padding: 12px 18px; border-radius: 8px;
            border: 3px solid #b45309; box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            font-size: 1.1rem; font-weight: 900; text-align: center;
            width: max-content; max-width: 280px; z-index: 40;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
        }
        .loaded-note-card.hidden { opacity: 0; transform: translate(-50%, 85px) scale(0.5); }

        /* --- ANIMATIONS & EFFECTS --- */
        .flying-projectile {
            position: absolute; z-index: 35; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
        }

        .projectile-text {
            position: absolute; background: #fbbf24; color: #000;
            padding: 4px 8px; border-radius: 4px; border: 2px solid #b45309;
            font-size: 0.8rem; font-weight: 800; white-space: nowrap; 
            max-width: 120px; overflow: hidden; text-overflow: ellipsis;
            transform: translateY(25px); 
        }

        .particle { position: absolute; border-radius: 50%; pointer-events: none; z-index: 100; }
        
        .float-text {
            position: absolute; font-weight: 900; font-size: 1.8rem;
            pointer-events: none; z-index: 300; text-shadow: 0 3px 8px rgba(0,0,0,1);
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -60px) scale(1.3); }
        }

        /* --- END SCREEN --- */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(2, 6, 23, 0.98); display: flex; flex-direction: column; align-items: center;
            padding: 40px 20px; z-index: 500; opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease; overflow-y: auto;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }
        
        .book-summary {
            width: 100%; max-width: 400px; background: #0f172a; border: 1px solid #334155;
            border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); margin-bottom: 20px;
        }
        .book-summary h2 {
            font-size: 1.6rem; color: #fbbf24; text-align: center; margin-bottom: 10px;
            text-transform: uppercase; border-bottom: 2px solid #334155; padding-bottom: 10px;
        }
        .book-summary p.score-report { text-align: center; font-size: 1.1rem; color: #94a3b8; margin-bottom: 20px; font-family: 'JetBrains Mono'; }
        .chapter-section { margin-bottom: 20px; }
        .chapter-section h3 { font-size: 1.1rem; color: #38bdf8; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .chapter-section ul { list-style-type: none; padding-left: 10px; }
        .chapter-section li { font-size: 0.9rem; color: #e2e8f0; margin-bottom: 8px; position: relative; line-height: 1.4; }
        .chapter-section li::before { content: "➔"; position: absolute; left: -15px; color: #10b981; font-weight: bold; }
        button.play-btn {
            background: linear-gradient(135deg, #0ea5e9, #10b981); color: #000; border: none; padding: 15px 40px;
            font-size: 1.2rem; font-weight: 900; border-radius: 30px; cursor: pointer;
            box-shadow: 0 8px 15px rgba(14, 165, 233, 0.4); flex-shrink: 0; margin-bottom: 20px;
        }
        button.play-btn:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <script>
        const MASTER_GAME_DATA = {
            gameTitle: "Formwork and Curing Essentials",
            targets: [
                { id: 1, name: "Requirements of Formwork", color: "#3b82f6" },
                { id: 2, name: "Types of Curing", color: "#10b981" }
            ],
            notes: [
                { id: 101, targetId: 1, text: "Must be strong enough to resist both dead loads (concrete) and live loads (workers)" },
                { id: 102, targetId: 1, text: "Should be easy to strip (remove) without damaging the concrete surface or edges" },
                { id: 103, targetId: 1, text: "Must be rigid enough to keep deformation within strictly permissible deflection limits" },
                { id: 104, targetId: 1, text: "Should provide a perfectly smooth and even surface to the finished concrete" },
                { id: 105, targetId: 1, text: "Designed for maximum reusability to keep the overall construction cost low" },
                { id: 201, targetId: 2, text: "Water Curing: Includes ponding on slabs, immersion of cubes, and constant spraying" },
                { id: 202, targetId: 2, text: "Steam Curing: Used strictly for pre-cast concrete to achieve very high early strength" },
                { id: 203, targetId: 2, text: "Membrane Curing: Applying waterproof sheets or liquid films to prevent water evaporation" },
                { id: 204, targetId: 2, text: "Chemical Curing: Using specialized water-retaining compounds on the concrete surface" }
            ]
        };
    </script>

    <div class="header">
        <div class="stats-box">
            <div class="stat-badge" id="score-badge">⭐ <span id="score">0</span></div>
            <div class="stat-badge" id="notes-badge">Sorted: <span id="notesCaught">0</span> / <span id="notesTotal">0</span></div>
        </div>
    </div>

    <div class="game-area" id="gameArea">
        <div class="gun-station" id="gunStation">
            <!-- Realistic Side-View Rifle SVG -->
            <svg id="rifleGraphics" viewBox="0 0 200 200">
                <defs>
                    <linearGradient id="gunMetal" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#64748b" />
                        <stop offset="50%" stop-color="#475569" />
                        <stop offset="100%" stop-color="#334155" />
                    </linearGradient>
                    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#334155" />
                        <stop offset="100%" stop-color="#0f172a" />
                    </linearGradient>
                </defs>

                <!-- Stock -->
                <path d="M 15,90 L 45,90 L 45,110 L 15,115 Z" fill="url(#darkMetal)" stroke="#0f172a"/>
                <path d="M 10,90 L 15,90 L 15,115 L 10,116 Z" fill="#020617"/> <!-- Stock pad -->
                <rect x="45" y="94" width="15" height="12" fill="#1e293b"/> <!-- Buffer tube -->

                <!-- Pistol Grip -->
                <path d="M 55,110 L 68,110 L 62,135 L 48,135 Z" fill="url(#darkMetal)" rx="2" stroke="#0f172a"/>
                
                <!-- Magazine -->
                <path d="M 80,110 L 95,110 L 92,145 L 75,142 Z" fill="url(#darkMetal)" stroke="#0f172a" stroke-width="1"/>
                <line x1="82" y1="115" x2="79" y2="138" stroke="#0f172a" stroke-width="2"/>
                <line x1="88" y1="115" x2="85" y2="138" stroke="#0f172a" stroke-width="2"/>

                <!-- Receiver / Main Body -->
                <rect x="50" y="86" width="65" height="24" rx="3" fill="url(#gunMetal)" stroke="#1e293b"/>
                
                <!-- Trigger & Guard -->
                <path d="M 65,110 C 65,122 78,122 78,110" fill="none" stroke="#1e293b" stroke-width="3"/>
                <path d="M 72,110 L 72,115 C 72,118 75,118 75,118" fill="none" stroke="#94a3b8" stroke-width="2"/>

                <!-- Barrel Handguard -->
                <rect x="115" y="88" width="45" height="20" rx="2" fill="url(#darkMetal)" stroke="#0f172a"/>
                <!-- Handguard vents -->
                <rect x="120" y="92" width="8" height="4" fill="#0f172a" rx="1"/>
                <rect x="135" y="92" width="8" height="4" fill="#0f172a" rx="1"/>
                <rect x="150" y="92" width="8" height="4" fill="#0f172a" rx="1"/>
                <rect x="120" y="100" width="8" height="4" fill="#0f172a" rx="1"/>
                <rect x="135" y="100" width="8" height="4" fill="#0f172a" rx="1"/>
                <rect x="150" y="100" width="8" height="4" fill="#0f172a" rx="1"/>

                <!-- Barrel Exposed -->
                <rect x="160" y="94" width="25" height="8" fill="url(#gunMetal)"/>
                
                <!-- Muzzle Brake -->
                <rect x="185" y="92" width="8" height="12" fill="#1e293b" rx="1"/>
                <line x1="187" y1="94" x2="187" y2="102" stroke="#020617" stroke-width="1"/>
                <line x1="190" y1="94" x2="190" y2="102" stroke="#020617" stroke-width="1"/>

                <!-- Scope / Sight -->
                <path d="M 60,75 L 110,75 L 105,86 L 65,86 Z" fill="url(#darkMetal)"/>
                <rect x="58" y="72" width="5" height="16" fill="#0f172a"/>
                <rect x="108" y="70" width="8" height="20" fill="#0f172a"/>
                <rect x="70" y="86" width="6" height="4" fill="#1e293b"/>
                <rect x="95" y="86" width="6" height="4" fill="#1e293b"/>

                <!-- Muzzle Flash -->
                <g id="muzzleFlash" style="opacity: 0; transform-origin: 193px 98px;">
                    <polygon points="193,98 215,85 205,98 215,111" fill="#fef08a" filter="drop-shadow(0 0 5px #ef4444)"/>
                    <polygon points="193,98 225,95 235,98 225,101" fill="#fff"/>
                </g>
            </svg>
        </div>

        <div class="loaded-note-card" id="currentNoteCard">Loading...</div>
    </div>

    <div class="overlay" id="endScreen">
        <div class="book-summary">
            <h2>Mission Complete</h2>
            <p class="score-report">Final Score: <span id="finalScore" style="color:#fbbf24; font-weight:bold;">0</span></p>
            <div id="summaryContent"></div>
        </div>
        <button class="play-btn" onclick="startGame()">Retake Test</button>
    </div>

    <script>
        // --- AUDIO ENGINE ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        const playSound = (type) => {
            if (!audioCtx) return;
            try {
                if (type === 'shoot') {
                    // Realistic snap sound
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.8, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'correct') {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'wrong') {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'square'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.6, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {}
        };

        document.body.addEventListener('click', initAudio, { once: true });
        document.body.addEventListener('touchstart', initAudio, { once: true });

        // --- GAME VARIABLES ---
        const gameData = MASTER_GAME_DATA;
        document.getElementById('notesTotal').innerText = gameData.notes.length;

        const gameArea = document.getElementById('gameArea');
        const scoreEl = document.getElementById('score');
        const caughtEl = document.getElementById('notesCaught');
        
        const gunStation = document.getElementById('gunStation');
        const rifleGraphics = document.getElementById('rifleGraphics');
        const muzzleFlash = document.getElementById('muzzleFlash');
        const currentNoteCard = document.getElementById('currentNoteCard');

        let score = 0;
        let caughtCount = 0;
        let pendingQueue = []; 
        let currentLoadedNote = null;
        let isShooting = false;
        let currentGunAngle = 0;
        let isGunFlipped = false;

        function buildTargets() {
            document.querySelectorAll('.target-node').forEach(t => t.remove());

            const count = gameData.targets.length;
            let positions = [];
            
            if (count === 2) {
                positions = ['pos-tl', 'pos-br'];
            } else if (count === 3) {
                positions = ['pos-tl', 'pos-tr', 'pos-bl'];
            } else {
                positions = ['pos-tl', 'pos-tr', 'pos-bl', 'pos-br'];
            }

            gameData.targets.forEach((target, index) => {
                if (index >= positions.length) return; 

                const el = document.createElement('div');
                el.className = `target-node ${positions[index]}`;
                el.style.color = target.color;
                
                el.innerHTML = `
                    <div class="target-circle"></div>
                    <div class="target-label" style="border-color:${target.color}">${target.name}</div>
                `;

                const triggerShoot = (e) => {
                    e.preventDefault();
                    if (!isShooting && currentLoadedNote) {
                        fireGunAt(target, el);
                    }
                };

                el.addEventListener('mousedown', triggerShoot);
                el.addEventListener('touchstart', triggerShoot, { passive: false });

                gameArea.appendChild(el);
            });
        }

        function startGame() {
            score = 0;
            caughtCount = 0;
            scoreEl.innerText = score;
            caughtEl.innerText = caughtCount;
            isShooting = false;
            
            buildTargets();
            
            pendingQueue = [...gameData.notes].sort(() => Math.random() - 0.5);
            document.getElementById('endScreen').classList.remove('active');
            
            loadNextNote();
        }

        function loadNextNote() {
            if (pendingQueue.length === 0) {
                setTimeout(showWinScreen, 500);
                return;
            }
            currentLoadedNote = pendingQueue.shift();
            currentNoteCard.innerText = currentLoadedNote.text;
            currentNoteCard.classList.remove('hidden');
        }

        function fireGunAt(targetData, targetElement) {
            isShooting = true;
            initAudio();
            playSound('shoot');
            currentNoteCard.classList.add('hidden');

            const gunRect = gunStation.getBoundingClientRect();
            const targetRect = targetElement.getBoundingClientRect();
            
            const gunX = gunRect.left + gunRect.width / 2;
            const gunY = gunRect.top + gunRect.height / 2;
            const targetX = targetRect.left + targetRect.width / 2;
            const targetY = targetRect.top + targetRect.height / 2;

            const dx = targetX - gunX;
            const dy = targetY - gunY;
            
            // Atan2 gives angle pointing RIGHT by default, matching our SVG side-view
            const angle = Math.atan2(dy, dx) * (180 / Math.PI);
            
            // Flip the gun Y scale if pointing left, to stop it from turning upside down
            isGunFlipped = dx < 0;
            currentGunAngle = angle;
            
            // Apply angle, scale, and a quick backward X translation for recoil effect
            rifleGraphics.style.transform = `rotate(${angle}deg) scaleY(${isGunFlipped ? -1 : 1}) translateX(-15px)`;
            muzzleFlash.style.opacity = '1';

            // Create Ballistic Projectile (Realistic glowing bullet)
            const proj = document.createElement('div');
            proj.className = 'flying-projectile';
            proj.innerHTML = `
                <div style="position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); width:20px; height:6px; background:linear-gradient(to right, #fbbf24, #f59e0b); border-radius: 2px 6px 6px 2px; box-shadow:0 0 8px #f59e0b;"></div>
                <div class="projectile-text">${currentLoadedNote.text}</div>
            `;
            proj.style.left = `${gunX}px`;
            proj.style.top = `${gunY}px`;
            proj.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
            document.body.appendChild(proj);

            const dist = Math.hypot(dx, dy);
            const duration = dist * 1.2; 

            const anim = proj.animate([
                { transform: `translate(-50%, -50%) rotate(${angle}deg)` },
                { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${angle}deg)` }
            ], { duration: duration, easing: 'linear' });

            anim.onfinish = () => {
                proj.remove();
                evaluateHit(targetData, targetX, targetY);
            };

            // Recoil Recovery (Stay pointed at target)
            setTimeout(() => {
                rifleGraphics.style.transform = `rotate(${angle}deg) scaleY(${isGunFlipped ? -1 : 1}) translateX(0px)`;
                muzzleFlash.style.opacity = '0';
            }, 80);
        }

        function evaluateHit(targetData, hitX, hitY) {
            const isCorrect = (currentLoadedNote.targetId === targetData.id);

            if (isCorrect) {
                playSound('correct');
                score += 10;
                caughtCount++;
                scoreEl.innerText = score;
                caughtEl.innerText = caughtCount;
                
                createExplosion(hitX, hitY, targetData.color);
                showFloatingText("+10", hitX, hitY, "#10b981");
                
                setTimeout(() => {
                    isShooting = false;
                    loadNextNote();
                }, 150);
            } else {
                playSound('wrong');
                score -= 5;
                scoreEl.innerText = score;
                
                createExplosion(hitX, hitY, "#ef4444");
                showFloatingText("-5", hitX, hitY, "#ef4444");

                pendingQueue.push(currentLoadedNote);
                
                setTimeout(() => {
                    isShooting = false;
                    loadNextNote();
                }, 400);
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.background = color;
                particle.style.boxShadow = `0 0 8px ${color}`;
                
                const size = Math.random() * 6 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                document.body.appendChild(particle);

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 60 + 20;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                const anim = particle.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`, opacity: 0 }
                ], { duration: 400, easing: 'cubic-bezier(0.25, 1, 0.5, 1)' });
                
                anim.onfinish = () => particle.remove();
            }
        }

        function showFloatingText(text, x, y, color) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.innerText = text;
            el.style.color = color;
            el.style.left = `${x}px`;
            el.style.top = `${y - 30}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function showWinScreen() {
            document.getElementById('finalScore').innerText = score;
            const summaryContent = document.getElementById('summaryContent');
            summaryContent.innerHTML = '';
            
            gameData.targets.forEach(target => {
                const targetNotes = gameData.notes.filter(n => n.targetId === target.id);
                if(targetNotes.length === 0) return;

                const section = document.createElement('div');
                section.className = 'chapter-section';
                let html = `<h3 style="color: ${target.color}">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="${target.color}"><circle cx="12" cy="12" r="10"/></svg>
                                ${target.name}
                            </h3><ul>`;
                targetNotes.forEach(note => { html += `<li>${note.text}</li>`; });
                html += `</ul>`;
                section.innerHTML = html;
                summaryContent.appendChild(section);
            });

            document.getElementById('endScreen').classList.add('active');
        }

        startGame();

    </script>
</body>
</html>
