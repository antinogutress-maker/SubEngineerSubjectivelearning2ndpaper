
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loksewa Civil Engineering Exam Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Serif:wght@400;700&display=swap');

        :root {
            --bg-color: #e2e8f0;
            --paper-bg: #ffffff;
            --primary-accent: #3b82f6;
            /* Question Text Colors */
            --color-1: #1d4ed8; /* Blue */
            --color-2: #be123c; /* Pink/Red */
            --color-3: #c2410c; /* Orange */
            --color-4: #047857; /* Green */
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            color: #1e293b;
        }

        /* --- Dashboard Grid --- */
        #dashboard {
            max-width: 900px;
            margin: 0 auto;
            padding: 50px 20px;
            text-align: center;
        }

        .main-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 50px;
            color: #0f172a;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            perspective: 1500px;
        }

        .exam-card {
            background: white;
            border-radius: 20px;
            aspect-ratio: 1 / 1; 
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #cbd5e1;
        }

        .exam-card:hover {
            transform: translateY(-10px) rotateX(5deg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border-color: var(--primary-accent);
        }

        .exam-card span {
            font-size: 1.6rem;
            font-weight: 700;
            color: #334155;
        }

        /* --- Transitions --- */
        .flipping {
            animation: flipEffect 0.7s forwards;
        }

        @keyframes flipEffect {
            0% { transform: rotateY(0deg) scale(1); opacity: 1; }
            100% { transform: rotateY(180deg) scale(1.5); opacity: 0; }
        }

        /* --- Paper View --- */
        #exam-view {
            display: none;
            max-width: 900px;
            margin: 30px auto;
            background: var(--paper-bg);
            padding: 70px 90px;
            box-shadow: 0 0 60px rgba(0,0,0,0.15);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease-out;
            border-radius: 4px;
            position: relative;
        }

        #exam-view.visible {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .nav-controls {
            position: sticky;
            top: 20px;
            margin-bottom: 30px;
            z-index: 100;
        }

        .back-btn {
            background: #0f172a;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Paper Specific Styles */
        .paper-content {
            font-family: 'Noto Serif', serif;
            color: #000;
            line-height: 1.5;
        }

        .paper-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .paper-header h1 {
            font-size: 2.2rem;
            margin: 0;
            font-weight: 700;
        }

        .header-meta {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-top: 20px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .paper-sub-title {
            text-align: center;
            font-weight: 700;
            margin: 20px 0;
            font-size: 1.2rem;
        }

        .instruction {
            display: block;
            text-align: center;
            text-decoration: underline;
            margin-bottom: 40px;
            font-style: italic;
        }

        .section-box {
            text-align: center;
            background: #eee;
            border: 1px solid #000;
            padding: 6px;
            font-weight: 700;
            margin: 40px 0 20px 0;
            font-size: 1.1rem;
        }

        .category-meta {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            border-bottom: 1px solid #ccc;
            margin-bottom: 15px;
            padding-bottom: 4px;
            font-size: 1.05rem;
        }

        .q-list { list-style: none; padding: 0; margin-bottom: 35px; }
        .q-item { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 1.15rem; }
        .q-text { width: 85%; }
        .q-marks { width: 15%; text-align: right; font-weight: 700; }

        /* Text Colors */
        .color-1 .q-text, .color-1 .q-marks { color: var(--color-1); }
        .color-2 .q-text, .color-2 .q-marks { color: var(--color-2); }
        .color-3 .q-text, .color-3 .q-marks { color: var(--color-3); }
        .color-4 .q-text, .color-4 .q-marks { color: var(--color-4); }

        @media (max-width: 800px) {
            .grid-container { grid-template-columns: repeat(2, 1fr); }
            #exam-view { padding: 40px 25px; margin: 10px; }
            .paper-header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    </div>

            <button class="back-btn" onclick="closePaper()">← Return to Dashboard</button>

        <div class="paper-content" id="paper-body"></div>
    </div>

                        ["4. Differentiate between pipe flow and open channel flow.", "(5)"],
                        ["5. Methods for water content? Oven dry method procedure.", "(2+3=5)"],

                        ["12. Per capita water demand? Types of water demand.", "(1+4=5)"]
                    ]},

                ]
            },
            {
                id: 7, name: "Exam 7",
                sections: [
                    { title: "Section-A", category: "Short Question", label: "(50 Marks)", color: "color-1", questions: [

                        ["2. What is admixture? Explain its purpose and uses.", "(5)"],

                        ["4. Singly vs Doubly reinforced concrete beam. Reasons for providing doubly.", "(5)"],
                        ["5. If water is flowing through a weir, factors affecting quantity of flow?", "(5)"],
                        ["6. What is OMC? Relation between dry density and moisture content.", "(5)"],

                        ["8. Working stress vs Limit state philosophy for design of RCC structure. Nominal vs Design mix.", "(5+5=10)"]
                    ]},

                        ["9. How is strength of concrete determined? Explain procedure in detail.", "(5)"],
                        ["10. Different methods of irrigation used in Nepal.", "(5)"],
                        ["11. Prepare analysis of rate for 1:1.5:3 RCC work per 10 m3.", "(5)"],
                        ["12. Minimum info in notice of invitation for bids. Shallow vs Deep well.", "(5)"],
                        ["13. Use of shallow and deep well for water supply in terai.", "(5)"],

                        ["1. Define surveying? Explain principle of surveying.", "(5)"],
                        ["2. Constitution of brick earth? Harmful ingredients.", "(5)"],
                        ["3. SF and BM for cantilever beam with 10KN/M UDL, span 4m.", "(5)"],
                        ["4. Hydro-kinematics vs Hydro-dynamics. Energy in flowing fluids.", "(5)"],
                        ["5. Describe the classification of soil briefly.", "(5)"],

                        ["3. Stress-strain diagram for ductile material and salient points.", "(5)"],
                        ["4. Pascal's law. Formula for frictional loss in pressurized pipe.", "(5)"],
                        ["5. OMC and dry density. Methods for determination of water content.", "(5)"],
                        ["6. One way slab vs Two way slab. Assumptions of flexural bending.", "(5)"],

                    ]},

        const grid = document.getElementById('grid');
        const dashboard = document.getElementById('dashboard');
        const examView = document.getElementById('exam-view');
        const paperBody = document.getElementById('paper-body');

        // Render Dashboard
        exams.forEach((ex, idx) => {
            const card = document.createElement('div');
            card.className = 'exam-card';
            card.innerHTML = `<span>Set ${ex.id}</span>`;
            card.onclick = () => openPaper(idx, card);
            grid.appendChild(card);
        });

        function openPaper(idx, card) {
            let data = exams[idx];
            // Handle copies (Set 3 is Set 2)
            if (data.copyFrom) data = exams[data.copyFrom];

            card.classList.add('flipping');
            setTimeout(() => {
                dashboard.style.display = 'none';
                renderPaper(data);
                examView.style.display = 'block';
                window.scrollTo(0, 0);
                setTimeout(() => examView.classList.add('visible'), 50);
                card.classList.remove('flipping');
            }, 600);
        }

        function closePaper() {
            examView.classList.remove('visible');
            setTimeout(() => {
                examView.style.display = 'none';
                dashboard.style.display = 'block';
            }, 500);
        }

        function renderPaper(exam) {
            let html = `
                <div class="paper-header">
                    <h1>लोक सेवा आयोग</h1>
                    नेपाल इन्जिनियरिङ्ग सेवा, सिभिल समूह अन्तर्गत जनरल/हाइवे/स्यानिटरी/इरिगेशन/हाइड्रोपावर/<br>
                    हाइड्रोलोजी/एयरपोर्ट उपसमूह, राजपत्र अनङ्कित प्रथम श्रेणी (प्राविधिक) पदको<br>
                    प्रतियोगात्मक लिखित परीक्षा
                </div>
                <div class="header-meta">
                    <span>समय: २ घण्टा १५ मिनेट</span>
                    <span>पूर्णाङ्क: १००</span>
                </div>
                <div class="paper-sub-title">
                    पत्र: द्वितीय<br>
                    विषय: सेवा सम्बन्धित कार्य-ज्ञान
                </div>
                <span class="instruction">निम्न प्रश्नहरुको उत्तर Section अनुसार छुट्टाछुट्टै उत्तरपुस्तिकामा लेख्नुपर्नेछ ।</span>
            `;

            exam.sections.forEach(sec => {
                html += `
                    ${sec.title ? `<div class="section-box">${sec.title}</div>` : ''}

                        <div class="category-meta">
                            <span>${sec.category}</span>
                            <span>${sec.label}</span>
                        </div>

                            ${sec.questions.map(q => `
                                <li class="q-item">
                                    <div class="q-text">${q[0]}</div>
                                    <div class="q-marks">${q[1]}</div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            });

            paperBody.innerHTML = html;
        }
    </script>
</body>
</html>
