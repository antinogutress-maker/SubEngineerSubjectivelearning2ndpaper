                    {questionsList.map((q, i) => (
                        <div key={i} className="flex justify-between items-start gap-6 group">
                            <p className={`text-lg md:text-xl font-bold leading-relaxed ${getQuestionColor(i + startIndex)} flex-grow`}>
                                {q.q}
                            </p>
                            <span className="text-slate-400 font-black italic whitespace-nowrap pt-1 text-lg group-hover:text-indigo-500 transition-colors">
                                {q.m}
                            </span>
                        </div>
                    ))}
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-100 p-4 md:p-8 font-sans">
                    {!selectedSubject ? (
                        <div className={`max-w-6xl mx-auto transition-all duration-500 ${isTransitioning ? 'opacity-0 scale-95 blur-sm' : 'opacity-100'}`}>
                            <header className="text-center mb-14">
                                <div className="flex justify-center mb-4">
                                    <IconGraduationCap size={70} className="text-indigo-600" />
                                </div>
                                <h1 className="text-4xl md:text-5xl font-black text-slate-900 tracking-tight uppercase">Subjective Question Bank</h1>
                                <p className="text-slate-500 mt-2 text-lg font-medium">Fully Digitized Library for Civil Engineering</p>
                            </header>

                            <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                {subjectsData.map((s) => (
                                    <div
                                        key={s.id}
                                        onClick={() => handleSubjectSelect(s)}
                                        className="bg-white rounded-2xl aspect-square flex flex-col items-center justify-center p-6 text-center cursor-pointer shadow-md hover:shadow-2xl hover:-translate-y-2 transition-all group border-b-[8px] border-slate-200 hover:border-indigo-600"
                                    >
                                        <div className="w-14 h-14 rounded-full bg-slate-100 flex items-center justify-center text-2xl font-black text-slate-400 mb-4 group-hover:bg-indigo-600 group-hover:text-white transition-colors duration-300">
                                            {s.id}
                                        </div>
                                        <h3 className="font-black text-slate-800 text-[1.1rem] leading-tight group-hover:text-indigo-700">
                                            {s.name}
                                        </h3>
                                        <div className="mt-4 opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1 text-indigo-500 font-bold text-xs tracking-widest">
                                            VIEW PAPER
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div className={`max-w-4xl mx-auto transition-all duration-500 ${isTransitioning ? 'opacity-0 translate-y-8' : 'opacity-100 translate-y-0'}`}>
                            <button
                                onClick={() => setSelectedSubject(null)}
                                className="mb-8 flex items-center gap-2 bg-slate-900 text-white px-6 py-3 rounded-xl font-black shadow-lg hover:bg-indigo-600 transition-all active:scale-95"
                            >
                                <IconChevronLeft size={20} /> BACK TO INDEX
                            </button>

                            <div className="bg-white p-10 md:p-20 shadow-2xl rounded-sm border-t-[16px] border-indigo-700 font-serif leading-relaxed text-black relative">
                                
                                <div className="absolute top-0 right-0 p-10 text-slate-100 text-[10rem] leading-none font-black select-none pointer-events-none -z-0">
                                    {selectedSubject.id}
                                </div>

                                <header className="text-center mb-16 relative z-10 border-b-4 border-slate-100 pb-10">
                                    <h2 className="text-3xl md:text-5xl font-black uppercase tracking-tight mb-4 leading-tight">
                                        {selectedSubject.name}
                                    </h2>
                                    <div className="flex justify-center items-center gap-6">
                                        <div className="h-[2px] w-16 bg-slate-300"></div>
                                        <span className="text-slate-400 font-bold uppercase tracking-widest text-sm">Subjective Model Questions</span>
                                        <div className="h-[2px] w-16 bg-slate-300"></div>
                                    </div>
                                </header>

                                {selectedSubject.sections ? (
                                    <div className="relative z-10">
                                        {selectedSubject.sections.map((section, secIdx) => (
                                            <div key={secIdx} className="mb-16">
                                                <div className="bg-slate-200 text-center py-2 mb-8 border border-slate-400">
                                                    <h3 className="text-xl font-bold uppercase tracking-widest">{section.sectionName}</h3>
                                                </div>
                                                {renderQuestionList(section.questions, secIdx * 100)}
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    renderQuestionList(selectedSubject.questions)
                                )}
                                
                                <footer className="mt-20 pt-10 border-t-2 border-slate-100 flex justify-between items-center text-slate-300">
                                    <div className="flex flex-col">
                                        <span className="font-black text-2xl tracking-tighter">LOKSEWA CIVIL</span>
                                        <span className="text-[10px] uppercase font-bold tracking-widest text-slate-400">Knowledge Bank Digitized</span>
                                    </div>
                                    <div className="flex gap-4">
                                        <IconPrinter size={22} className="cursor-pointer hover:text-indigo-500 transition-colors" />
                                        <IconShare2 size={22} className="cursor-pointer hover:text-indigo-500 transition-colors" />
                                    </div>
                                </footer>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
